<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset="1" stop-color="#05010f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fd2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffb3ec"/>
      <stop offset="0.45" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#4a0f5c"/>
    </radialGradient>
    <linearGradient id="trail" x1="230" y1="108" x2="331" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df9ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7df9ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- planet glow and body -->
  <circle cx="256" cy="256" r="120" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="64" fill="url(#planet)" filter="url(#glow)"/>

  <!-- dashed orbit ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7df9ff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 12"/>

  <!-- satellite trail -->
  <path d="M 230 108.3 A 150 150 0 0 1 331 126.1" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round"/>

  <!-- satellite -->
  <circle cx="331" cy="126" r="20" fill="#7df9ff" fill-opacity="0.25"/>
  <circle cx="331" cy="126" r="9" fill="#7df9ff" filter="url(#glow)"/>
</svg>
