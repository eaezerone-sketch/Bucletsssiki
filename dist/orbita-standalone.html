      test: function (s) { return n(s.stars) >= 30; }
    },
    {
      id: 'nearLight',
      name: { ru: 'Почти световая', en: 'Near Light Speed' },
      desc: { ru: 'Разгонись почти до предела. Физика нервничает.', en: 'Get close to top speed. Physics is nervous.' },
      test: function (s) { return n(s.maxSpeed) >= 900; }
    },
    {
      id: 'triathlon',
      name: { ru: 'Космический триатлон', en: 'Cosmic Triathlon' },
      desc: { ru: 'Рогатка, комета и кротовая нора в одном полёте', en: 'Slingshot, comet and wormhole in one run' },
      test: function (s) { return n(s.slingshots) >= 1 && n(s.comets) >= 1 && n(s.wormholes) >= 1; }
    }
  ];

  var byId = {};
  for (var i = 0; i < list.length; i++) byId[list[i].id] = list[i];

  function lang() {
    try {
      return (ORB.I18N && ORB.I18N.lang) === 'ru' ? 'ru' : 'en';
    } catch (e) {
      return 'en';
    }
  }

  // Resolve an achievement object or id string to the achievement object.
  function resolve(a) {
    if (typeof a === 'string') return byId[a] || null;
    return a || null;
  }

  // Ids stored in ORB.Storage, sanitized to known string entries.
  function readStored() {
    var v;
    try {
      v = ORB.Storage.get(KEY, []);
    } catch (e) {
      v = [];
    }
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var k = 0; k < v.length; k++) {
      if (typeof v[k] === 'string' && byId[v[k]] && out.indexOf(v[k]) === -1) out.push(v[k]);
    }
    return out;
  }

  function writeStored(ids) {
    try {
      ORB.Storage.set(KEY, ids);
    } catch (e) {
      // storage unavailable; achievements still count for this session
    }
  }

  ORB.Achievements = {
    list: list,

    // Array of unlocked achievement ids.
    unlocked: function () {
      return readStored();
    },

    // Tests every still-locked achievement against stats. Persists and returns
    // the newly unlocked achievement objects (empty array if none).
    check: function (stats) {
      var fresh = [];
      if (!stats) return fresh;
      var done = readStored();
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        if (done.indexOf(a.id) !== -1) continue;
        var ok = false;
        try {
          ok = !!a.test(stats);
        } catch (e) {
          ok = false;
        }
        if (ok) {
          done.push(a.id);
          fresh.push(a);
        }
      }
      if (fresh.length) writeStored(done);
      return fresh;
    },

    // Localized name, falling back to English.
    name: function (a) {
      a = resolve(a);
      if (!a) return '';
      return a.name[lang()] || a.name.en;
    },

    // Localized description, falling back to English.
    desc: function (a) {
      a = resolve(a);
      if (!a) return '';
      return a.desc[lang()] || a.desc.en;
    },

    // { got, total } where got counts unlocked achievements from the list.
    count: function () {
      var done = readStored();
      var got = 0;
      for (var i = 0; i < list.length; i++) {
        if (done.indexOf(list[i].id) !== -1) got++;
      }
      return { got: got, total: list.length };
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var POOL = 600;           // fixed number of particle slots, never grows
  var TWO_PI = Math.PI * 2;

  // Per-type defaults. drag: velocity damping per second. grav: px/s^2 (+y is down).
  // size: default base size. Glowing types draw with 'lighter', solid ones with 'source-over'.
  var TYPES = {
    dot:    { drag: 2.5, grav: 0,   size: 2.5, glow: true },
    spark:  { drag: 4,   grav: 0,   size: 1.6, glow: true },
    debris: { drag: 0.6, grav: 420, size: 4,   glow: false },
    smoke:  { drag: 3,   grav: -12, size: 10,  glow: false },
    ember:  { drag: 1.2, grav: -45, size: 2.4, glow: true },
    ring:   { drag: 0,   grav: 0,   size: 0,   glow: true }
  };

  // Pre-allocated slots; reused forever. No per-frame allocation.
  var pool = [];
  for (var i = 0; i < POOL; i++) {
    pool.push({
      alive: false, type: 'dot', color: '#fff', img: null,
      x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1,
      size: 1, drag: 0, grav: 0, rot: 0, spin: 0, r0: 0, r1: 0
    });
  }
  var cursor = 0;

  // Cached soft sprites (smoke blob, ember glow), keyed by kind+color.
  var SPRITE_MAX = 32;
  var sprites = {};
  var spriteCount = 0;

  function getSprite(color, kind) {
    var key = kind + color;
    var c = sprites[key];
    if (c !== undefined) return c;           // may be null if creation failed earlier
    if (spriteCount >= SPRITE_MAX) {         // keep the cache bounded
      sprites = {};
      spriteCount = 0;
    }
    c = null;
    try {
      var size = kind === 'smoke' ? 64 : 32;
      c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var g = c.getContext('2d');
      g.fillStyle = color;
      g.fillRect(0, 0, size, size);
      // Keep the color only where the radial alpha mask is opaque.
      g.globalCompositeOperation = 'destination-in';
      var h = size / 2;
      var rg = g.createRadialGradient(h, h, 0, h, h, h);
      if (kind === 'smoke') {
        rg.addColorStop(0, 'rgba(0,0,0,0.9)');
        rg.addColorStop(0.5, 'rgba(0,0,0,0.4)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
      } else {
        rg.addColorStop(0, 'rgba(0,0,0,1)');
        rg.addColorStop(0.25, 'rgba(0,0,0,0.6)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
      }
      g.fillStyle = rg;
      g.fillRect(0, 0, size, size);
    } catch (e) {
      c = null; // no DOM/canvas available: callers fall back to plain shapes
    }
    sprites[key] = c;
    spriteCount++;
    return c;
  }

  // Random size around the base size (base 0 = type default).
  function sizeFor(type, base) {
    var r = 0.6 + Math.random() * 0.8;
    return (base || TYPES[type].size) * r;
  }

  // Take a free slot; if the pool is full, recycle the slot at the cursor.
  function alloc() {
    var n = POOL;
    for (var k = 0; k < n; k++) {
      var idx = (cursor + k) % n;
      if (!pool[idx].alive) {
        cursor = (idx + 1) % n;
        return pool[idx];
      }
    }
    var s = pool[cursor];
    cursor = (cursor + 1) % n;
    return s;
  }

  function emit(type, x, y, vx, vy, life, color, size, opts) {
    var s = alloc();
    var d = TYPES[type];
    s.alive = true;
    s.type = type;
    s.color = color;
    s.x = x;
    s.y = y;
    s.vx = vx;
    s.vy = vy;
    s.life = life;
    s.maxLife = life;
    s.size = size;
    s.drag = (opts && opts.drag != null) ? opts.drag : d.drag;
    s.grav = (opts && opts.gravity != null) ? opts.gravity : d.grav;
    s.rot = Math.random() * TWO_PI;
    s.spin = (Math.random() - 0.5) * 8;
    s.r0 = 0;
    s.r1 = 0;
    s.img = null;
    if (type === 'smoke') s.img = getSprite(color, 'smoke');
    else if (type === 'ember') s.img = getSprite(color, 'glow');
    return s;
  }

  function drawSmoke(ctx, p, t) {
    var r = p.size * (1 + 1.4 * t);
    ctx.globalAlpha = 0.55 * (1 - t);
    if (p.img) {
      ctx.drawImage(p.img, p.x - r, p.y - r, r * 2, r * 2);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TWO_PI);
      ctx.fill();
    }
  }

  function drawDebris(ctx, p, t) {
    var s = p.size;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    // Irregular 4-gon shard: alternating long/short radii, rotating.
    for (var k = 0; k < 4; k++) {
      var rr = (k & 1) ? s * 0.55 : s;
      var ang = p.rot + k * Math.PI / 2;
      var px = p.x + Math.cos(ang) * rr;
      var py = p.y + Math.sin(ang) * rr;
      if (k === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawDot(ctx, p, t) {
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 - 0.5 * t), 0, TWO_PI);
    ctx.fill();
  }

  function drawEmber(ctx, p, t) {
    var r = p.size * 4 * (1 - 0.3 * t);
    ctx.globalAlpha = 0.9 * (1 - t);
    if (p.img) {
      ctx.drawImage(p.img, p.x - r, p.y - r, r * 2, r * 2);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - 0.5 * t), 0, TWO_PI);
      ctx.fill();
    }
  }

  function drawSpark(ctx, p, t) {
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = p.color;
    ctx.lineCap = 'round';
    ctx.lineWidth = p.size * (1 - 0.5 * t) + 0.4;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    // Streak trails back along the velocity; it shrinks as the spark slows.
    ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05);
    ctx.stroke();
  }

  function drawRing(ctx, p, t) {
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * t, 0, TWO_PI);
    ctx.stroke();
  }

  ORB.Particles = {
    reset: function () {
      for (var i = 0; i < POOL; i++) pool[i].alive = false;
      cursor = 0;
    },

    // Burst of particles flying in random directions with drag.
    // opts (optional): { type: 'dot'|'spark'|'debris'|'smoke'|'ember', gravity, size, drag }
    burst: function (x, y, color, count, speed, life, opts) {
      count = count || 16;
      speed = speed || 160;
      life = life || 0.6;
      var type = (opts && opts.type) || 'dot';
      if (!TYPES[type] || type === 'ring') type = 'dot';
      var base = (opts && opts.size) || 0;
      for (var i = 0; i < count; i++) {
        var a = Math.random() * TWO_PI;
        var s = speed * (0.4 + Math.random() * 0.6);
        emit(type, x, y, Math.cos(a) * s, Math.sin(a) * s,
          life * (0.8 + Math.random() * 0.4), color,
          sizeFor(type, base), opts);
      }
    },

    // Expanding, fading circle.
    ring: function (x, y, color, radius) {
      var r0 = radius || 10;
      var p = emit('ring', x, y, 0, 0, 0.5, color, 0, null);
      p.r0 = r0;
      p.r1 = r0 + 60;
    },

    // Chunks of rotating debris, kicked upward and falling under gravity.
    debris: function (x, y, color, count) {
      count = count || 8;
      for (var i = 0; i < count; i++) {
        var a = Math.random() * TWO_PI;
        var s = 120 + Math.random() * 160;
        emit('debris', x, y, Math.cos(a) * s, Math.sin(a) * s - 60,
          0.9 + Math.random() * 0.6, color, sizeFor('debris', 0), null);
      }
    },

    // One small soft smoke puff drifting slowly upward.
    puff: function (x, y, color) {
      emit('smoke', x, y,
        (Math.random() - 0.5) * 24, -10 - Math.random() * 20,
        0.6 + Math.random() * 0.3, color, sizeFor('smoke', 0), null);
    },

    update: function (dt) {
      for (var i = 0; i < POOL; i++) {
        var p = pool[i];
        if (!p.alive) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.alive = false;
          continue;
        }
        if (p.type === 'ring') continue;
        var k = Math.max(0, 1 - p.drag * dt);
        p.vx *= k;
        p.vy *= k;
        p.vy += p.grav * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.type === 'debris') p.rot += p.spin * dt;
      }
    },

    draw: function (ctx) {
      ctx.save();
      var i, p, t;

      // Pass 1: solid particles (smoke, debris) with normal blending.
      ctx.globalCompositeOperation = 'source-over';
      for (i = 0; i < POOL; i++) {
        p = pool[i];
        if (!p.alive) continue;
        if (p.type !== 'smoke' && p.type !== 'debris') continue;
        t = 1 - p.life / p.maxLife; // 0 at birth, 1 at death
        if (p.type === 'smoke') drawSmoke(ctx, p, t);
        else drawDebris(ctx, p, t);
      }

      // Pass 2: glowing particles with additive blending.
      ctx.globalCompositeOperation = 'lighter';
      for (i = 0; i < POOL; i++) {
        p = pool[i];
        if (!p.alive) continue;
        if (p.type === 'smoke' || p.type === 'debris') continue;
        t = 1 - p.life / p.maxLife;
        switch (p.type) {
          case 'dot': drawDot(ctx, p, t); break;
          case 'ember': drawEmber(ctx, p, t); break;
          case 'spark': drawSpark(ctx, p, t); break;
          case 'ring': drawRing(ctx, p, t); break;
        }
      }

      ctx.restore();
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var TWO_PI = Math.PI * 2;

  // Floating score popups (world space).
  var POPUP_POOL = 32;
  var POPUP_LIFE = 1.4;   // total seconds
  var POPUP_FADE = 0.9;   // the last part of the life fades out over this long
  var POPUP_POP = 0.28;   // seconds of the overshoot pop-in
  var POPUP_RISE = 46;    // world px the text drifts up over its life
  var OUTLINE = '#120818';
  var FONT = '"Segoe UI", Roboto, system-ui, -apple-system, Helvetica, Arial, sans-serif';

  // Shockwave rings (world space).
  var RING_POOL = 16;
  var RING_DUR = 0.55;

  // Speed lines at the screen edges (screen space).
  var LINE_POOL = 28;
  var LINE_BAND = 0.14;   // edge band width as a fraction of the view width
  var SPEED_FROM = 0.55;  // setSpeed() values above this show lines

  // Danger vignette colour (alpha comes from the cached gradient + pulse).
  var DANGER_RGB = '255, 40, 70';

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function easeOutBack(p) {
    var c1 = 1.70158, c3 = c1 + 1, q = p - 1;
    return 1 + c3 * q * q * q + c1 * q * q;
  }

  function easeOutCubic(p) {
    var q = 1 - p;
    return 1 - q * q * q;
  }

  // Pools are plain objects allocated once; nothing is allocated per frame.
  var popups = [];
  var rings = [];
  var lines = [];
  for (var i = 0; i < POPUP_POOL; i++) {
    popups.push({ on: false, x: 0, y: 0, text: '', color: '#fff', size: 22, font: '', t: 0 });
  }
  for (var j = 0; j < RING_POOL; j++) {
    rings.push({ on: false, x: 0, y: 0, color: '#fff', maxR: 120, t: 0 });
  }
  for (var k = 0; k < LINE_POOL; k++) {
    lines.push({ side: 1, u: 0, ny: 0, len: 60, spd: 1 });
  }

  var flashColor = '#ffffff';
  var flashA = 0;
  var dangerTarget = 0;
  var dangerCur = 0;
  var dangerPhase = 0;
  var speedTarget = 0;
  var speedCur = 0;

  // Danger vignette cached as a device-resolution sprite (rebuilt only when the view
  // size changes). Blitting it 1:1 is much cheaper than filling a radial gradient every frame.
  var gradW = 0;
  var gradH = 0;
  var gradDpr = 0;
  var dangerCanvas = null;

  function findFree(pool) {
    for (var i = 0; i < pool.length; i++) {
      if (!pool[i].on) return pool[i];
    }
    // Pool full: recycle the oldest entry.
    var oldest = pool[0];
    for (var n = 1; n < pool.length; n++) {
      if (pool[n].t > oldest.t) oldest = pool[n];
    }
    return oldest;
  }

  function respawnLine(l, anywhere) {
    l.side = Math.random() < 0.5 ? -1 : 1;
    l.u = Math.random();
    l.ny = anywhere ? Math.random() : -Math.random() * 0.2;
    l.len = 40 + Math.random() * 110;   // px
    l.spd = 0.6 + Math.random() * 0.7;  // view heights per second at full speed
  }

  function ensureGradient(W, H) {
    var dpr = ORB.View.dpr || 1;
    if (dangerCanvas && W === gradW && H === gradH && dpr === gradDpr) return;
    gradW = W;
    gradH = H;
    gradDpr = dpr;
    if (!dangerCanvas) dangerCanvas = document.createElement('canvas');
    dangerCanvas.width = Math.max(1, Math.round(W * dpr));
    dangerCanvas.height = Math.max(1, Math.round(H * dpr));
    var g = dangerCanvas.getContext('2d');
    g.setTransform(dangerCanvas.width / W, 0, 0, dangerCanvas.height / H, 0, 0);
    var r = Math.sqrt(W * W + H * H) / 2;
    var grad = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, r);
    grad.addColorStop(0, 'rgba(' + DANGER_RGB + ', 0)');
    grad.addColorStop(0.5, 'rgba(' + DANGER_RGB + ', 0)');
    grad.addColorStop(0.8, 'rgba(' + DANGER_RGB + ', 0.35)');
    grad.addColorStop(1, 'rgba(' + DANGER_RGB + ', 0.85)');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
  }

  ORB.FX = {
    // Clear everything (called when a new run starts).
    reset: function () {
      var i;
      for (i = 0; i < popups.length; i++) popups[i].on = false;
      for (i = 0; i < rings.length; i++) rings[i].on = false;
      for (i = 0; i < lines.length; i++) respawnLine(lines[i], true);
      flashA = 0;
      dangerTarget = 0;
      dangerCur = 0;
      speedTarget = 0;
      speedCur = 0;
    },

    // Floating text in world coords: overshoot pop, drifts up, fades out.
    popup: function (x, y, text, color, size) {
      var p = findFree(popups);
      p.on = true;
      p.x = x;
      p.y = y;
      p.text = String(text);
      p.color = color || '#ffffff';
      p.size = size > 0 ? size : 22;
      p.font = '900 ' + p.size + 'px ' + FONT;
      p.t = 0;
    },

    // Expanding ring in world coords.
    shockwave: function (x, y, color, maxR) {
      var r = findFree(rings);
      r.on = true;
      r.x = x;
      r.y = y;
      r.color = color || '#ffffff';
      r.maxR = maxR > 0 ? maxR : 120;
      r.t = 0;
    },

    // Full-screen colour flash; keeps the strongest one until it decays.
    flash: function (color, alpha) {
      var a = clamp01(alpha == null ? 0.5 : alpha);
      if (a >= flashA) {
        flashA = a;
        flashColor = color || '#ffffff';
      }
    },

    // Red pulsing vignette, 0..1. Call every frame; the value is smoothed.
    setDanger: function (v) {
      dangerTarget = clamp01(v);
    },

    // Speed lines at the screen edges, shown only above SPEED_FROM.
    setSpeed: function (v) {
      speedTarget = clamp01((v - SPEED_FROM) / (1 - SPEED_FROM));
    },

    update: function (dt) {
      if (!(dt > 0)) return;
      if (dt > 0.1) dt = 0.1;

      var i, p, r, l;
      for (i = 0; i < popups.length; i++) {
        p = popups[i];
        if (!p.on) continue;
        p.t += dt;
        if (p.t >= POPUP_LIFE) p.on = false;
      }
      for (i = 0; i < rings.length; i++) {
        r = rings[i];
        if (!r.on) continue;
        r.t += dt;
        if (r.t >= RING_DUR) r.on = false;
      }

      flashA *= Math.exp(-5.5 * dt);
      if (flashA < 0.002) flashA = 0;

      dangerCur += (dangerTarget - dangerCur) * Math.min(1, dt * 6);
      dangerPhase = (dangerPhase + dt * (4 + 6 * dangerCur)) % TWO_PI;

      speedCur += (speedTarget - speedCur) * Math.min(1, dt * 5);
      var flow = 0.5 + 0.5 * speedCur;
      for (i = 0; i < lines.length; i++) {
        l = lines[i];
        l.ny += l.spd * flow * dt;
        if (l.ny > 1) respawnLine(l, false);
      }
    },

    // World-space popups and rings. The world transform must already be set.
    drawWorld: function (ctx) {
      var i, p, r, k, e, a, s, u, dy;
      var any = false;
      for (i = 0; i < popups.length && !any; i++) any = popups[i].on;
      for (i = 0; i < rings.length && !any; i++) any = rings[i].on;
      if (!any) return;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';

      for (i = 0; i < rings.length; i++) {
        r = rings[i];
        if (!r.on) continue;
        k = clamp01(r.t / RING_DUR);
        e = easeOutCubic(k);
        a = (1 - k) * (1 - k);
        ctx.strokeStyle = r.color;
        // Soft wide glow, then a crisp core line.
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.maxR * e, 0, TWO_PI);
        ctx.globalAlpha = a * 0.25;
        ctx.lineWidth = 4 + 10 * (1 - k);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.maxR * e, 0, TWO_PI);
        ctx.globalAlpha = a * 0.9;
        ctx.lineWidth = 1.5 + 3 * (1 - k);
        ctx.stroke();
        // a thinner echo ring trails behind the main wave
        if (k > 0.12) {
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.maxR * easeOutCubic((k - 0.12) / 0.88) * 0.7, 0, TWO_PI);
          ctx.globalAlpha = a * 0.4;
          ctx.lineWidth = 1 + 1.5 * (1 - k);
          ctx.stroke();
        }
      }

      for (i = 0; i < popups.length; i++) {
        p = popups[i];
        if (!p.on) continue;
        a = clamp01(p.t / 0.06);
        var fadeAt = POPUP_LIFE - POPUP_FADE;
        if (p.t > fadeAt) a *= clamp01(1 - (p.t - fadeAt) / POPUP_FADE);
        if (a <= 0) continue;
        s = p.t < POPUP_POP ? easeOutBack(p.t / POPUP_POP) : 1;
        if (s <= 0) continue;
        u = clamp01(p.t / POPUP_LIFE);
        dy = POPUP_RISE * (1 - (1 - u) * (1 - u));

        ctx.save();
        ctx.translate(p.x, p.y - dy);
        ctx.scale(s, s);
        if (p.t < POPUP_POP) ctx.rotate((1 - p.t / POPUP_POP) * (p.x % 2 < 1 ? 0.16 : -0.16));
        ctx.globalAlpha = a;
        ctx.font = p.font;
        ctx.lineWidth = Math.max(2, p.size * 0.22);
        ctx.strokeStyle = OUTLINE;
        ctx.strokeText(p.text, 0, 0);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    },

    // Screen-space flash, danger vignette and speed lines.
    // The screen transform must already be set (CSS px).
    drawScreen: function (ctx) {
      var V = ORB.View;
      var W = V.cssW, H = V.cssH;
      if (!W || !H) return;
      if (flashA <= 0 && dangerCur <= 0.004 && speedCur <= 0.01) return;

      var i, l, x, y0, count;
      ctx.save();

      if (flashA > 0) {
        ctx.globalAlpha = flashA;
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, W, H);
      }

      if (dangerCur > 0.004) {
        ensureGradient(W, H);
        var pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(dangerPhase));
        ctx.globalAlpha = clamp01(dangerCur * pulse);
        ctx.drawImage(dangerCanvas, 0, 0, W, H);
      }

      if (speedCur > 0.01) {
        count = Math.ceil(speedCur * LINE_POOL);
        var band = LINE_BAND * W;
        ctx.globalAlpha = speedCur * 0.4;
        ctx.strokeStyle = '#dff6ff';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (i = 0; i < count; i++) {
          l = lines[i];
          y0 = l.ny * H;
          if (y0 > H || y0 + l.len < 0) continue;
          x = l.side < 0 ? l.u * band : W - l.u * band;
          ctx.moveTo(x, y0);
          ctx.lineTo(x, y0 + l.len);
        }
        ctx.stroke();
      }

      ctx.restore();
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  // Satellite color skins, unlocked by best score.
  var list = [
    { id: 'comet', name: { ru: 'Комета', en: 'Comet' }, color: '#7df9ff', trail: '#7df9ff', unlock: 0 },
    { id: 'rose', name: { ru: 'Роза', en: 'Rose' }, color: '#ff5fd2', trail: '#ff5fd2', unlock: 60 },
    { id: 'sun', name: { ru: 'Солнце', en: 'Sun' }, color: '#ffd86b', trail: '#ffd86b', unlock: 150 },
    { id: 'mint', name: { ru: 'Мята', en: 'Mint' }, color: '#7dffb0', trail: '#7dffb0', unlock: 300 },
    { id: 'amethyst', name: { ru: 'Аметист', en: 'Amethyst' }, color: '#b58cff', trail: '#b58cff', unlock: 600 },
    { id: 'ghost', name: { ru: 'Призрак', en: 'Ghost' }, color: '#eef2ff', trail: '#eef2ff', unlock: 1000 }
  ];

  function store() {
    return ORB.Storage;
  }

  function findById(id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function isUnlocked(skin, best) {
    return !!skin && (best || 0) >= skin.unlock;
  }

  function currentId() {
    try {
      var id = store().get('skin', list[0].id);
      return findById(id) ? id : list[0].id;
    } catch (e) {
      return list[0].id;
    }
  }

  function current() {
    var skin = findById(currentId()) || list[0];
    var best = 0;
    try { best = store().getBest(); } catch (e) { best = 0; }
    return isUnlocked(skin, best) ? skin : list[0];
  }

  function select(id) {
    var skin = findById(id);
    var best = 0;
    try { best = store().getBest(); } catch (e) { best = 0; }
    if (!skin || !isUnlocked(skin, best)) return false;
    try { store().set('skin', id); } catch (e) { /* storage unavailable */ }
    return true;
  }

  function name(skin) {
    var lang = ORB.I18N && ORB.I18N.lang;
    if (lang !== 'ru' && lang !== 'en') {
      lang = ((navigator.language || '').indexOf('ru') === 0) ? 'ru' : 'en';
    }
    return skin.name[lang] || skin.name.en;
  }

  ORB.Skins = {
    list: list,
    isUnlocked: isUnlocked,
    currentId: currentId,
    current: current,
    select: select,
    name: name
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  // Parallax layers: [count, scroll factor, max star size, base alpha]
  var LAYERS = [
    { count: 60, factor: 0.05, size: 1.0, alpha: 0.45 },
    { count: 40, factor: 0.15, size: 1.4, alpha: 0.65 },
    { count: 25, factor: 0.3, size: 2.0, alpha: 0.9 }
  ];

  var MOTE_COUNT = 36;      // slow dust motes
  var SHOOTER_COUNT = 2;    // shooting-star pool size
  var NEB_SIZE = 128;       // nebula sprite resolution (soft gradient, upscaled)

  // Flat Float32Array per layer, 4 floats per star: nx, ny, size, phase.
  var layerData = null;
  var motes = null;         // 4 floats per mote: nx, ny, size, phase
  var galaxies = null;      // distant spiral galaxies, sprites rebuilt on resize
  var shooters = null;      // pool of shooting stars
  var shootT = 0;           // seconds until the next shooting star
  var lastT = -1;           // previous draw time, for dt
  var baseCanvas = null;    // static vertical gradient (cached per size)
  var vignetteCanvas = null; // static edge darkening (cached per size)
  var nebulae = [];         // [{ canvas, q }] sprites, repainted when hue steps
  var registered = false;

  function wrap(v, m) {
    return ((v % m) + m) % m;
  }

  function wrapHue(h) {
    return wrap(h, 360);
  }

  // Offscreen canvas at device resolution whose context uses CSS px units.
  function newLayer(w, h) {
    var dpr = ORB.View.dpr || 1;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
    var x = c.getContext('2d');
    x.setTransform(c.width / w, 0, 0, c.height / h, 0, 0);
    return { canvas: c, ctx: x };
  }

  // Base gradient and vignette: depend only on the viewport size. They are blitted 1:1
  // (an unscaled drawImage is far cheaper than a gradient fill or a scaled blit).
  function buildBase(w, h) {
    var C = ORB.CONFIG.COLORS;

    var base = newLayer(w, h);
    var g = base.ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, C.bg1);
    g.addColorStop(1, C.bg2);
    base.ctx.fillStyle = g;
    base.ctx.fillRect(0, 0, w, h);
    baseCanvas = base.canvas;

    var vig = newLayer(w, h);
    var inner = Math.min(w, h) * 0.35;
    var outer = Math.sqrt(w * w + h * h) / 2;
    var vg = vig.ctx.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, outer);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    vig.ctx.fillStyle = vg;
    vig.ctx.fillRect(0, 0, w, h);
    vignetteCanvas = vig.canvas;
  }

  // Paint one distant spiral galaxy (two soft arms + core) into its own sprite.
  function paintGalaxy(g, w, h) {
    var M = ORB.M;
    var R = Math.max(14, Math.min(w, h) * g.rFrac);
    var L = newLayer(R * 2, R * 2);
    var x = L.ctx;
    x.translate(R, R);

    var cg = x.createRadialGradient(0, 0, 0, 0, 0, R * 0.45);
    cg.addColorStop(0, M.hsl(g.hue, 60, 95, 0.9));
    cg.addColorStop(0.4, M.hsl(g.hue, 70, 75, 0.35));
    cg.addColorStop(1, M.hsl(g.hue, 70, 60, 0));
    x.fillStyle = cg;
    x.fillRect(-R, -R, R * 2, R * 2);

    x.save();
    x.scale(1, g.tilt); // inclination: squash the disc
    var i, a, rr, th, t;
    for (i = 0; i < 50; i++) {      // faint dust across the disc
      a = Math.random() * Math.PI * 2;
      rr = R * Math.sqrt(Math.random());
      x.fillStyle = M.hsl(g.hue, 50, 80, 0.12);
      x.beginPath();
      x.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * 0.03, 0, Math.PI * 2);
      x.fill();
    }
    for (var arm = 0; arm < 2; arm++) {  // two logarithmic-ish arms
      for (i = 0; i < 80; i++) {
        t = i / 80;
        th = arm * Math.PI + t * Math.PI * 2.4;
        rr = R * (0.12 + 0.8 * t) + (Math.random() - 0.5) * R * 0.1 * (0.4 + t);
        x.fillStyle = M.hsl(g.hue + 10 * t, 70, 80, 0.6 * (1 - 0.6 * t));
        x.beginPath();
        x.arc(Math.cos(th) * rr, Math.sin(th) * rr, R * (0.05 - 0.025 * t), 0, Math.PI * 2);
        x.fill();
      }
    }
    x.restore();

    g.R = R;
    g.layer = L.canvas;
  }

  function buildGalaxies(w, h) {
    for (var i = 0; i < galaxies.length; i++) paintGalaxy(galaxies[i], w, h);
  }

  // Rebuild every cache that depends on the viewport size.
  function buildStatic() {
    if (!galaxies) return;
    var w = ORB.View.cssW || 1;
    var h = ORB.View.cssH || 1;
    buildBase(w, h);
    buildGalaxies(w, h);
  }

  // Soft radial blob sprite for a nebula, repainted only when its hue steps (2 deg).
  function nebulaSprite(slot, hue, sat, light, alpha) {
    var q = Math.round(wrapHue(hue) / 2);
    var n = nebulae[slot];
    if (n.q === q) return n.canvas;
    n.q = q;
    var x = n.canvas.getContext('2d');
    var c = NEB_SIZE / 2;
    var M = ORB.M;
    x.clearRect(0, 0, NEB_SIZE, NEB_SIZE);
    var g = x.createRadialGradient(c, c, 0, c, c, c);
    g.addColorStop(0, M.hsl(q * 2, sat, light, alpha));
    g.addColorStop(1, M.hsl(q * 2, sat, light, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, NEB_SIZE, NEB_SIZE);
    return n.canvas;
  }

  // Shooting stars: occasional diagonal streak across the upper screen.
  function spawnShooter(s, w, h) {
    var M = ORB.M;
    var sp = M.rand(420, 680);
    var ang = M.rand(0.45, 0.8);
    var dir = Math.random() < 0.5 ? -1 : 1;
    s.on = true;
    s.t = 0;
    s.life = M.rand(0.7, 1.1);
    s.x = M.rand(0.1, 0.9) * w;
    s.y = M.rand(-0.1, 0.4) * h;
    s.vx = Math.cos(ang) * sp * dir;
    s.vy = Math.sin(ang) * sp;
  }

  function updateShooters(dt, w, h) {
    shootT -= dt;
    if (shootT <= 0) {
      for (var i = 0; i < shooters.length; i++) {
        if (!shooters[i].on) { spawnShooter(shooters[i], w, h); break; }
      }
      shootT = ORB.M.rand(6, 13);
    }
    for (var j = 0; j < shooters.length; j++) {
      var s = shooters[j];
      if (!s.on) continue;
      s.t += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.t >= s.life) s.on = false;
    }
  }

  function drawShooters(ctx) {
    var C = ORB.CONFIG.COLORS;
    ctx.lineCap = 'round';
    for (var i = 0; i < shooters.length; i++) {
      var s = shooters[i];
      if (!s.on) continue;
      var fade = Math.min(1, s.t / 0.15) * (1 - s.t / s.life);
      var mx = s.x - s.vx * 0.05, my = s.y - s.vy * 0.05;
      var tx = s.x - s.vx * 0.14, ty = s.y - s.vy * 0.14;
      // Faint outer tail, brighter inner streak, bright head.
      ctx.strokeStyle = C.accent;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = 0.35 * fade;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(mx, my);
      ctx.stroke();
      ctx.strokeStyle = C.text;
      ctx.globalAlpha = 0.9 * fade;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      ctx.fillStyle = C.text;
      ctx.globalAlpha = fade;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ORB.Background = {
    init: function () {
      var M = ORB.M;
      layerData = LAYERS.map(function (L) {
        var arr = new Float32Array(L.count * 4);
        for (var i = 0; i < L.count; i++) {
          arr[i * 4] = Math.random();          // normalized x
          arr[i * 4 + 1] = Math.random();      // normalized y
          arr[i * 4 + 2] = L.size * (0.5 + Math.random() * 0.5);
          arr[i * 4 + 3] = Math.random() * Math.PI * 2; // twinkle phase
        }
        return arr;
      });

      motes = new Float32Array(MOTE_COUNT * 4);
      for (var m = 0; m < MOTE_COUNT; m++) {
        motes[m * 4] = Math.random();
        motes[m * 4 + 1] = Math.random();
        motes[m * 4 + 2] = M.rand(0.8, 2.0);
        motes[m * 4 + 3] = Math.random() * Math.PI * 2;
      }

      // One or two distant galaxies: tiny scroll factors make them feel far away.
      var defs = [
        { nx: M.rand(0.15, 0.4), rFrac: 0.085, factor: 0.03, hue: 42 + M.rand(-8, 8), tilt: M.rand(0.4, 0.6) },
        { nx: M.rand(0.6, 0.85), rFrac: 0.055, factor: 0.045, hue: 205 + M.rand(-8, 8), tilt: M.rand(0.35, 0.7) }
      ];
      var count = Math.random() < 0.5 ? 1 : 2;
      galaxies = [];
      for (var k = 0; k < count; k++) {
        var d = defs[k];
        d.ny = Math.random();
        d.angle = Math.random() * Math.PI * 2;
        d.spin = M.rand(-0.012, 0.012);
        galaxies.push(d);
      }

      shooters = [];
      for (var s = 0; s < SHOOTER_COUNT; s++) {
        shooters.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1 });
      }
      shootT = M.rand(2, 4);
      lastT = -1;

      nebulae = [
        { canvas: document.createElement('canvas'), q: -1 },
        { canvas: document.createElement('canvas'), q: -1 }
      ];
      nebulae[0].canvas.width = nebulae[0].canvas.height = NEB_SIZE;
      nebulae[1].canvas.width = nebulae[1].canvas.height = NEB_SIZE;

      buildStatic();
      if (!registered && ORB.View.onResize) {
        ORB.View.onResize(function () { buildStatic(); });
        registered = true;
      }
    },

    // Caller has already set ORB.View.screenTransform(ctx).
    draw: function (ctx, camY, time) {
      if (!layerData) ORB.Background.init();
      var View = ORB.View;
      var C = ORB.CONFIG.COLORS;
      var M = ORB.M;
      var w = View.cssW;
      var h = View.cssH;
      if (typeof time !== 'number') time = 0;

      // Frame time, clamped so pauses and time jumps never fling the effects.
      var dt = lastT >= 0 ? M.clamp(time - lastT, 0, 0.1) : 0;
      lastT = time;

      ctx.save();
      ctx.globalAlpha = 1;

      // Static base gradient.
      ctx.drawImage(baseCanvas, 0, 0, w, h);

      // Soft nebula blobs; hue drifts slowly with altitude. The small sprite is stretched
      // without smoothing: the gradient is so soft that blocks are invisible, and a
      // nearest-neighbour upscale is ~3x cheaper than a bilinear one.
      var hue = wrapHue(280 + camY * 0.02);
      var hue2 = wrapHue(hue + 60);
      var r = Math.max(w, h) * 0.6;
      var cy1 = h * 0.35 + wrap(camY * 0.03, h * 0.5);
      var cy2 = h * 0.75 + wrap(camY * 0.02 + h * 0.25, h * 0.5);
      var n1 = nebulaSprite(0, hue, 70, 45, 0.16);
      var n2 = nebulaSprite(1, hue2, 80, 50, 0.12);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(n1, w * 0.3 - r, cy1 - r, r * 2, r * 2);
      ctx.drawImage(n2, w * 0.8 - r * 0.8, cy2 - r * 0.8, r * 1.6, r * 1.6);
      ctx.imageSmoothingEnabled = true;

      // Distant spiral galaxies, slowly turning.
      for (var gi = 0; gi < galaxies.length; gi++) {
        var g = galaxies[gi];
        var R = g.R;
        var ext = h + R * 2;
        var gy = wrap(g.ny * ext - camY * g.factor, ext) - R;
        ctx.save();
        ctx.translate(g.nx * w, gy);
        ctx.rotate(g.angle + time * g.spin);
        ctx.drawImage(g.layer, -R, -R, R * 2, R * 2);
        ctx.restore();
      }

      // Star layers: scrolled by camY * factor, wrapped vertically, twinkling.
      ctx.fillStyle = C.text;
      for (var li = 0; li < LAYERS.length; li++) {
        var L = LAYERS[li];
        var data = layerData[li];
        var off = camY * L.factor;
        for (var i = 0; i < data.length; i += 4) {
          var x = data[i] * w;
          var y = wrap(data[i + 1] * h - off, h);
          var s = data[i + 2];
          var tw = 0.6 + 0.4 * Math.sin(time * (1.5 + li) + data[i + 3]);
          ctx.globalAlpha = L.alpha * tw;
          ctx.fillRect(x - s * 0.5, y - s * 0.5, s, s);
        }
      }

      // Dust motes: barely parallax, slow upward drift, faint shimmer.
      ctx.fillStyle = C.accent;
      for (var mi = 0; mi < MOTE_COUNT; mi++) {
        var mx = motes[mi * 4] * w;
        var my = wrap(motes[mi * 4 + 1] * h - camY * 0.08 - time * 5, h);
        var ms = motes[mi * 4 + 2];
        ctx.globalAlpha = 0.14 + 0.1 * Math.sin(time * 0.7 + motes[mi * 4 + 3]);
        ctx.fillRect(mx - ms * 0.5, my - ms * 0.5, ms, ms);
      }

      // Shooting stars.
      updateShooters(dt, w, h);
      drawShooters(ctx);

      // Vignette last, darkening the screen edges.
      ctx.globalAlpha = 1;
      ctx.drawImage(vignetteCanvas, 0, 0, w, h);
      ctx.restore();
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var TAU = Math.PI * 2;
  var SEG = 48;           // polyline segments per orbit ring
  var CULL_MARGIN = 60;   // extra world px kept on screen so rings do not pop at the edges
  var BH_RINGS = 4;       // gravity-well rings per blackhole

  // Unit tables for the ring polyline, built on first use (no trig per segment per frame).
  var COS = null, SIN = null, COS5 = null, SIN5 = null;
  // Latch-zone glow sprites cached by hue bucket (12 buckets of 30 degrees).
  var sprites = {};
  // Visible world rectangle for this frame, reused (no per-frame allocation).
  var vb = { camX: 0, camY: 0, halfW: Infinity, halfH: Infinity };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function fract(v) { return v - Math.floor(v); }
  function wrapHue(h) { return ((h % 360) + 360) % 360; }

  // CSS hsla() string. h in degrees, s and l in percent, a 0..1.
  function hsla(h, s, l, a) {
    return 'hsla(' + wrapHue(h).toFixed(1) + ', ' + s + '%, ' + l + '%, ' + a.toFixed(3) + ')';
  }

  function buildTables() {
    COS = []; SIN = []; COS5 = []; SIN5 = [];
    for (var i = 0; i <= SEG; i++) {
      var th = i * TAU / SEG;
      COS[i] = Math.cos(th);
      SIN[i] = Math.sin(th);
      COS5[i] = Math.cos(5 * th);
      SIN5[i] = Math.sin(5 * th);
    }
  }

  // Compute the visible world rectangle (camera centre and view size / zoom).
  function updateBounds() {
    var cam = ORB.Camera, view = ORB.View;
    var zoom = 1, camX = 0, camY = 0;
    if (cam) {
      var z = typeof cam.getZoom === 'function' ? cam.getZoom() : cam.zoom;
      if (z > 0) zoom = z;
      camX = typeof cam.getX === 'function' ? cam.getX() : (cam.x || 0);
      camY = typeof cam.getY === 'function' ? cam.getY() : (cam.y || 0);
    }
    var vw = 0, vh = 0;
    if (view) {
      vw = view.visibleW ? view.visibleW(zoom) : view.w / zoom;
      vh = view.visibleH ? view.visibleH(zoom) : view.h / zoom;
    }
    vb.camX = camX;
    vb.camY = camY;
    vb.halfW = vw > 0 ? vw / 2 + CULL_MARGIN : Infinity;
    vb.halfH = vh > 0 ? vh / 2 + CULL_MARGIN : Infinity;
  }

  // Largest distance from the planet centre at which anything of it is drawn.
  function ringExtent(p) {
    var R = (p.orbitRadius || 0) * 1.12 + 16;
    if (p.latchRadius > R) R = p.latchRadius;
    if (p.type === 'blackhole' && p.gravityRadius > R) R = p.gravityRadius;
    return R;
  }

  function onScreen(p) {
    var R = ringExtent(p);
    return Math.abs(p.x - vb.camX) < vb.halfW + R && Math.abs(p.y - vb.camY) < vb.halfH + R;
  }

  // Orbit ring as a closed polyline: r = R * (1 + 0.1*amp*sin(5θ - phase)).
  // sin(5θ - φ) = sin5θ·cosφ - cos5θ·sinφ, so only one sin/cos pair is needed per ring.
  function ringPath(ctx, cx, cy, R, amp, phase) {
    ctx.beginPath();
    if (amp < 0.002) {
      ctx.arc(cx, cy, R, 0, TAU);
      return;
    }
    var cp = Math.cos(phase), sp = Math.sin(phase), k = 0.1 * amp;
    for (var i = 0; i <= SEG; i++) {
      var r = R * (1 + k * (SIN5[i] * cp - COS5[i] * sp));
      var x = cx + COS[i] * r, y = cy + SIN[i] * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  // Progress arc starting at 12 o'clock and running clockwise. frac is 0..1.
  function progressArc(ctx, cx, cy, r, frac, color, lw) {
    if (frac <= 0.001) return;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + frac * TAU);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
  }

  // Soft radial glow sprite, cached per hue bucket.
  function glowSprite(hue) {
    var bucket = Math.round(wrapHue(hue) / 30) % 12;
    var spr = sprites[bucket];
    if (spr) return spr;
    var size = 128;
    var c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    var g = c.getContext('2d');
    if (!g) return null;
    var h = bucket * 30, mid = size / 2;
    var grd = g.createRadialGradient(mid, mid, 0, mid, mid, mid);
    grd.addColorStop(0, hsla(h, 90, 75, 0.9));
    grd.addColorStop(0.5, hsla(h, 90, 65, 0.3));
    grd.addColorStop(1, hsla(h, 90, 60, 0));
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    sprites[bucket] = c;
    return c;
  }

  // Faint latch zone; brighter while the flying player is inside the gravity field.
  function drawLatchGlow(ctx, p, player) {
    var R = p.latchRadius;
    if (!(R > 0)) return;
    var f = 0, gR = p.gravityRadius || 0;
    if (player && player.state === 'fly' && gR > 0) {
      var dx = player.x - p.x, dy = player.y - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      f = clamp01(1 - d / gR);
      f = f * f * (3 - 2 * f); // smoothstep
    }
    var alpha = 0.06 + 0.22 * f;
    if (player && player.planet === p) alpha *= 0.4;
    var spr = glowSprite(p.hue || 0);
    if (!spr) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    // Nearest-neighbour upscale: the glow is so soft that blocks are invisible, and it is
    // several times cheaper than a bilinear stretch of the same area.
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(spr, p.x - R, p.y - R, R * 2, R * 2);
    ctx.restore();
  }

  // Blackhole gravity well: rings flowing inward from gravityRadius to the kill radius.
  function drawWell(ctx, p, time) {
    var gR = p.gravityRadius > 0 ? p.gravityRadius : 230;
    var kf = (ORB.CONFIG && ORB.CONFIG.BLACKHOLE_KILL_FACTOR) || 1.4;
    var kill = p.radius * kf;
    if (kill >= gR) return;
    ctx.save();
    ctx.setLineDash([]);
    ctx.lineWidth = 1.2;
    for (var k = 0; k < BH_RINGS; k++) {
      var ph = fract(time * 0.32 + k / BH_RINGS);
      var r = gR - (gR - kill) * ph;
      ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.5; // fade in and out at both ends
      ctx.strokeStyle = hsla(280 - 255 * ph, 85, 72, 1); // violet outside, orange inside
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // The orbit ring: current = solid glow, unvisited = bright flowing dashes, visited = faint.
  function drawRing(ctx, p, player, time) {
    var R = p.orbitRadius;
    if (!(R > 0)) return;
    var cur = !!player && player.planet === p;
    var amp = clamp01(p.ripple || 0), ph = p.ripplePhase || 0;
    var hue = p.hue || 0;
    ctx.save();
    if (cur) {
      var pulse = 0.5 + 0.5 * Math.sin(time * 3);
      ctx.setLineDash([]);
      ringPath(ctx, p.x, p.y, R, amp, ph);
      ctx.strokeStyle = hsla(hue, 90, 75, 0.12 + 0.05 * pulse);
      ctx.lineWidth = 8;
      ctx.stroke();
      ringPath(ctx, p.x, p.y, R, amp, ph);
      ctx.strokeStyle = hsla(hue, 95, 82, 0.6 + 0.2 * pulse + 0.2 * amp);
      ctx.lineWidth = 2 + 2.5 * amp;
      ctx.stroke();
      drawComet(ctx, p, player, hue);
    } else if (p.visited) {
      ctx.setLineDash([]);
      ringPath(ctx, p.x, p.y, R, amp, ph);
      ctx.strokeStyle = hsla(hue, 70, 72, 0.16);
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      // Soft underlay, then the dashes flowing along the ring.
      ringPath(ctx, p.x, p.y, R, amp, ph);
      ctx.setLineDash([]);
      ctx.strokeStyle = hsla(hue, 75, 75, 0.09);
      ctx.lineWidth = 4;
      ctx.stroke();
      ringPath(ctx, p.x, p.y, R, amp, ph);
      ctx.setLineDash([7, 9]);
      ctx.lineDashOffset = -((time * 28) % 16);
      ctx.strokeStyle = hsla(hue, 75, 75, 0.6);
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Bright arc trailing behind the ship along its ring: shows the orbit direction and speed.
  function drawComet(ctx, p, player, hue) {
    var R = p.orbitRadius, a = player.angle;
    if (!(a === a)) return;
    var dir = player.dir || 1, len = 0.9 + 0.5 * clamp01((player.speed || 0) / 500);
    ctx.save();
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    var steps = 4;
    for (var i = 0; i < steps; i++) {
      var f0 = i / steps, f1 = (i + 1) / steps;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, a - dir * len * f1, a - dir * len * f0, dir < 0);
      ctx.globalAlpha = 0.55 * (1 - f0) * (1 - f0);
      ctx.strokeStyle = hsla(hue, 95, 88, 1);
      ctx.lineWidth = 3.2 * (1 - f0 * 0.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Echo rings radiating outward from a freshly hit planet (driven by p.ripple).
  function drawEchoes(ctx, p, hue) {
    var amp = clamp01(p.ripple || 0);
    if (amp < 0.05) return;
    var R = p.orbitRadius;
    ctx.save();
    ctx.setLineDash([]);
    for (var k = 0; k < 2; k++) {
      var f = 1 - amp;
      var r = R * (1.02 + 0.55 * Math.min(1, f * (1.6 + k * 0.8)) + 0.06 * k);
      ctx.globalAlpha = amp * (k ? 0.22 : 0.4);
      ctx.strokeStyle = hsla(hue, 90, 80, 1);
      ctx.lineWidth = (k ? 1 : 2) + 2 * amp;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Heat arc for stars, crumble arc for crumbling planets (both just outside the ring).
  function drawArcs(ctx, p, time) {
    var R = p.orbitRadius;
    if (!(R > 0)) return;
    if (p.type === 'star') {
      var heat = clamp01(p.heat || 0), r = R + 7;
      var pulse = heat > 0.7 ? 0.75 + 0.25 * Math.sin(time * 14) : 1;
      ctx.save();
      ctx.setLineDash([]);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.strokeStyle = 'hsla(50, 100%, 70%, 0.08)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // Yellow (cool) to red (overheated).
      progressArc(ctx, p.x, p.y, r, heat,
        hsla(50 * (1 - heat), 100, 62 - 8 * heat, 0.9 * pulse), 2.5);
      ctx.restore();
    }
    if (p.crumble >= 0 && !p.dead) {
      var c = clamp01(p.crumble);
      // The arc trembles as the planet breaks apart.
      var rc = R + 7 + Math.sin(time * 40 + (p.id | 0)) * 0.8 * c;
      ctx.save();
      ctx.lineCap = 'butt';
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, rc, 0, TAU);
      ctx.strokeStyle = 'hsla(25, 60%, 55%, 0.12)';
      ctx.lineWidth = 2;
      ctx.stroke();
      progressArc(ctx, p.x, p.y, rc, c, 'hsla(25, 90%, 62%, 0.9)', 2.5);
      ctx.restore();
    }
  }

  ORB.RenderOrbits = {
    // planets: array of Planet, world coords. player: the Player (or null).
    // Drawn before the planet bodies.
    draw: function (ctx, planets, time, player) {
      if (!ctx || !planets || !planets.length) return;
      if (!COS) buildTables();
      var t = time || 0;
      var i, p;

      updateBounds();

      ctx.save();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Pass 1: gravity wells and latch-zone glows, beneath the rings.
      for (i = 0; i < planets.length; i++) {
        p = planets[i];
        if (p.dead || !onScreen(p)) continue;
        if (p.type === 'blackhole') drawWell(ctx, p, t);
        else drawLatchGlow(ctx, p, player);
      }

      // Pass 2: rings and progress arcs.
      for (i = 0; i < planets.length; i++) {
        p = planets[i];
        if (p.dead || p.type === 'blackhole' || !onScreen(p)) continue;
        drawRing(ctx, p, player, t);
        drawEchoes(ctx, p, p.hue || 0);
        drawArcs(ctx, p, t);
      }

      ctx.restore();
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var TAU = Math.PI * 2;
  var SUN_STEPS = 8;        // heat is quantised to 8 palette steps
  var DISK_BUCKETS = 12;    // particle colour buckets, inner orange .. outer violet
  var DISK_PER = 8;         // particles per bucket
  var DISK_SQUASH = 0.32;   // accretion disk ellipse ratio (seen from above)

  // Gradients are built in unit space (radius 1) and scaled with the transform
  // at fill time, so one gradient per palette step serves every planet radius.
  var sunCache = null;      // [step] -> {glow, core, ray, prom, hot}
  var bhCache = null;       // {halo, glow, ring, cols}

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

  function rgb(c, alpha) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' +
      Math.round(c[2]) + ',' + alpha + ')';
  }

  // Deterministic pseudo-random in [0, 1) from a seed and an index; no allocation.
  function rnd(seed, n) {
    var s = Math.sin((seed * 0.731 + n) * 12.9898 + n * 78.233) * 43758.5453;
    return s - Math.floor(s);
  }

  // Unit-space radial gradient from [offset, css colour] stops.
  function unitGrad(ctx, stops) {
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    return g;
  }

  // Fill a circle of radius r around the origin with a unit-space gradient.
  function fillUnit(ctx, grad, r) {
    ctx.save();
    ctx.scale(r, r);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ---- Sun -----------------------------------------------------------------

  function sunPalette(ctx, step) {
    if (!sunCache) sunCache = [];
    var c = sunCache[step];
    if (c) return c;
    var t = step / (SUN_STEPS - 1);
    var edge = mix([255, 110, 40], [255, 240, 225], t);   // orange-red -> white-hot
    var mid = mix([255, 196, 80], [255, 250, 240], t);
    var core = mix([255, 246, 205], [255, 255, 255], t);
    var glowC = mix([255, 150, 50], [255, 236, 210], t);
    var flare = mix([255, 120, 30], [255, 240, 215], t);
    c = {
      glow: unitGrad(ctx, [
        [0, rgb(glowC, 0.6)], [0.35, rgb(glowC, 0.32)], [0.7, rgb(glowC, 0.08)], [1, rgb(glowC, 0)]
      ]),
      core: unitGrad(ctx, [
        [0, rgb(core, 1)], [0.55, rgb(mid, 1)], [0.9, rgb(edge, 1)], [1, rgb(edge, 0.85)]
      ]),
      ray: rgb(flare, 0.55),
      prom: rgb(flare, 0.85),
      hot: rgb(core, 1)
    };
    sunCache[step] = c;
    return c;
  }

  // Small sun: breathing glow, flickering corona rays, looping prominences, core.
  function drawStar(ctx, p, time) {
    var R = p.radius || 20;
    var heat = clamp01(p.heat || 0);
    var c = sunPalette(ctx, Math.round(heat * (SUN_STEPS - 1)));
    var seed = p.seed || 0;
    var pulse = 0.5 + 0.5 * Math.sin(time * 1.7 + seed * 0.37);
    var i, a, f, L, hw, cs, sn, mid, lift, span, cr;

    ctx.save();
    ctx.translate(p.x, p.y);

    // 1. breathing outer glow (additive)
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.7 + 0.2 * pulse + 0.1 * heat;
    fillUnit(ctx, c.glow, R * (2.6 + 0.15 * pulse));

    // 2. corona rays, flickering in length; one path, one fill
    ctx.globalAlpha = 1;
    ctx.fillStyle = c.ray;
    ctx.beginPath();
    for (i = 0; i < 12; i++) {
      a = i * TAU / 12 + 0.12 * Math.sin(time * 0.9 + i * 1.7 + seed);
      f = 0.5 + 0.5 * Math.sin(time * (3.5 + (i % 3) * 1.9) + i * 2.9 + seed);
      L = R * (1.5 + 0.9 * f * f * (0.55 + 0.45 * heat));
      hw = R * (0.12 + 0.05 * f);
      cs = Math.cos(a);
      sn = Math.sin(a);
      ctx.moveTo(cs * R * 0.85 - sn * hw, sn * R * 0.85 + cs * hw);
      ctx.lineTo(cs * L, sn * L);
      ctx.lineTo(cs * R * 0.85 + sn * hw, sn * R * 0.85 - cs * hw);
    }
    ctx.fill();

    // 3. prominences: three loops that rise off the limb and sink back
    ctx.strokeStyle = c.prom;
    ctx.lineCap = 'round';
    ctx.lineWidth = R * (0.07 + 0.03 * pulse);
    ctx.globalAlpha = 0.6 + 0.4 * pulse;
    ctx.beginPath();
    for (i = 0; i < 3; i++) {
      a = i * TAU / 3 + seed * 0.5 + 0.25 * Math.sin(time * 0.35 + i * 2.1);
      span = 0.42 + 0.14 * Math.sin(time * 0.8 + i * 1.3);
      lift = R * (1.35 + 0.45 * Math.max(0, Math.sin(time * 1.1 + i * 2.4)));
      mid = a + span / 2;
      cr = 2 * lift - 0.98 * R; // control radius so the loop peaks near `lift`
      ctx.moveTo(Math.cos(a) * R * 0.98, Math.sin(a) * R * 0.98);
      ctx.quadraticCurveTo(Math.cos(mid) * cr, Math.sin(mid) * cr,
        Math.cos(a + span) * R * 0.98, Math.sin(a + span) * R * 0.98);
    }
    ctx.stroke();

    // 4. overheated: a white-hot ring that fades in with heat
    if (heat > 0.35) {
      ctx.globalAlpha = (heat - 0.35) / 0.65 * (0.45 + 0.35 * pulse);
      ctx.strokeStyle = c.hot;
      ctx.lineWidth = R * 0.12;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.12, 0, TAU);
      ctx.stroke();
    }

    // 5. body
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    fillUnit(ctx, c.core, R);

    // 6. bright limb
    ctx.globalAlpha = 0.35 + 0.25 * pulse;
    ctx.strokeStyle = c.hot;
    ctx.lineWidth = R * 0.06;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.97, 0, TAU);
    ctx.stroke();

    ctx.restore();
  }

  // ---- Black hole ----------------------------------------------------------

  function bhPalette(ctx) {
    if (bhCache) return bhCache;
    var cols = [];
    for (var b = 0; b < DISK_BUCKETS; b++) {
      cols.push(rgb(mix([255, 150, 50], [150, 80, 235], b / (DISK_BUCKETS - 1)), 0.85));
    }
    bhCache = {
      // lensing halo, unit radius = 4.4 * R
      halo: unitGrad(ctx, [
        [0, 'rgba(120,60,200,0.30)'], [0.23, 'rgba(90,40,170,0.26)'],
        [0.55, 'rgba(60,30,130,0.08)'], [1, 'rgba(40,20,90,0)']
      ]),
      // disk glow, unit radius = 3.3 * R (x), squashed on y
      glow: unitGrad(ctx, [
        [0.42, 'rgba(255,140,50,0)'], [0.52, 'rgba(255,140,50,0.30)'],
        [0.72, 'rgba(190,90,230,0.14)'], [0.96, 'rgba(140,60,200,0)'], [1, 'rgba(140,60,200,0)']
      ]),
      // photon ring, unit radius = 1.3 * R, bright band near 0.9
      ring: unitGrad(ctx, [
        [0, 'rgba(255,240,210,0)'], [0.7, 'rgba(255,240,210,0)'], [0.9, 'rgba(255,250,235,1)'],
        [0.96, 'rgba(255,200,120,0.35)'], [1, 'rgba(255,200,120,0)']
      ]),
      cols: cols
    };
    return bhCache;
  }

  // One pass of the streaming disk. front=false draws the far half (behind the core),
  // front=true the near half (over the core). Particles are computed from the seed,
  // so nothing is stored per frame.
  function diskParticles(ctx, R, time, seed, tilt, front, cols) {
    var b, i, h1, h2, h3, t, rN, w, a, ta, rx, sa;
    ctx.save();
    ctx.rotate(tilt);
    ctx.lineCap = 'round';
    ctx.lineWidth = R * 0.09;
    for (b = 0; b < DISK_BUCKETS; b++) {
      ctx.strokeStyle = cols[b];
      ctx.beginPath();
      for (i = b * DISK_PER; i < (b + 1) * DISK_PER; i++) {
        h1 = rnd(seed, i * 3);
        h2 = rnd(seed, i * 3 + 1);
        h3 = rnd(seed, i * 3 + 2);
        t = (b + h1) / DISK_BUCKETS;          // bucket == radial band
        rN = 1.45 + 1.7 * t;                  // radius in units of R
        w = 1.25 * Math.pow(1.45 / rN, 1.5);  // angular speed, inner faster (Kepler-like)
        a = h2 * TAU + w * time;
        sa = Math.sin(a);
        if ((sa > 0) !== front) continue;
        ta = a - w * (0.12 + 0.12 * h3);      // streak length grows with speed
        rx = rN * R;
        ctx.moveTo(Math.cos(ta) * rx, Math.sin(ta) * rx * DISK_SQUASH);
        ctx.lineTo(Math.cos(a) * rx, sa * rx * DISK_SQUASH);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Pitch-black core, bright photon ring, tilted streaming accretion disk, lensing halo.
  function drawBlackhole(ctx, p, time) {
    var R = p.radius || 16;
    var seed = p.seed || 0;
    var C = bhPalette(ctx);
    var flick = 0.85 + 0.15 * Math.sin(time * 3.1 + seed);
    var tilt = -0.42 + 0.06 * Math.sin(time * 0.21 + seed * 0.5);

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalCompositeOperation = 'lighter';

    // 1. lensing halo
    ctx.globalAlpha = 1;
    fillUnit(ctx, C.halo, R * 4.4);

    // 2. disk glow, tilted and squashed
    ctx.save();
    ctx.rotate(tilt);
    ctx.scale(R * 3.3, R * 3.3 * DISK_SQUASH);
    ctx.fillStyle = C.glow;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 3. far half of the disk, dimmer, hidden behind the core
    ctx.globalAlpha = 0.45 * flick;
    diskParticles(ctx, R, time, seed, tilt, false, C.cols);

    // 4. black core (source-over so it really hides what is behind it)
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fill();

    // 5. photon ring
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = flick;
    fillUnit(ctx, C.ring, R * 1.3);

    // 6. near half of the disk, passing in front of the core
    ctx.globalAlpha = 1;
    diskParticles(ctx, R, time, seed, tilt, true, C.cols);

    ctx.restore();
  }

  ORB.RenderSpecial = {
    drawStar: drawStar,
    drawBlackhole: drawBlackhole
  };
})();

  var TAU = Math.PI * 2, PI = Math.PI;
  var STRIPS = 28;              // longitude strips used to wrap a texture onto a sphere
  var MAX_BUILDS = 2;           // textures generated per frame (spreads the cost)
  var MAX_REFRESH = 3;          // surface buffers re-rendered per frame (others keep last frame's)
  var REFRESH_PX = 1.5;         // re-render a surface once it has turned ~1.5 buffer px

  var shadeCache = {};          // type|size -> shared lighting overlay sprite
  var moonCache = {};           // hue bucket -> moon sprite

    return _rgb;
  }

  // 256-entry RGBA colour ramp from stops [[pos, h, s, l, a?], ...].
  function makeLUT(stops) {
    var lut = new Uint8ClampedArray(256 * 4), i, k;
    for (i = 0; i < 256; i++) {
      var t = i / 255;
      k = 0;
      while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
      var a = stops[k], b = stops[k + 1];
      var u = clamp((t - a[0]) / (b[0] - a[0] || 1), 0, 1);
      var h = a[1] + (b[1] - a[1]) * u, s = a[2] + (b[2] - a[2]) * u, l = a[3] + (b[3] - a[3]) * u;
      var aa = (a[4] === undefined ? 1 : a[4]), ab = (b[4] === undefined ? 1 : b[4]);
      var rgb = hslToRgb(h, s, l);
      lut[i * 4] = rgb[0]; lut[i * 4 + 1] = rgb[1]; lut[i * 4 + 2] = rgb[2];
      lut[i * 4 + 3] = (aa + (ab - aa) * u) * 255;
    }
    return lut;
  }

  // Tileable (in u) value noise; v is 0..1 and does not wrap.
  function makeNoise(rnd, cx, cy) {
    var g = new Float32Array(cx * (cy + 1)), i;
    for (i = 0; i < g.length; i++) g[i] = rnd();
    return function (u, v) {
      var x = u * cx, y = v * cy;
      var xi = Math.floor(x), yi = Math.min(cy - 1, Math.floor(y));
      var fx = x - xi, fy = y - yi;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      var x0 = xi % cx, x1 = (x0 + 1) % cx;
      var a = g[yi * cx + x0], b = g[yi * cx + x1];
      var c = g[(yi + 1) * cx + x0], d = g[(yi + 1) * cx + x1];
      return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
    };
  }

  // Fractal noise sampled into a w*h grid (values pushed apart to roughly 0..1).
  function fbmGrid(rnd, w, h, cx, cy, oct) {
    var ns = [], o;
    for (o = 0; o < oct; o++) ns.push(makeNoise(rnd, cx << o, cy << o));
    var grid = new Float32Array(w * h), i, j;
    for (j = 0; j < h; j++) {
      var v = j / (h - 1);
      for (i = 0; i < w; i++) {
        var u = i / w, s = 0, a = 1, t = 0;
        for (o = 0; o < oct; o++) { s += a * ns[o](u, v); t += a; a *= 0.5; }
        grid[j * w + i] = clamp((s / t - 0.5) * 2.1 + 0.5, 0, 1);
      }
    }
    return grid;
  }

  // Run fn(i, j, data, offset) over a w*h canvas of pixels.
  function paint(w, h, fn) {
    var c = mk(w, h), x = c.getContext('2d');
    var id = x.createImageData(c.width, c.height), d = id.data, i, j;
    for (j = 0; j < c.height; j++) {
      for (i = 0; i < c.width; i++) fn(i, j, d, (j * c.width + i) * 4);
    }
    x.putImageData(id, 0, 0);
    return c;
  }

  // Scale a small tileable pixel canvas up into the full texture (plus the wrap pad).
  function blit(small, W, TH, pad) {
    var c = mk(W + pad, TH), x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    x.drawImage(small, 0, 0, W, TH);
    x.drawImage(small, W, 0, W, TH);
    return c;
  }

  // Emboss term from the height grid: positive where the surface faces the top-left light.
  function emboss(grid, w, h, i, j) {
    var a = grid[j * w + i];
    var b = grid[Math.min(h - 1, j + 1) * w + ((i + 1) % w)];
    return clamp(a - b, -0.16, 0.16);
  }

  // Draw feature fn(ox) three times so shapes crossing the seam wrap around.
  function wrapped(W, fn) { fn(-W); fn(0); fn(W); }

  function polyline(x, pts) {
    x.beginPath();
    x.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]);
  }

  // Random wandering crack, flat array [x0,y0,x1,y1,...].
  function crackPath(rnd, x0, y0, ang, segs, step) {
    var pts = [x0, y0], i;
    for (i = 0; i < segs; i++) {
      ang += (rnd() - 0.5) * 1.1;
      x0 += Math.cos(ang) * step * (0.6 + rnd() * 0.8);
      y0 += Math.sin(ang) * step * (0.6 + rnd() * 0.8);
      pts.push(x0, y0);
    }
    return pts;
  }

  // -------------------------------------------------------- texture builders
  // Each returns { surf, glow?, clouds? } canvases of size (W + pad) x TH.

  function texRocky(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2), hue = p.hue, i;
    var g = fbmGrid(rnd, sw, sh, 4, 3, 4);
    var sea = 0.34 + rnd() * 0.14;
    var lut = makeLUT([
      [0, hue + 40, 50, 15], [sea - 0.03, hue + 36, 55, 30], [sea, hue + 14, 50, 62],
      [sea + 0.04, hue, 48, 40], [0.7, hue - 10, 42, 48], [0.88, hue - 18, 32, 62], [1, hue - 20, 20, 84]
    ]);
    var cap = hslToRgb(hue, 18, 93).slice();
    var small = paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci], v = cj / (sh - 1);
      var k = Math.round(n * 255), e = 1 + emboss(g, sw, sh, ci, cj) * (n > sea ? 3.2 : 0.8);
      var r = lut[k * 4] * e, gg = lut[k * 4 + 1] * e, b = lut[k * 4 + 2] * e;
      var c = smooth(0.82, 0.95, Math.abs(v - 0.5) * 2 + (n - 0.5) * 0.25);
      d[o] = r + (cap[0] - r) * c; d[o + 1] = gg + (cap[1] - gg) * c; d[o + 2] = b + (cap[2] - b) * c;
      d[o + 3] = 255;
    });
    var surf = blit(small, W, TH, pad), x = surf.getContext('2d');
    // Craters with a lit rim on their lower-right inner wall.
    var nc = 5 + Math.floor(rnd() * 4);
    for (i = 0; i < nc; i++) {
      var cx = rnd() * W, cy = TH * (0.2 + rnd() * 0.6), cr = TH * (0.04 + rnd() * 0.07);
      wrapped(W, function (ox) {
        var gr = x.createRadialGradient(cx + ox - cr * 0.2, cy - cr * 0.2, cr * 0.1, cx + ox, cy, cr);
        gr.addColorStop(0, hsl(hue, 30, 12, 0.5));
        gr.addColorStop(0.85, hsl(hue, 30, 18, 0.4));
        gr.addColorStop(1, hsl(hue, 30, 18, 0));
        x.fillStyle = gr;
        x.beginPath(); x.arc(cx + ox, cy, cr, 0, TAU); x.fill();
        x.strokeStyle = hsl(hue, 55, 82, 0.4);
        x.lineWidth = Math.max(1, TH * 0.01);
        x.beginPath(); x.arc(cx + ox, cy, cr, 0.1, PI * 0.75); x.stroke();
      });
    }
    var out = { surf: surf };
    if (rnd() < 0.55) out.clouds = texClouds(rnd, TH, W, pad, 4, 3, 0.5, 0.78, 0.42, hue);
    return out;
  }

  function texClouds(rnd, TH, W, pad, cx, cy, lo, hi, maxA, hue) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2);
    var g = fbmGrid(rnd, sw, sh, cx, cy, 4);
    var rgb = hslToRgb(hue, 25, 96).slice();
    var small = paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci];
      var a = smooth(lo, hi, n) * maxA;
      var e = 1 + emboss(g, sw, sh, ci, cj) * 2.2;
      d[o] = Math.min(255, rgb[0] * e); d[o + 1] = Math.min(255, rgb[1] * e); d[o + 2] = Math.min(255, rgb[2] * e);
      d[o + 3] = a * 255;
    });
    return blit(small, W, TH, pad);
  }

  function texIce(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2), hue = p.hue, i;
    var g = fbmGrid(rnd, sw, sh, 3, 2, 4);
    var lut = makeLUT([[0, hue, 52, 52], [0.4, hue, 48, 70], [0.72, hue, 38, 85], [1, hue, 25, 96]]);
    var small = paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci], k = Math.round(n * 255), e = 1 + emboss(g, sw, sh, ci, cj) * 1.6;
      d[o] = lut[k * 4] * e; d[o + 1] = lut[k * 4 + 1] * e; d[o + 2] = lut[k * 4 + 2] * e; d[o + 3] = 255;
    });
    var surf = blit(small, W, TH, pad), x = surf.getContext('2d');
    // Frost patches.
    for (i = 0; i < 7; i++) {
      var fx = rnd() * W, fy = rnd() * TH, fr = TH * (0.1 + rnd() * 0.16);
      wrapped(W, function (ox) {
        var gr = x.createRadialGradient(fx + ox, fy, 0, fx + ox, fy, fr);
        gr.addColorStop(0, 'rgba(255,255,255,0.32)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = gr; x.fillRect(fx + ox - fr, fy - fr, fr * 2, fr * 2);
      });
    }
    // Pale cracks: a dark blue line with a bright twin beside it.
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (i = 0; i < 10; i++) {
      var pts = crackPath(rnd, rnd() * W, rnd() * TH, rnd() * TAU, 5 + Math.floor(rnd() * 5), TH * 0.12);
      wrapped(W, function (ox) {
        var q = pts.slice(), m;
        for (m = 0; m < q.length; m += 2) q[m] += ox;
        polyline(x, q);
        x.strokeStyle = hsl(hue + 12, 65, 38, 0.55); x.lineWidth = Math.max(1.2, TH * 0.012); x.stroke();
        for (m = 1; m < q.length; m += 2) q[m] += TH * 0.008;
        polyline(x, q);
        x.strokeStyle = 'rgba(255,255,255,0.65)'; x.lineWidth = Math.max(0.8, TH * 0.007); x.stroke();
      });
    }
    return { surf: surf, clouds: texClouds(rnd, TH, W, pad, 5, 3, 0.52, 0.78, 0.55, hue) };
  }

  function texGas(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2), hue = p.hue, i;
    var g = fbmGrid(rnd, sw, sh, 5, 7, 3);
    var bands = 3 + rnd() * 3, ph = rnd() * 6;
    var lut = makeLUT([
      [0, hue, 55, 28], [0.25, hue + 14, 60, 45], [0.5, hue - 8, 52, 62],
      [0.75, hue + 24, 55, 44], [1, hue + 4, 48, 80]
    ]);
    var small = paint(sw, sh, function (ci, cj, d, o) {
      var v = cj / (sh - 1), n = g[cj * sw + ci];
      var val = 0.5 + 0.5 * Math.sin(TAU * (v * bands + (n - 0.5) * 0.65) + ph);
      val = 0.88 * val + 0.12 * n;
      var k = Math.round(clamp(val, 0, 1) * 255);
      var pole = 1 - 0.4 * Math.pow(Math.abs(v - 0.5) * 2, 3);
      d[o] = lut[k * 4] * pole; d[o + 1] = lut[k * 4 + 1] * pole; d[o + 2] = lut[k * 4 + 2] * pole; d[o + 3] = 255;
    });
    var surf = blit(small, W, TH, pad), x = surf.getContext('2d');
    // Great storm plus a few small eddies.
    var sx = rnd() * W, sy = TH * (0.55 + rnd() * 0.2);
    function eddy(cx, cy, rx, ry, hh, light) {
      wrapped(W, function (ox) {
        var gr = x.createRadialGradient(cx + ox, cy, 0, cx + ox, cy, rx);
        gr.addColorStop(0, hsl(hh, 70, light, 0.95));
        gr.addColorStop(0.7, hsl(hh - 15, 60, light - 18, 0.85));
        gr.addColorStop(1, hsl(hh - 15, 60, light - 18, 0));
        x.save(); x.translate(cx + ox, cy); x.scale(1, ry / rx); x.translate(-cx - ox, -cy);
        x.fillStyle = gr; x.beginPath(); x.arc(cx + ox, cy, rx, 0, TAU); x.fill();
        x.strokeStyle = hsl(hh + 10, 60, light + 18, 0.55); x.lineWidth = Math.max(1.2, rx * 0.08);
        x.beginPath(); x.arc(cx + ox, cy, rx * 0.55, 3.6, 6.9); x.stroke();
        x.beginPath(); x.arc(cx + ox, cy, rx * 0.3, 0.3, 3.6); x.stroke();
        x.restore();
      });
    }
    eddy(sx, sy, TH * 0.2, TH * 0.11, hue + 30, 62);
    for (i = 0; i < 5; i++) eddy(rnd() * W, TH * (0.15 + rnd() * 0.7), TH * (0.05 + rnd() * 0.05), TH * 0.03, hue + 15, 78);
    return { surf: surf, clouds: texClouds(rnd, TH, W, pad, 3, 5, 0.5, 0.8, 0.4, hue) };
  }

  function texLava(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2);
    var g = fbmGrid(rnd, sw, sh, 4, 3, 5);
    var crust = makeLUT([[0, 8, 30, 3], [0.5, 8, 26, 8], [1, 12, 22, 17]]);
    var fire = makeLUT([
      [0, 0, 100, 25, 0], [0.18, 4, 100, 34, 0.6], [0.45, 16, 100, 48, 0.92],
      [0.75, 28, 100, 50, 1], [1, 44, 100, 68, 1]
    ]);
    var surf = blit(paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci], k = Math.round(n * 255), e = 1 + emboss(g, sw, sh, ci, cj) * 3;
      d[o] = crust[k * 4] * e; d[o + 1] = crust[k * 4 + 1] * e; d[o + 2] = crust[k * 4 + 2] * e; d[o + 3] = 255;
    }), W, TH, pad);
    var glow = blit(paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci], rid = 1 - Math.abs(2 * n - 1);
      var gl = smooth(0.74, 0.985, rid) * (0.8 + 0.2 * rid) + 0.16 * smooth(0.5, 0.74, rid);
      var k = Math.round(Math.min(1, gl) * 255);
      d[o] = fire[k * 4]; d[o + 1] = fire[k * 4 + 1]; d[o + 2] = fire[k * 4 + 2]; d[o + 3] = fire[k * 4 + 3];
    }), W, TH, pad);
    return { surf: surf, glow: glow };
  }

  function texJelly(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2), hue = p.hue, i;
    var g = fbmGrid(rnd, sw, sh, 3, 3, 3);
    var lut = makeLUT([[0, hue + 8, 70, 40], [0.5, hue + 12, 80, 58], [1, hue - 10, 85, 76]]);
    var surf = blit(paint(sw, sh, function (ci, cj, d, o) {
      var k = Math.round(g[cj * sw + ci] * 255);
      d[o] = lut[k * 4]; d[o + 1] = lut[k * 4 + 1]; d[o + 2] = lut[k * 4 + 2]; d[o + 3] = 255;
    }), W, TH, pad);
    var x = surf.getContext('2d');
    x.lineCap = 'round';
    // Dark veins.
    for (i = 0; i < 4; i++) {
      var pts = crackPath(rnd, rnd() * W, rnd() * TH, rnd() * TAU, 6, TH * 0.1);
      wrapped(W, function (ox) {
        var q = pts.slice(), m;
        for (m = 0; m < q.length; m += 2) q[m] += ox;
        polyline(x, q);
        x.strokeStyle = hsl(hue + 30, 80, 30, 0.28); x.lineWidth = TH * 0.025; x.stroke();
      });
    }
    // Bubbles.
    var nb = 12 + Math.floor(rnd() * 6);
    for (i = 0; i < nb; i++) {
      var bx = rnd() * W, by = TH * (0.1 + rnd() * 0.8), br = TH * (0.03 + rnd() * 0.07);
      wrapped(W, function (ox) {
        var gr = x.createRadialGradient(bx + ox, by, br * 0.2, bx + ox, by, br);
        gr.addColorStop(0, hsl(hue, 90, 85, 0.05));
        gr.addColorStop(1, hsl(hue, 90, 88, 0.4));
        x.fillStyle = gr; x.beginPath(); x.arc(bx + ox, by, br, 0, TAU); x.fill();
        x.strokeStyle = 'rgba(255,255,255,0.5)'; x.lineWidth = Math.max(1, br * 0.14);
        x.beginPath(); x.arc(bx + ox, by, br, 0, TAU); x.stroke();
        x.fillStyle = 'rgba(255,255,255,0.85)';
        x.beginPath(); x.arc(bx + ox - br * 0.38, by - br * 0.4, Math.max(0.9, br * 0.2), 0, TAU); x.fill();
      });
    }
    return { surf: surf };
  }

  function texCrumble(p, rnd, TH, W, pad) {
    var sw = Math.ceil(W / 2), sh = Math.ceil(TH / 2), hue = p.hue, i;
    var g = fbmGrid(rnd, sw, sh, 5, 4, 5);
    var lut = makeLUT([[0, hue, 18, 13], [0.5, hue + 4, 18, 30], [1, hue + 8, 16, 54]]);
    var surf = blit(paint(sw, sh, function (ci, cj, d, o) {
      var n = g[cj * sw + ci], k = Math.round(n * 255), e = 1 + emboss(g, sw, sh, ci, cj) * 4.5;
      var rid = 1 - Math.abs(2 * n - 1), dk = 1 - 0.55 * smooth(0.9, 0.99, rid);
      d[o] = lut[k * 4] * e * dk; d[o + 1] = lut[k * 4 + 1] * e * dk; d[o + 2] = lut[k * 4 + 2] * e * dk; d[o + 3] = 255;
    }), W, TH, pad);
    var x = surf.getContext('2d');
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (i = 0; i < 14; i++) {
      var pts = crackPath(rnd, rnd() * W, rnd() * TH, rnd() * TAU, 4 + Math.floor(rnd() * 5), TH * 0.1);
      wrapped(W, function (ox) {
        var q = pts.slice(), m;
        for (m = 0; m < q.length; m += 2) q[m] += ox;
        polyline(x, q);
        x.strokeStyle = 'rgba(6,3,3,0.8)'; x.lineWidth = Math.max(1.3, TH * 0.014); x.stroke();
        for (m = 1; m < q.length; m += 2) q[m] += TH * 0.009;
        polyline(x, q);
        x.strokeStyle = hsl(hue, 30, 62, 0.28); x.lineWidth = Math.max(0.7, TH * 0.006); x.stroke();
      });
    }
    for (i = 0; i < 6; i++) {
      var cx = rnd() * W, cy = TH * (0.2 + rnd() * 0.6), cr = TH * (0.03 + rnd() * 0.05);
      wrapped(W, function (ox) {
        x.fillStyle = 'rgba(8,4,4,0.4)'; x.beginPath(); x.arc(cx + ox, cy, cr, 0, TAU); x.fill();
        x.strokeStyle = hsl(hue, 30, 66, 0.3); x.lineWidth = Math.max(1, TH * 0.008);
        x.beginPath(); x.arc(cx + ox, cy, cr, 0.1, PI * 0.8); x.stroke();
      });
    }
    return { surf: surf };
  }

  var BUILDERS = {
    rocky: texRocky, ice: texIce, gas: texGas, lava: texLava, jelly: texJelly, crumble: texCrumble
  };

  // ------------------------------------------------------------ sprites

  // Per-type visual constants: lighting overlay strengths, atmosphere colour, base fill.
  var STYLE = {
    rocky:   { hi: 0.10, spec: 0,    term: 0.86, halo: 0.22, rimA: 0.55 },
    ice:     { hi: 0.24, spec: 0,    term: 0.78, halo: 0.34, rimA: 0.75 },
    gas:     { hi: 0.10, spec: 0,    term: 0.84, halo: 0.30, rimA: 0.60 },
    lava:    { hi: 0.03, spec: 0,    term: 0.62, halo: 0.42, rimA: 0.50 },
    jelly:   { hi: 0.30, spec: 0.7,  term: 0.50, halo: 0.38, rimA: 0.75 },
    crumble: { hi: 0.04, spec: 0,    term: 0.84, halo: 0.12, rimA: 0.25 }
  };

  function rimColor(type, hue) {
    switch (type) {
      case 'ice': return [195, 80, 82];
      case 'lava': return [14, 100, 58];
      case 'jelly': return [hue + 20, 95, 76];
      case 'crumble': return [hue, 30, 58];
      default: return [hue, 80, 70];
    }
  }

  // Shared lighting overlay: soft terminator, limb darkening, highlight (light from top-left).
  function shadeSprite(type, SZ) {
    var key = type + '|' + SZ;
    if (shadeCache[key]) return shadeCache[key];
    var st = STYLE[type] || STYLE.rocky;
    var c = mk(SZ, SZ), x = c.getContext('2d'), R = SZ / 2, lx = R * 0.62, ly = R * 0.62, gr;
    gr = x.createRadialGradient(lx, ly, R * 0.1, lx, ly, R * 1.6);
    gr.addColorStop(0, 'rgba(6,2,22,0)');
    gr.addColorStop(0.5, 'rgba(6,2,22,0)');
    gr.addColorStop(0.78, 'rgba(6,2,22,' + (st.term * 0.5).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(6,2,22,' + st.term.toFixed(3) + ')');
    x.fillStyle = gr; x.fillRect(0, 0, SZ, SZ);
    gr = x.createRadialGradient(R, R, R * 0.65, R, R, R);
    gr.addColorStop(0, 'rgba(4,0,16,0)');
    gr.addColorStop(1, 'rgba(4,0,16,0.38)');
    x.fillStyle = gr; x.fillRect(0, 0, SZ, SZ);
    gr = x.createRadialGradient(R * 0.62, R * 0.6, 0, R * 0.62, R * 0.6, R * 0.62);
    gr.addColorStop(0, 'rgba(255,255,255,' + st.hi + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 0, SZ, SZ);
    if (st.spec) {
      x.fillStyle = 'rgba(255,255,255,' + st.spec + ')';
      x.beginPath(); x.ellipse(R * 0.6, R * 0.52, R * 0.2, R * 0.11, -0.6, 0, TAU); x.fill();
      x.fillStyle = 'rgba(255,255,255,' + (st.spec * 0.6) + ')';
      x.beginPath(); x.arc(R * 0.82, R * 0.8, R * 0.05, 0, TAU); x.fill();
    }
    x.globalCompositeOperation = 'destination-in';
    x.beginPath(); x.arc(R, R, R, 0, TAU); x.fill();
    shadeCache[key] = c;
    return c;

      var minX = -Infinity, maxX = Infinity, minY = -Infinity, maxY = Infinity;

        if (p.ringed) drawRing(ctx, p, e, true, time);
        drawMoons(ctx, p, e, true);
        drawBody(ctx, p, e, time, isCur, rot);
        if (p.ringed) drawRing(ctx, p, e, false, time);
        drawMoons(ctx, p, e, false);

      for (key in cache) {

      }

      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    },

    // Build (or fetch) the cache entry for a planet; null if building failed.
    _ensure: function (p, key, type) {

      builtThisFrame++;
      try {

      }

  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var STAR_COLOR = '#ffd86b';
  var STAR_RGB = '255,216,107';
  var ROCK_FILL = '#6b5d52';
  var ROCK_EDGE = '#a38f7e';
  var ROCK_GLOW_RGB = '255,90,90';
  var PU_COLORS = { shield: '#4da3ff', magnet: '#ff5a5a', slow: '#5dff8a' };
  var PU_RGB = { shield: '77,163,255', magnet: '255,90,90', slow: '93,255,138' };
  var COMET_GLOW_RGB = '120,210,255';
  var COMET_CORE_RGB = '240,252,255';
  var VIOLET_RGB = '170,80,255';
  var PINK_RGB = '255,120,220';
  var CYAN_RGB = '63,240,255';
  var ICE_RGB = '210,250,255';
  var TWO_PI = Math.PI * 2;

  // ---- cached glow sprites (created lazily, one per colour) ----
  var sprites = {};

  function glowSprite(rgb) {
    var s = sprites[rgb];
    if (s) return s;
    var size = 128;
    s = document.createElement('canvas');
    s.width = size;
    s.height = size;
    var g = s.getContext('2d');
    var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, 'rgba(' + rgb + ',1)');
    grd.addColorStop(0.35, 'rgba(' + rgb + ',0.45)');
    grd.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    sprites[rgb] = s;
    return s;
