    return 'rgb(' + Math.round(ca[0] + (cb[0] - ca[0]) * t) + ',' +
      Math.round(ca[1] + (cb[1] - ca[1]) * t) + ',' +
      Math.round(ca[2] + (cb[2] - ca[2]) * t) + ')';
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- cached glow sprites (cheaper than shadowBlur) -----------------------------

  var glowCache = {};

  function glowSprite(color) {
    var s = glowCache[color];
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = 64;
    var g = s.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, rgba(color, 1));
    grad.addColorStop(0.25, rgba(color, 0.55));
    grad.addColorStop(0.6, rgba(color, 0.15));
    grad.addColorStop(1, rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    glowCache[color] = s;
    return s;
  }

  // Additive soft glow centred on (x, y).
  function glow(ctx, color, x, y, radius, alpha) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha > 1 ? 1 : alpha;
    ctx.drawImage(glowSprite(color), x - radius, y - radius, radius * 2, radius * 2);
  }

  // ---- shared per-frame state (tether lag) ----------------------------------

  var st = { planet: null, cx: 0, cy: 0, lastT: -1, ready: false };
  var tpx = [], tpy = [];   // reused tether polyline buffers
  for (var ti = 0; ti < 19; ti++) { tpx.push(0); tpy.push(0); }

  // ---- trail: tapered glowing ribbon ----------------------------------------------

  // Offset of trail point i perpendicular to the local path direction.
  function ribbonPoint(trail, n, i, p, w, side, out) {
    var a = i > 0 ? trail[i - 1] : trail[i];
    var b = i < n - 1 ? trail[i + 1] : p;
    var dx = b.x - a.x, dy = b.y - a.y;
    var l = Math.sqrt(dx * dx + dy * dy) || 1;
    var q = i < n ? trail[i] : p;
    out.x = q.x - (dy / l) * w * side;
    out.y = q.y + (dx / l) * w * side;
  }

  var tmp = { x: 0, y: 0 };

  function ribbon(ctx, trail, start, n, p, maxW) {
    // total points = n trail points + the ship itself
    var count = n - start + 1;
    var i, t, w, k;
    ctx.beginPath();
    for (i = start; i <= n; i++) {
      k = i - start;
      t = k / (count - 1);
      w = maxW * Math.pow(t, 1.35);
      ribbonPoint(trail, n, i, p, w, 1, tmp);
      if (i === start) ctx.moveTo(tmp.x, tmp.y); else ctx.lineTo(tmp.x, tmp.y);
    }
    for (i = n; i >= start; i--) {
      k = i - start;
      t = k / (count - 1);
      w = maxW * Math.pow(t, 1.35);
      ribbonPoint(trail, n, i, p, w, -1, tmp);
      ctx.lineTo(tmp.x, tmp.y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawTrail(ctx, p, color, speedF) {
    var trail = p.trail;
    if (!trail || trail.length < 2) return;
    var n = trail.length;
    // skip anything before a teleport (wormhole) jump
    var start = 0, i, dx, dy;
    for (i = n - 1; i > 0; i--) {
      dx = trail[i].x - trail[i - 1].x;
      dy = trail[i].y - trail[i - 1].y;
      if (dx * dx + dy * dy > 90000) { start = i; break; }
    }
    if (n - start < 3) return;
    var first = trail[start];
    var orbit = p.state === 'orbit';
    var a = orbit ? 0.45 : 0.55 + 0.45 * speedF;
    var g = ctx.createLinearGradient(first.x, first.y, p.x, p.y);
    g.addColorStop(0, rgba(color, 0));
    g.addColorStop(0.5, rgba(color, 0.5 * a));
    g.addColorStop(1, rgba(color, a));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ribbon(ctx, trail, start, n, p, 3.6 + speedF * 5.5);   // soft outer
    var g2 = ctx.createLinearGradient(first.x, first.y, p.x, p.y);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(1, 'rgba(255,255,255,' + (0.55 * a) + ')');
    ctx.fillStyle = g2;
    ribbon(ctx, trail, start, n, p, 1.3 + speedF * 1.8);   // hot core
    ctx.restore();
  }

  // ---- elastic tether -------------------------------------------------------------

  function drawTether(ctx, p, planet, color, time, heatF) {
    var dx = p.x - planet.x, dy = p.y - planet.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = dx / d, ny = dy / d;
    var sr = planet.radius * (1 + (planet.wobble || 0) * 0.0);
    var sx = planet.x + nx * sr, sy = planet.y + ny * sr;     // anchor on the surface
    var stretch = p.stretch || 0;
    var taut = clamp(stretch * 3.2, 0, 1);
    var slack = 1 - taut;
    var dir = p.dir || 1;
    // motion direction in the planet frame (tangent) and its speed
    var tx = -ny * dir, ty = nx * dir;
    var rvx = p.vx - (planet.vx || 0), rvy = p.vy - (planet.vy || 0);
    var vt = rvx * tx + rvy * ty;
    var mx = (sx + p.x) * 0.5, my = (sy + p.y) * 0.5;

    // ideal control point: lags opposite to the motion, sags when slack
    var lag = clamp(vt * 0.075, -26, 26) * (0.35 + 0.65 * slack);
    var sag = slack * (3 + Math.max(0, -stretch) * 30) * Math.sin(time * 2.4 + planet.id);
    var twang = 0;
    if (p.latchT !== undefined && p.latchT < 0.9) {
      twang = Math.sin(p.latchT * 36) * Math.exp(-p.latchT * 4.5) * (8 + clamp(Math.abs(stretch), 0, 1.2) * 26);
    }
    var tgx = mx - tx * lag + nx * sag + (-ny) * twang;
    var tgy = my - ty * lag + ny * sag + nx * twang;

    // the control point chases its target (that is the visible lag)
    var dt = time - st.lastT;
    if (!(dt > 0 && dt < 0.1)) dt = 1 / 60;
    st.lastT = time;
    if (!st.ready || st.planet !== planet) {
      st.ready = true; st.planet = planet; st.cx = mx; st.cy = my;
    }
    var k = 1 - Math.exp(-dt * 13);
    st.cx += (tgx - st.cx) * k;
    st.cy += (tgy - st.cy) * k;
    // keep the bend bounded
    var ox = st.cx - mx, oy = st.cy - my, ol = Math.sqrt(ox * ox + oy * oy);
    var maxBend = 10 + d * 0.5;
    if (ol > maxBend) { st.cx = mx + ox / ol * maxBend; st.cy = my + oy / ol * maxBend; }

    // tension colour: cool cord -> white-hot -> amber when really stretched
    var over = clamp((stretch - 0.35) * 2, 0, 1);
    var cool = mix(mix(color, '#ffffff', 0.35 + taut * 0.5), '#ffc23a', over * 0.6);
    var line = heatF > 0 ? mix(color, HEAT, heatF) : cool;
    var gl = heatF > 0 ? HEAT : (over > 0.3 ? '#ffb03a' : color);

    // sample the bent cord into a polyline with a vibrating-string wave on top
    var lt = p.latchT !== undefined ? p.latchT : 9;
    var wAmp = Math.exp(-lt * 3.2) * (2 + clamp(Math.abs(stretch), 0, 1.2) * 10) * (lt < 2 ? 1 : 0);
    var wPh = lt * 46;
    var ex = p.x, ey = p.y, cx = st.cx, cy = st.cy;
    var ddx = ex - sx, ddy = ey - sy, dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
    var N = 18, i, u, iu, bx, by, tgx2, tgy2, tl, off;
    for (i = 0; i <= N; i++) {
      u = i / N; iu = 1 - u;
      bx = iu * iu * sx + 2 * u * iu * cx + u * u * ex;
      by = iu * iu * sy + 2 * u * iu * cy + u * u * ey;
      tgx2 = 2 * iu * (cx - sx) + 2 * u * (ex - cx);
      tgy2 = 2 * iu * (cy - sy) + 2 * u * (ey - cy);
      tl = Math.sqrt(tgx2 * tgx2 + tgy2 * tgy2) || 1;
      off = wAmp * Math.sin(u * Math.PI) * Math.sin(u * 6.28 * 1.5 + wPh);
      tpx[i] = bx - (tgy2 / tl) * off;
      tpy[i] = by + (tgx2 / tl) * off;
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tpx[0], tpy[0]);
    for (i = 1; i <= N; i++) ctx.lineTo(tpx[i], tpy[i]);
    // wide soft glow (swells with tension)
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(gl, 0.12 + 0.34 * taut);
    ctx.lineWidth = 5 + taut * 11;
    ctx.stroke();
    // body of the cord: thins out as it stretches, like a rubber band
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.7 + 0.3 * taut;
    ctx.strokeStyle = line;
    ctx.lineWidth = 2.4 + slack * 0.6 - taut * 0.6 + taut * 1.6;
    ctx.stroke();
    // rubber-band tick marks: the gaps open up as the cord stretches
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + 0.5 * taut;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1 + taut * 1.4;
    ctx.setLineDash([1.5, 3.5 + clamp(stretch, 0, 1.5) * 14]);
    ctx.lineDashOffset = -(time * 40) % 64;
    ctx.stroke();
    ctx.setLineDash([]);
    // bright core when stretched
    if (taut > 0.05) {
      ctx.globalAlpha = taut * 0.9;
      ctx.lineWidth = 0.8 + taut * 0.9;
      ctx.stroke();
    }
    // anchor bead on the planet surface (flares when the band is pulled)
    glow(ctx, gl, sx, sy, 7 + taut * 8, 0.5 + 0.5 * taut);
    // glow knot at the ship end
    glow(ctx, gl, p.x, p.y, 13 + taut * 11, 0.55 + 0.45 * taut);
    ctx.restore();

    // snap ring: expanding shockwave around the ship right after the latch
    if (lt < 0.45) {
      var k = lt / 0.45, e = 1 - (1 - k) * (1 - k) * (1 - k);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(gl, 1);
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.lineWidth = 3 * (1 - k) + 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + 34 * e, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---- trajectory preview -----------------------------------------------------------

  function dotsAlong(ctx, pts, count, color, time, hit) {
    var spacing = 13;
    var total = 0, i;
    for (i = 1; i < count; i++) {
      total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    }
    if (total < 4) return;
    var maxLen = hit ? 420 : 300;       // keep the guide readable at high speed
    if (total > maxLen) total = maxLen;
    var flow = (time * 22) % spacing;
    var segStart = 0, dist = spacing - flow;
    for (i = 1; i < count; i++) {
      var ax = pts[i - 1].x, ay = pts[i - 1].y, bx = pts[i].x, by = pts[i].y;
      var sl = Math.hypot(bx - ax, by - ay);
      if (sl < 1e-6) continue;
      while (dist <= segStart + sl && dist <= total) {
        var f = (dist - segStart) / sl;
        var x = ax + (bx - ax) * f, y = ay + (by - ay) * f;
        var u = clamp(dist / total, 0, 1);
        var a = (1 - u * 0.85) * (hit ? 0.95 : 0.6);
        var r = 2.5 - u * 1.2;
        ctx.globalAlpha = a * 0.35;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, TAU); ctx.fill();
        ctx.globalAlpha = a;
        ctx.fillStyle = hit ? '#ffffff' : color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        dist += spacing;
      }
      segStart += sl;
    }
  }

  function drawTargetRing(ctx, planet, time) {
    var R = planet.orbitRadius || planet.radius + 26;
    var pulse = 0.5 + 0.5 * Math.sin(time * 6);
    var rr = R * (1 + 0.035 * pulse);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, CYAN, planet.x, planet.y, rr + 16, 0.18 + 0.12 * pulse);
    ctx.globalAlpha = 0.55 + 0.35 * pulse;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(planet.x, planet.y, rr, 0, TAU);
    ctx.stroke();
    // four rotating brackets
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.9;
    var rot = time * 1.4;
    for (var i = 0; i < 4; i++) {
      var a0 = rot + i * Math.PI / 2;
      ctx.beginPath();
      ctx.arc(planet.x, planet.y, rr + 7, a0 - 0.16, a0 + 0.16);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPreview(ctx, p, time) {
    var P = ORB.Physics;
    var res = null, v = null, pts = null, count = 0;
    if (P && P.predict && P.launchVelocity) {
      try {
        v = P.launchVelocity(p);
        res = P.predict(p.x, p.y, v.vx, v.vy,
          (ORB.Planets && ORB.Planets.list) || [], p.planet, 1.3, 1 / 30);
      } catch (e) { res = null; }
    }
    var hit = null;
    if (res && res.points && res.points.length > 1) {
      pts = res.points;
      hit = res.hit || null;
      // only the first ~1.0 s of the path (the sample step is 1/30 s)
      count = Math.min(pts.length, hit ? 36 : 27);
    } else {
      // fallback: straight tangent line
      var tx, ty;
      if (ORB.Player && ORB.Player.tangent) {
        var tg = ORB.Player.tangent(p);
        tx = tg.x; ty = tg.y;
      } else {
        var l = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
        tx = p.vx / l; ty = p.vy / l;
      }
      pts = [{ x: p.x, y: p.y }, { x: p.x + tx * 150, y: p.y + ty * 150 }];
      count = 2;
    }
    var color = hit ? CYAN : '#dfe8ff';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    dotsAlong(ctx, pts, count, color, time, !!hit);
    ctx.restore();
    if (hit) drawTargetRing(ctx, hit, time);
  }

  // ---- ship ---------------------------------------------------------------------------

  function drawFlame(ctx, r, boostT, color, time) {
    var f = clamp(boostT / 0.35, 0, 1);
    var flick = 0.85 + 0.15 * Math.sin(time * 90) + 0.1 * Math.sin(time * 53);
    var len = r * (1.6 + 5.2 * f) * flick;
    var wid = r * (0.55 + 0.35 * f);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // outer flame
    ctx.globalAlpha = 0.5 + 0.4 * f;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -wid);
    ctx.quadraticCurveTo(-r * 0.55 - len * 0.7, -wid * 0.6, -r * 0.55 - len, 0);
    ctx.quadraticCurveTo(-r * 0.55 - len * 0.7, wid * 0.6, -r * 0.55, wid);
    ctx.closePath();
    ctx.fill();
    // inner hot core
    ctx.globalAlpha = 0.7 + 0.3 * f;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -wid * 0.5);
    ctx.quadraticCurveTo(-r * 0.55 - len * 0.35, -wid * 0.25, -r * 0.55 - len * 0.55, 0);
    ctx.quadraticCurveTo(-r * 0.55 - len * 0.35, wid * 0.25, -r * 0.55, wid * 0.5);
    ctx.closePath();
    ctx.fill();
    glow(ctx, color, -r * 0.55 - len * 0.2, 0, r * 2.2, 0.55 * f);
    ctx.restore();
  }

  function drawShip(ctx, p, color, time, speedF, heatF) {
    var r = ORB.CONFIG.PLAYER_RADIUS * 1.12;
    var rot;
    if (p.vx || p.vy) rot = Math.atan2(p.vy, p.vx);
    else if (ORB.Player && ORB.Player.tangent) { var tg = ORB.Player.tangent(p); rot = Math.atan2(tg.y, tg.x); }
    else rot = 0;

    // squash & stretch: long when fast, an elastic pop right after a latch
    var sxk = 1 + speedF * 0.42;
    var syk = 1 / Math.sqrt(sxk);
    if (p.state === 'orbit' && p.latchT !== undefined && p.latchT < 0.6) {
      var pop = Math.exp(-p.latchT * 9) * Math.sin(p.latchT * 34) * 0.3;
      sxk *= 1 - pop;
      syk *= 1 + pop;
    }

    var body = heatF > 0 ? mix('#eef6ff', HEAT, heatF * 0.8) : mix(color, '#ffffff', 0.7);
    var edge = heatF > 0 ? mix(color, HEAT, heatF) : color;

    ctx.save();
    // heat aura (behind the ship, additive)
    if (heatF > 0) {
      ctx.globalCompositeOperation = 'lighter';
      var pulse = 0.75 + 0.25 * Math.sin(time * 14);
      glow(ctx, HEAT, p.x, p.y, (16 + 16 * heatF) * pulse, 0.5 + 0.5 * heatF);
      glow(ctx, '#ffb347', p.x, p.y, 9 + 6 * heatF, 0.4 * heatF);
      ctx.globalCompositeOperation = 'source-over';
    }
    // ship glow
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, color, p.x, p.y, r * 3.2, 0.5 + 0.25 * speedF);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.translate(p.x, p.y);
    ctx.rotate(rot);
    ctx.scale(sxk, syk);

    if (p.boostT > 0 && p.state === 'fly') drawFlame(ctx, r, p.boostT, color, time);
    else if (p.state === 'fly') {
      // faint idle thruster so the ship never looks dead in flight
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(time * 40);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.3);
      ctx.lineTo(-r * (1.5 + speedF), 0);
      ctx.lineTo(-r * 0.55, r * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // solar panels (swept back wings)
    ctx.fillStyle = rgba(edge, 0.8);
    ctx.strokeStyle = rgba('#ffffff', 0.55);
    ctx.lineWidth = 0.7;
    var s;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(r * 0.1, s * r * 0.35);
      ctx.lineTo(-r * 0.75, s * r * 1.75);
      ctx.lineTo(-r * 1.25, s * r * 1.55);
      ctx.lineTo(-r * 0.7, s * r * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // hull: a rounded dart
    ctx.fillStyle = body;
    ctx.strokeStyle = edge;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(r * 1.55, 0);
    ctx.quadraticCurveTo(r * 0.5, -r * 0.85, -r * 0.95, -r * 0.62);
    ctx.lineTo(-r * 0.6, 0);
    ctx.lineTo(-r * 0.95, r * 0.62);
    ctx.quadraticCurveTo(r * 0.5, r * 0.85, r * 1.55, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // cockpit
    ctx.fillStyle = edge;
    ctx.beginPath();
    ctx.arc(r * 0.35, 0, r * 0.28, 0, TAU);
    ctx.fill();
    // blinking beacon
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 6);
    ctx.fillStyle = ORB.CONFIG.COLORS.danger || '#ff5a5a';
    ctx.beginPath();
    ctx.arc(-r * 0.75, 0, 1.1, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ---- power-up effects ------------------------------------------------------------------

  function drawShield(ctx, p, time) {
    var r = ORB.CONFIG.PLAYER_RADIUS + 9 + Math.sin(time * 4) * 0.9;
    ctx.save();
    var g = ctx.createRadialGradient(p.x, p.y, r * 0.45, p.x, p.y, r);
    g.addColorStop(0, 'rgba(90,184,255,0)');
    g.addColorStop(0.75, 'rgba(90,184,255,0.12)');
    g.addColorStop(1, 'rgba(140,210,255,0.4)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(SHIELD, 0.85);
    ctx.lineWidth = 1.6;
    ctx.stroke();
    // travelling highlight arc
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var a0 = time * 2.2;
    ctx.arc(p.x, p.y, r - 0.5, a0, a0 + 0.9);
    ctx.stroke();
    ctx.restore();
  }

  // Pulsing dashed aura plus rings drifting inward, fading as the timer runs out.
  function drawMagnet(ctx, p, time) {
    var fade = Math.min(1, p.magnetTime / 1.0);
    var pulse = 0.5 + 0.5 * Math.sin(time * 5);
    var R = ORB.CONFIG.MAGNET_RADIUS;
    var danger = ORB.CONFIG.COLORS.danger || '#ff5a8a';
    ctx.save();
    ctx.globalAlpha = (0.12 + 0.1 * pulse) * fade;
    ctx.strokeStyle = danger;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.lineDashOffset = -time * 30;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    // inward-flowing rings
    ctx.lineWidth = 1.2;
    for (var i = 0; i < 2; i++) {
      var ph = (time * 0.7 + i * 0.5) % 1;
      ctx.globalAlpha = (1 - ph) * 0.22 * fade;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R * (1 - ph) + 8, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- public API ------------------------------------------------------------------------------

  ORB.RenderPlayer = {
    draw: function (ctx, player, time) {
      if (!player || player.state === 'dead') return;
      var skin = ORB.Skins.current();
      var color = skin.color;
      var trailColor = skin.trail || skin.color;
      time = time || 0;

      var maxSpeed = (ORB.CONFIG && ORB.CONFIG.MAX_SPEED) || 950;
      var speed = player.speed;
      if (speed === undefined) speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
      var speedF = clamp(speed / maxSpeed, 0, 1);

      var orbit = player.state === 'orbit' && player.planet;
      var heatF = 0;
      if (orbit && player.planet.type === 'star' && player.planet.heat > 0.4) {
        heatF = clamp((player.planet.heat - 0.4) / 0.6, 0, 1);
      }
      if (!orbit) st.ready = false;

      ctx.save();
      drawTrail(ctx, player, trailColor, speedF);
      if (player.magnetTime > 0) drawMagnet(ctx, player, time);
      if (orbit) {
        drawPreview(ctx, player, time);
        drawTether(ctx, player, player.planet, color, time, heatF);
      }
      drawShip(ctx, player, color, time, speedF, heatF);
      if (player.shield) drawShield(ctx, player, time);
      ctx.restore();

      // leave the context clean
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var PAUSE_SVG =
    '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">' +
    '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>' +
    '<rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

  var TOAST_TIME = 2600;     // ms each toast stays on screen
  var TOAST_MAX_QUEUE = 8;   // older queued toasts are dropped beyond this
  var VOID_DANGER = 0.6;

  var els = null;      // cached DOM refs, built once in init()
  var bumpTimer = 0;
  var flashTimer = 0;
  var toastTimer = 0;
  var toastQueue = [];
  var toastBusy = false;

  // Last values written to the DOM, so per-frame calls with unchanged data cost nothing.
  var last = {};
  function resetCache() {
    last = {
      score: null,
      height: null,
      combo: null,
      voidV: -1,
      voidDanger: false,
      shield: null,
      magnet: null,
      slow: null
    };
  }

  function hudEl() {
    return document.getElementById('hud');
  }

  function build(opts) {
    var hud = hudEl();
    if (!hud) return;
    hud.innerHTML = '';
    resetCache();
    clearTimeout(toastTimer);
    toastQueue = [];
    toastBusy = false;

    var top = document.createElement('div');
    top.className = 'hud-top';

    var height = document.createElement('div');
    height.className = 'hud-height';
    height.textContent = '0';

    var score = document.createElement('div');
    score.className = 'hud-score';
    var scoreValue = document.createElement('span');
    scoreValue.className = 'hud-score-value';
    scoreValue.textContent = '0';
    var combo = document.createElement('span');
    combo.className = 'hud-combo hidden';
    score.appendChild(scoreValue);
    score.appendChild(combo);

    var pause = document.createElement('button');
    pause.className = 'icon-btn hud-pause';
    pause.setAttribute('aria-label', 'Pause');
    pause.innerHTML = PAUSE_SVG;
    pause.addEventListener('click', function () {
      if (opts && opts.onPause) opts.onPause();
    });

    top.appendChild(height);
    top.appendChild(score);
    top.appendChild(pause);

    var powerups = document.createElement('div');
    powerups.className = 'hud-powerups';
    var puShield = document.createElement('span');
    puShield.className = 'pu pu-shield hidden';
    var puMagnet = document.createElement('span');
    puMagnet.className = 'pu pu-magnet hidden';
    var puSlow = document.createElement('span');
    puSlow.className = 'pu pu-slow hidden';
    powerups.appendChild(puShield);
    powerups.appendChild(puMagnet);
    powerups.appendChild(puSlow);

    var flash = document.createElement('div');
    flash.className = 'hud-flash';

    var voidEdge = document.createElement('div');
    voidEdge.className = 'hud-void';

    var toast = document.createElement('div');
    toast.className = 'hud-toast';
    var toastTitle = document.createElement('div');
    toastTitle.className = 'hud-toast-title';
    var toastText = document.createElement('div');
    toastText.className = 'hud-toast-text';
    toast.appendChild(toastTitle);
    toast.appendChild(toastText);

    hud.appendChild(top);
    hud.appendChild(powerups);
    hud.appendChild(flash);
    hud.appendChild(voidEdge);
    hud.appendChild(toast);

    els = {
      hud: hud,
      height: height,
      scoreValue: scoreValue,
      combo: combo,
      shield: puShield,
      magnet: puMagnet,
      slow: puSlow,
      flash: flash,
      voidEdge: voidEdge,
      toast: toast,
      toastTitle: toastTitle,
      toastText: toastText
    };
  }

  function setHidden(el, hidden) {
    if (!el) return;
    if (hidden) el.classList.add('hidden');
    else el.classList.remove('hidden');
  }

  function pumpToast() {
    if (!els || toastBusy || toastQueue.length === 0) return;
    var item = toastQueue.shift();
    var el = els.toast;
    els.toastTitle.textContent = item.title;
    els.toastText.textContent = item.text;
    el.classList.remove('show');
    void el.offsetWidth; // force reflow so the slide-in restarts
    el.classList.add('show');
    toastBusy = true;
    toastTimer = setTimeout(function () {
      toastTimer = 0;
      toastBusy = false;
      if (els) els.toast.classList.remove('show');
      pumpToast();
    }, TOAST_TIME);
  }

  ORB.HUD = {
    init: function (opts) {
      build(opts || {});
    },

    show: function () {
      if (els) setHidden(els.hud, false);
    },

    hide: function () {
      if (els) setHidden(els.hud, true);
    },

    setScore: function (n) {
      if (!els || n === last.score) return;
      last.score = n;
      els.scoreValue.textContent = String(n);
      // restart the brief "bump" animation
      els.scoreValue.classList.remove('bump');
      void els.scoreValue.offsetWidth; // force reflow so the class re-triggers
      els.scoreValue.classList.add('bump');
      clearTimeout(bumpTimer);
      bumpTimer = setTimeout(function () {
        if (els) els.scoreValue.classList.remove('bump');
      }, 250);
    },

    setHeight: function (n) {
      if (!els || n === last.height) return;
      last.height = n;
      els.height.textContent = n + ' ' + ORB.I18N.t('meters');
    },

    setVoid: function (v) {
      if (!els) return;
      var x = v > 1 ? 1 : (v > 0 ? v : 0);
      if (x !== last.voidV) {
        last.voidV = x;
        els.hud.style.setProperty('--void', String(x));
      }
      var danger = x > VOID_DANGER;
      if (danger !== last.voidDanger) {
        last.voidDanger = danger;
        if (danger) els.voidEdge.classList.add('danger');
        else els.voidEdge.classList.remove('danger');
      }
    },

    setCombo: function (n) {
      if (!els || n === last.combo) return;
      last.combo = n;
      if (n <= 1) {
        setHidden(els.combo, true);
        return;
      }
      var max = (ORB.CONFIG && ORB.CONFIG.MAX_COMBO) || 5;
      var ratio = Math.min(1, n / max);
      els.combo.textContent = 'x' + n;
      els.combo.style.setProperty('--combo', String(ratio));
      setHidden(els.combo, false);
    },

    setPowerups: function (state) {
      if (!els || !state) return;
      var I18N = ORB.I18N;
      var shield = !!state.shield;
      var magnet = state.magnet || 0;
      var slow = state.slow || 0;
      // Display values change at most once per second, so compare what is shown.
      var magnetKey = magnet > 0 ? Math.ceil(magnet) : 0;
      var slowKey = slow > 0 ? Math.ceil(slow) : 0;

      if (shield !== last.shield) {
        last.shield = shield;
        setHidden(els.shield, !shield);
        if (shield) els.shield.textContent = I18N.t('shield');
      }

      if (magnetKey !== last.magnet) {
        last.magnet = magnetKey;
        setHidden(els.magnet, !(magnet > 0));
        if (magnet > 0) els.magnet.textContent = I18N.t('magnet') + ' ' + magnetKey;
      }

      if (slowKey !== last.slow) {
        last.slow = slowKey;
        setHidden(els.slow, !(slow > 0));
        if (slow > 0) els.slow.textContent = I18N.t('slow') + ' ' + slowKey;
      }
    },

    flash: function (text, color) {
      if (!els) return;
      var el = els.flash;
      el.textContent = text;
      el.style.color = color || '';
      el.classList.remove('show');
      void el.offsetWidth; // force reflow so the animation restarts
      el.classList.add('show');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () {
        if (els) els.flash.classList.remove('show');
      }, 900);
    },

    toast: function (title, text) {
      if (!els) return;
      toastQueue.push({ title: String(title || ''), text: String(text || '') });
      if (toastQueue.length > TOAST_MAX_QUEUE) toastQueue.shift();
      pumpToast();
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var handlers = {};
  var screensEl = null;
  var sections = {};      // name -> <section>
  var primary = {};       // name -> primary button
  var soundBtns = [];     // all sound toggle buttons
  var skinsEl = null;
  var currentName = null;
  var lastData = {};

  var STAT_KEYS = ['planets', 'stars', 'height', 'slingshots', 'comets', 'wormholes'];

  function t(key, vars) { return ORB.I18N.t(key, vars); }

  // Numeric stat value; anything missing or invalid counts as 0.
  function num(v) {
    return (typeof v === 'number' && isFinite(v)) ? v : 0;
  }

  // Create element helper: el(tag, className, text)
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.addEventListener('click', function () {
      try { ORB.Audio.play('click'); } catch (e) { /* audio is optional */ }
      if (onClick) onClick();
    });
    return b;
  }

  function soundButton() {
    var b = btn('btn btn-ghost sound-btn', '', function () {
      var muted = handlers.onToggleSound ? handlers.onToggleSound() : ORB.Audio.toggle();
      refreshSound(muted);
    });
    soundBtns.push(b);
    return b;
  }

  function refreshSound(muted) {
    if (typeof muted !== 'boolean') muted = ORB.Audio.isMuted();
    var label = t(muted ? 'soundOff' : 'soundOn');
    for (var i = 0; i < soundBtns.length; i++) soundBtns[i].textContent = label;
  }

  function bestOf(data) {
    if (data && typeof data.best === 'number') return data.best;
    return ORB.Storage.getBest();
  }

  // { got, total } for the achievements button; safe if the module is missing.
  function achCount() {
    try {
      return ORB.Achievements.count();
    } catch (e) {
      return { got: 0, total: 0 };
    }
  }

  // ---- Skins (menu only) ----
  function renderSkins(best) {
    if (!skinsEl) return;
    skinsEl.innerHTML = '';
    var list = ORB.Skins.list;
    var selectedId = ORB.Skins.currentId();
    for (var i = 0; i < list.length; i++) {
      (function (skin) {
        var unlocked = ORB.Skins.isUnlocked(skin, best);
        var cls = 'skin';
        if (!unlocked) cls += ' locked';
        if (skin.id === selectedId) cls += ' selected';
        var b = btn(cls, '', function () {
          if (!ORB.Skins.isUnlocked(skin, ORB.Storage.getBest())) return;
          ORB.Skins.select(skin.id);
          renderSkins(bestOf(lastData));
        });
        var dot = el('span', 'skin-dot');
        dot.style.background = skin.color;
        b.appendChild(dot);
        b.appendChild(el('span', 'skin-name', ORB.Skins.name(skin)));
        if (!unlocked) b.appendChild(el('span', 'skin-lock', t('locked', { n: skin.unlock })));
        skinsEl.appendChild(b);
      })(list[i]);
    }
  }

  // ---- Build DOM ----
  function buildMenu() {
    var sec = el('section', 'screen screen-menu');
    var card = el('div', 'screen-card');
    card.appendChild(el('h1', 'game-title', t('title')));
    card.appendChild(el('p', 'subtitle', t('subtitle')));
    sec.bestStat = el('p', 'stat');
    card.appendChild(sec.bestStat);
    var play = btn('btn btn-primary', t('play'), function () { handlers.onPlay && handlers.onPlay(); });
    primary.menu = play;
    card.appendChild(play);
    sec.achBtn = btn('btn btn-ghost ach-btn', '', function () { show('achievements'); });
    card.appendChild(sec.achBtn);
    card.appendChild(el('h2', 'section-title', t('skins')));
    skinsEl = el('div', 'skins');
    card.appendChild(skinsEl);
    card.appendChild(soundButton());
    sec.appendChild(card);
    return sec;
  }

  function buildPause() {
    var sec = el('section', 'screen screen-pause');
    var card = el('div', 'screen-card');
    card.appendChild(el('h2', 'screen-title', t('paused')));
    var resume = btn('btn btn-primary', t('resume'), function () { handlers.onResume && handlers.onResume(); });
    primary.pause = resume;
    card.appendChild(resume);
    card.appendChild(btn('btn', t('restart'), function () { handlers.onRestart && handlers.onRestart(); }));
    card.appendChild(btn('btn', t('menu'), function () { handlers.onMenu && handlers.onMenu(); }));
    card.appendChild(soundButton());
    sec.appendChild(card);
    return sec;
  }

  function buildOver() {
    var sec = el('section', 'screen screen-over');
    var card = el('div', 'screen-card');
    card.appendChild(el('h2', 'screen-title', t('gameOver')));
    sec.reason = el('p', 'reason');
    card.appendChild(sec.reason);
    sec.bigScore = el('div', 'big-score');
    card.appendChild(sec.bigScore);
    sec.bestStat = el('p', 'stat');
    card.appendChild(sec.bestStat);
    sec.badge = el('span', 'badge new-best hidden', t('newBest'));
    card.appendChild(sec.badge);

    // Run stats: label + value cells.
    var grid = el('div', 'stats-grid');
    sec.cells = {};
    for (var i = 0; i < STAT_KEYS.length; i++) {
      var key = STAT_KEYS[i];
      var cell = el('div', 'stat-cell');
      cell.appendChild(el('div', 'stat-label', t(key)));
      var value = el('div', 'stat-value', '0');
      cell.appendChild(value);
      sec.cells[key] = value;
      grid.appendChild(cell);
    }
    sec.statsGrid = grid;
    card.appendChild(grid);

    // Achievements unlocked during this run.
    sec.newAch = el('div', 'new-ach hidden');
    card.appendChild(sec.newAch);

    var restart = btn('btn btn-primary', t('restart'), function () { handlers.onRestart && handlers.onRestart(); });
    primary.over = restart;
    card.appendChild(restart);
    card.appendChild(btn('btn', t('menu'), function () { handlers.onMenu && handlers.onMenu(); }));
    sec.appendChild(card);
    return sec;
  }

  function buildAchievements() {
    var sec = el('section', 'screen screen-achievements');
    var card = el('div', 'screen-card');
    card.appendChild(el('h2', 'screen-title', t('achievements')));
    sec.list = el('div', 'ach-list');
    card.appendChild(sec.list);
    var back = btn('btn btn-primary', t('back'), function () { show('menu'); });
    primary.achievements = back;
    card.appendChild(back);
    sec.appendChild(card);
    return sec;
  }

  // ---- Dynamic text ----
  function fillMenu(data) {
    var best = bestOf(data);
    sections.menu.bestStat.textContent = t('best') + ': ' + best;
    var c = achCount();
    sections.menu.achBtn.textContent = t('achievements') + ' ' + c.got + '/' + c.total;
    renderSkins(best);
    refreshSound();
  }

  function fillPause() {
    refreshSound();
  }

  function fillOver(data) {
    var d = data || {};
    var st = d.stats || {};
    var best = bestOf(d);
    sections.over.reason.textContent = t(d.reason || 'lostTime');
    sections.over.bigScore.textContent = String(d.score || 0);
    sections.over.bestStat.textContent = t('best') + ': ' + best;
    sections.over.badge.classList.toggle('hidden', !d.newBest);

    var cells = sections.over.cells;
    var planets = typeof st.planets === 'number' ? st.planets : d.planets;
    cells.planets.textContent = String(num(planets));
    cells.stars.textContent = String(num(st.stars));
    cells.height.textContent = Math.floor(num(st.height)) + ' ' + t('meters');
    cells.slingshots.textContent = String(num(st.slingshots));
    cells.comets.textContent = String(num(st.comets));
    cells.wormholes.textContent = String(num(st.wormholes));

    var box = sections.over.newAch;
    box.innerHTML = '';
    var fresh = Array.isArray(d.newAchievements) ? d.newAchievements : [];
    box.classList.toggle('hidden', fresh.length === 0);
    if (fresh.length) {
      box.appendChild(el('div', 'new-ach-title', t('achievementUnlocked')));
      for (var i = 0; i < fresh.length; i++) {
        box.appendChild(el('div', 'new-ach-item', ORB.Achievements.name(fresh[i])));
      }
    }
  }

  function fillAchievements() {
    var list = sections.achievements.list;
    var A = ORB.Achievements;
    var done = A.unlocked();
    list.innerHTML = '';
    for (var i = 0; i < A.list.length; i++) {
      var a = A.list[i];
      var got = done.indexOf(a.id) !== -1;
      var item = el('div', got ? 'ach' : 'ach locked');
      item.appendChild(el('div', 'ach-name', A.name(a)));
      item.appendChild(el('div', 'ach-desc', A.desc(a)));
      list.appendChild(item);
    }
  }

  // ---- Public API ----
  function init(h) {
    handlers = h || {};
    screensEl = document.getElementById('screens');
    if (!screensEl) return;
    screensEl.innerHTML = '';
    soundBtns = [];
    sections.menu = buildMenu();
    sections.pause = buildPause();
    sections.over = buildOver();
    sections.achievements = buildAchievements();
    screensEl.appendChild(sections.menu);
    screensEl.appendChild(sections.pause);
    screensEl.appendChild(sections.over);
    screensEl.appendChild(sections.achievements);
  }

  function show(name, data) {
    if (!sections[name]) return;
    lastData = data || {};
    if (name === 'menu') fillMenu(lastData);
    else if (name === 'pause') fillPause();
    else if (name === 'over') fillOver(lastData);
    else if (name === 'achievements') fillAchievements();

    for (var k in sections) {
      if (Object.prototype.hasOwnProperty.call(sections, k)) {
        sections[k].classList.toggle('active', k === name);
      }
    }
    screensEl.classList.add('has-active');
    currentName = name;
    if (primary[name]) {
      try { primary[name].focus(); } catch (e) { /* ignore */ }
    }
  }

  function hideAll() {
    for (var k in sections) {
      if (Object.prototype.hasOwnProperty.call(sections, k)) sections[k].classList.remove('active');
    }
    if (screensEl) screensEl.classList.remove('has-active');
    // Drop focus from the hidden button so Space/Enter reach the game again.
    var a = document.activeElement;
    if (a && a.blur && screensEl && screensEl.contains(a)) a.blur();
    currentName = null;
  }

  function current() {
    return currentName;
  }

  ORB.Screens = {
    init: init,
    show: show,
    hideAll: hideAll,
    current: current
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  // Seconds a step hint stays on screen before auto-hiding.
  var HIDE_AFTER = 3.2;

  // Step name -> i18n key of its text. 'launch' is the tap hint (has the tap icon).
  var KEYS = {
    launch: 'tapHint',
    gravity: 'tutGravity',
    void: 'tutVoid',
    star: 'tutStar',
    blackhole: 'tutBlackhole',
    crumble: 'tutCrumble'
  };

  var built = false;
  var textEl = null;   // the <p> inside the hint
  var timer = null;    // auto-hide timeout handle (step hints only)
  var current = null;  // name of the hint currently visible, or null
  var queued = null;   // at most one step name waiting for the screen to clear

  // Returns the #tutorial container (looked up lazily, never at load time).
  function root() {
    return document.getElementById('tutorial');
  }

  // Seen-set of one-time step names, stored under 'tutorialSeen'.
  function getSeen() {
    try {
      var s = ORB.Storage.get('tutorialSeen', {});
      return (s && typeof s === 'object') ? s : {};
    } catch (e) {
      return {};
    }
  }

  function markSeen(name) {
    try {
      var s = getSeen();
      s[name] = true;
      ORB.Storage.set('tutorialSeen', s);
    } catch (e) {
      // storage unavailable: the hint may repeat, which is harmless
    }
  }

  // Builds the hint DOM once. Returns false when there is no container.
  function build(el) {
    if (built) return true;
    el.innerHTML = '';
    var hint = document.createElement('div');
    hint.className = 'tutorial-hint';

    var icon = document.createElement('div');
    icon.className = 'tap-icon';

    textEl = document.createElement('p');

    hint.appendChild(icon);
    hint.appendChild(textEl);
    el.appendChild(hint);
    built = true;
    return true;
  }

  function clearTimer() {
    if (timer !== null) {
      clearTimeout(timer);
      timer = null;
    }
  }

  // Puts the text of hint `name` on screen. Returns false when there is no container.
  function render(name) {
    var el = root();
    if (!el) return false;
    build(el);
    textEl.textContent = ORB.I18N.t(KEYS[name]);
    if (name === 'launch') {
      el.classList.remove('no-icon');
    } else {
      el.classList.add('no-icon');
    }
    el.classList.add('show');
    current = name;
    return true;
  }

  // Hides whatever is visible right now.
  function hideNow() {
    clearTimer();
    current = null;
    var el = root();
    if (el) el.classList.remove('show');
  }

  // Shows the queued step, if nothing else is visible.
  function drain() {
    if (current !== null || queued === null) return;
    var name = queued;
    queued = null;
    if (!getSeen()[name]) startStep(name);
  }

  // Shows a one-time step hint and schedules its auto-hide.
  function startStep(name) {
    if (!render(name)) return;
    markSeen(name);
    clearTimer();
    timer = setTimeout(function () {
      timer = null;
      hideNow();
      drain();
    }, HIDE_AFTER * 1000);
  }

  ORB.Tutorial = {
    // True until the player has finished the tutorial once.
    shouldShow: function () {
      return !ORB.Storage.get('tutorialDone', false);
    },

    // Shows the persistent 'launch' tap hint (stays until done()).
    show: function () {
      if (!root()) return;
      clearTimer();
      render('launch');
    },

    // Hides the hint without marking the tutorial as done.
    hide: function () {
      hideNow();
    },

    // Hides the hint and remembers that the tutorial was completed.
    done: function () {
      hideNow();
      ORB.Storage.set('tutorialDone', true);
      drain();
    },

    // Shows the one-time hint `name` (once ever, auto-hides after 3.2 s).
    // Does not interrupt a visible hint: it is queued (at most one waits).
    step: function (name) {
      if (!Object.prototype.hasOwnProperty.call(KEYS, name)) return;
      if (!root()) return;
      if (getSeen()[name]) return;
      if (current === name) return;
      if (current !== null) {
        if (queued === null) queued = name;
        return;
      }
      startStep(name);
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  // States: 'menu' | 'play' | 'pause' | 'dying' | 'over'
  var state = 'menu';
  var canvas = null, ctx = null;
  var player = null;
  var time = 0, lastT = null;
  var deathT = 0, deathReason = '';
  var tutorialOn = false;
  var booted = false;

  // Per-run bookkeeping
  var flightId = 0;          // increments every time the ship starts a free flight
  var launchAng = 0;         // direction of the current flight at launch
  var bendValid = false;     // false after a wormhole jump (angle comparison is meaningless)
  var gravityChecked = false;
  var tutSeen = {};          // tutorial names already requested this run
  var runAch = [];           // achievements unlocked during this run
  var achDirty = false, achTimer = 0;
  var dangerS = 0;           // smoothed void danger 0..1
  var voidWarnCd = 0;
  var emberT = 0;
  var diffN = -1, diffObj = null;
  var musicWanted = false, musicRunning = false;
  var errSeen = {};
  var lastHeight = -1, lastVoidHud = -1;
  var whPending = [];        // [prev, planet, diff, ...] wormhole spawns waiting for the next planet

  // ---------- safety helpers ----------

  function logOnce(tag, e) {
    if (errSeen[tag]) return;
    errSeen[tag] = true;
    try { console.error('[ORBITA] error in ' + tag + ':', e); } catch (x) { /* ignore */ }
  }

  // Call ORB[mod][fn](...) if it exists; never throws. Returns the result.
  function opt(mod, fn, a, b, c, d, e, f, g) {
    var m = ORB[mod];
    if (!m || typeof m[fn] !== 'function') return undefined;
    try {
      return m[fn](a, b, c, d, e, f, g);
    } catch (err) {
      logOnce(mod + '.' + fn, err);
      return undefined;
    }
  }

  function t(key) {
    try { return ORB.I18N.t(key); } catch (e) { return key; }
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function getDiff() {
    var n = ORB.Score.planets;
    if (n !== diffN || !diffObj) {
      diffN = n;
      diffObj = ORB.Difficulty.get(n);
    }
    return diffObj;
  }

  function zoomNow() {
    var z = ORB.Camera.getZoom ? ORB.Camera.getZoom() : ORB.Camera.zoom;
    return z > 0 ? z : 1;
  }

  function planetColor(p) {
    return ORB.M.hsl(p.hue || 200, 80, 65);
  }

  // World-space popup, falls back to the HUD flash when FX is missing.
  function say(x, y, text, color, size) {
    if (ORB.FX && typeof ORB.FX.popup === 'function') opt('FX', 'popup', x, y, text, color, size);
    else opt('HUD', 'flash', text, color);
  }

  // ---------- music ----------

  function startMusic() {
    musicWanted = true;
    // Retry when the audio context could not start earlier (e.g. no gesture yet).
    if (musicRunning && opt('Music', 'isPlaying') !== false) return;
    musicRunning = true;
    opt('Music', 'setMuted', ORB.Audio.isMuted());
    opt('Music', 'start');
  }

  function stopMusic() {
    if (!musicRunning) return;
    musicRunning = false;
    opt('Music', 'stop');
  }

  // ---------- achievements ----------

  function checkAch() {
    var A = ORB.Achievements;
    if (!A || typeof A.check !== 'function') return;
    var got;
    try { got = A.check(ORB.Score.stats()) || []; } catch (e) { logOnce('Achievements.check', e); return; }
    for (var i = 0; i < got.length; i++) {
      runAch.push(got[i]);
      var name = '';
      try { name = A.name(got[i]); } catch (e2) { name = got[i].id || ''; }
      opt('HUD', 'toast', t('achievementUnlocked'), name);
      opt('Audio', 'play', 'achievement');
    }
  }

  // ---------- tutorials ----------

  function tut(name) {
    if (tutorialOn || tutSeen[name]) return;
    tutSeen[name] = true;
    opt('Tutorial', 'step', name);
  }

  // ---------- world generation ----------

  // Previous non-blackhole planet in the chain before planet c.
  function prevChain(c) {
    var list = ORB.Planets.list;
    for (var j = list.indexOf(c) - 1; j >= 0; j--) {
      if (list[j].type !== 'blackhole') return list[j];
    }
    return null;
  }

  // Generate planets above the camera, plus stars, power-ups and wormholes in the gaps.
  function ensureAhead() {
    var diff = getDiff();
    var topY = ORB.Camera.y - ORB.View.visibleH(zoomNow()) * 1.2;
    var created = ORB.Planets.ensure(topY, diff) || [];
    for (var i = 0; i < created.length; i++) {
      var p = created[i];
      if (p.type === 'blackhole') continue;
      var prev = prevChain(p);
      if (!prev) continue;
      ORB.Stars.spawnBetween(prev, p, diff);
      ORB.Powerups.maybeSpawnBetween(prev, p, diff);
      // The wormhole exit sits above p, where the next planet is generated: wait
      // until that planet exists so the exit is placed clear of it.
      whPending.push(prev, p, diff);
    }
    var top = ORB.Planets.highest();
    var keep = 0;
    for (var k = 0; k < whPending.length; k += 3) {
      var wp = whPending[k + 1];
      if (wp === top) {
        whPending[keep++] = whPending[k];
        whPending[keep++] = wp;
        whPending[keep++] = whPending[k + 2];
      } else if (ORB.Planets.list.indexOf(wp) !== -1) {
        opt('Wormholes', 'maybeSpawnBetween', whPending[k], wp, whPending[k + 2]);
      }
    }
    whPending.length = keep;
  }

  // Remove everything that has fallen far below.
  function pruneWorld() {
    var vy = (ORB.Void && typeof ORB.Void.y === 'number') ? ORB.Void.y : -Infinity;
    var bottomY = Math.max(vy, ORB.Camera.y + ORB.View.visibleH(zoomNow()));
    ORB.Planets.prune(bottomY);
    ORB.Stars.prune(bottomY);
    ORB.Asteroids.prune(bottomY);
    ORB.Powerups.prune(bottomY);
    opt('Comets', 'prune', bottomY, ORB.View.visibleW(zoomNow()));
    opt('Wormholes', 'prune', bottomY);
  }

  function setupWorld() {
    var CFG = ORB.CONFIG;
    whPending.length = 0;
    ORB.Planets.reset();
    ORB.Stars.reset();
    ORB.Asteroids.reset();
    ORB.Powerups.reset();
    opt('Comets', 'reset');
    opt('Wormholes', 'reset');
    ORB.Particles.reset();
    opt('FX', 'reset');
    opt('TimeFX', 'reset');
    ORB.Score.reset();
    player = ORB.Player.create(ORB.Planets.list[0]);
    opt('Void', 'reset', player.planet.y + CFG.VOID_START);
    ORB.Camera.reset(CFG.WORLD_W / 2, player.planet.y - ORB.View.h * CFG.CAMERA_LEAD);
    flightId = 0;
    launchAng = 0;
    bendValid = false;
    gravityChecked = false;
    tutSeen = {};
    runAch = [];
    achDirty = false;
    achTimer = 0;
    dangerS = 0;
    voidWarnCd = 0;
    emberT = 0;
    diffN = -1;
    diffObj = null;
    lastHeight = -1;
    lastVoidHud = -1;
    opt('FX', 'setDanger', 0);
    opt('FX', 'setSpeed', 0);
    ensureAhead();
  }

  // ---------- game flow ----------

  function start() {
    setupWorld();
    state = 'play';
    ORB.Screens.hideAll();
    ORB.HUD.show();
    ORB.HUD.setScore(0);
    ORB.HUD.setCombo(1);
    opt('HUD', 'setHeight', 0);
    opt('HUD', 'setVoid', 0);
    tutorialOn = !!ORB.Tutorial.shouldShow();
    if (tutorialOn) ORB.Tutorial.show();
    startMusic();
  }

  function pause() {
    if (state !== 'play') return;
    state = 'pause';
    ORB.Screens.show('pause');
    stopMusic();
  }

  function resume() {
    if (state !== 'pause') return;
    state = 'play';
    lastT = null; // avoid a dt spike after the pause
    ORB.Screens.hideAll();
    startMusic();
  }

  function togglePause() {
    if (state === 'play') pause();
    else if (state === 'pause') resume();
  }

  function toMenu() {
    ORB.Tutorial.hide();
    tutorialOn = false;
    setupWorld();
    state = 'menu';
    ORB.HUD.hide();
    ORB.Screens.show('menu', { best: ORB.Storage.getBest() });
    if (musicWanted) startMusic();
  }

  function die(reason) {
    var CFG = ORB.CONFIG, p = player;
    state = 'dying';
    deathT = 0;
    deathReason = reason;
    p.state = 'dead';
    ORB.Tutorial.hide();
    tutorialOn = false;
    ORB.Particles.burst(p.x, p.y, CFG.COLORS.danger, 40, 240, 0.9);
    opt('Particles', 'debris', p.x, p.y, CFG.COLORS.danger, 14);
    opt('FX', 'shockwave', p.x, p.y, CFG.COLORS.danger, 130);
    opt('FX', 'flash', CFG.COLORS.danger, 0.45);
    opt('FX', 'setSpeed', 0);
    ORB.Camera.shake(10, 0.4);
    opt('TimeFX', 'slowmo', 0.3, 0.8);
    ORB.Audio.play('death');
    if (reason === 'lostVoid') opt('Audio', 'play', 'void');
    else if (reason === 'lostStar') opt('Audio', 'play', 'burn');
    opt('Haptics', 'buzz', [30, 40, 60]);
  }

  function finishDeath() {
    var score = ORB.Score.value;
    var best = ORB.Storage.getBest();
    var newBest = score > best;
    if (newBest) {
      ORB.Storage.setBest(score);
      best = score;
    }
    checkAch();
    opt('HUD', 'setVoid', 0);
    opt('FX', 'setDanger', 0);
    ORB.HUD.hide();
    state = 'over';
    ORB.Screens.show('over', {
      score: score,
      best: best,
      newBest: newBest,
      planets: ORB.Score.planets,
      reason: deathReason,
      stats: ORB.Score.stats(),
      newAchievements: runAch.slice()
    });
  }

  // ---------- gameplay events ----------

  function beginFlight() {
    flightId++;
    gravityChecked = false;
  }

  // Combo/score bonus with popup. Returns points.
  function bonus(kind, x, y, label, color, size) {
    var pts = ORB.Score.addBonus(kind) || 0;
    ORB.HUD.setScore(ORB.Score.value);
    say(x, y, label + ' +' + pts, color, size || 20);
    achDirty = true;
    return pts;
  }

  // Ship flew inside the latch zone of `hit`.
  function onLatch(hit) {
    var CFG = ORB.CONFIG, p = player;
    var flyTime = p.flyTime;
    var wasVisited = hit.visited;
    var from = p.fromPlanet;

    // How far gravity bent the path since launch.
    var bent = false;
    if (bendValid && flyTime > 0.25 && hit !== from && !wasVisited) {
      var da = Math.abs(ORB.M.wrapAngle(Math.atan2(p.vy, p.vx) - launchAng));
      bent = da > 0.873; // 50 degrees
    }

    var s = ORB.Player.latch(p, hit);
    var color = planetColor(hit);
    opt('Planets', 'impact', hit, s, p.angle);
    ORB.Audio.play('latch', s);
    ORB.Haptics.buzz(s > 0.5 ? [14, 10, 20] : 10);
    ORB.Particles.ring(hit.x, hit.y, color, hit.orbitRadius);
    ORB.Particles.burst(p.x, p.y, color, Math.round(8 + 14 * s), 110 + 200 * s, 0.5, { type: 'spark' });
    opt('FX', 'shockwave', hit.x, hit.y, color, hit.orbitRadius * (1.1 + 0.5 * s));
    ORB.Camera.shake(3 + 6 * s, 0.25);
    if (s > 0.5) opt('TimeFX', 'hitstop', 0.03 + 0.05 * s);

    hit._gWarn = false;
    hit._gEmber = 0;

    if (!wasVisited) {
      hit.visited = true;
      var r = ORB.Score.addPlanet(flyTime);
      ORB.HUD.setScore(ORB.Score.value);
      ORB.HUD.setCombo(r.combo);
      say(hit.x, hit.y - hit.radius - 18, '+' + r.points, CFG.COLORS.text, 22);
      if (r.perfect) {
        ORB.Audio.play('perfect');
        opt('FX', 'flash', CFG.COLORS.accent, 0.18);
        say(hit.x, hit.y - hit.radius - 46, t('perfect') + ' x' + r.combo, CFG.COLORS.accent, 24);
      }
      achDirty = true;
    }

    if (bent) {
      bonus('slingshot', hit.x, hit.y - hit.radius - 74, t('slingshot'), CFG.COLORS.accent2, 22);
      ORB.Audio.play('slingshot');
    }

    if (hit.type === 'crumble') {
      opt('Planets', 'startCrumble', hit);
      tut('crumble');
    } else if (hit.type === 'star') {
      tut('star');
    }
    bendValid = false;
  }

  function onTap() {
    if (state === 'menu') return start();
    if (state !== 'play' || player.state !== 'orbit') return;
    var CFG = ORB.CONFIG;
    startMusic();
    ORB.Player.launch(player);
    beginFlight();
    launchAng = Math.atan2(player.vy, player.vx);
    bendValid = true;
    ORB.Audio.play('launch');
    ORB.Haptics.buzz(8);
    ORB.Particles.burst(player.x, player.y, CFG.COLORS.accent, 12, 140, 0.4);
    if (tutorialOn) {
      ORB.Tutorial.done();
      tutorialOn = false;
    }
  }

  // Black hole passes: awards the slingshot bonus once per hole per flight.
  function blackholePass(p) {
    var CFG = ORB.CONFIG;
    var list = ORB.Planets.list;
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (b.type !== 'blackhole' || b.dead || b._gPass === flightId) continue;
      var d = ORB.M.dist(p.x, p.y, b.x, b.y);
      if (d < b.radius * 2.4) {
        b._gPass = flightId;
        ORB.Score.blackholePasses++;
        bonus('slingshot', p.x, p.y - 26, t('slingshot'), CFG.COLORS.accent2, 22);
        ORB.Audio.play('slingshot');
        opt('TimeFX', 'slowmo', 0.45, 0.6);
        opt('FX', 'flash', CFG.COLORS.accent2, 0.2);
        ORB.Haptics.buzz([10, 20, 10]);
      }
    }
  }

  // Per-planet housekeeping: star cooling, crumble debris, death effects, hints.
  function planetPass(sdt, playing) {
    var list = ORB.Planets.list;
    var cur = (player.state === 'orbit') ? player.planet : null;
    var cy = ORB.Camera.y, vh = ORB.View.visibleH(zoomNow());
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (p.type === 'star' && p !== cur && p.heat > 0) p.heat = Math.max(0, p.heat - 0.5 * sdt);
      var visible = Math.abs(p.y - cy) < vh;
      if (p.dead) {
        if (!p._gFx) {
          p._gFx = true;
          if (visible && p.type !== 'blackhole') deadFx(p);
        }
        continue;
      }
      if (p.crumble > 0 && p.crumble < 1 && visible) {
        p._gDb = (p._gDb || 0) - sdt;
        if (p._gDb <= 0) {
          p._gDb = 0.22;
          var a = Math.random() * Math.PI * 2;
          opt('Particles', 'debris', p.x + Math.cos(a) * p.radius, p.y + Math.sin(a) * p.radius,
            planetColor(p), 2);
        }
      }
      if (playing && p.type === 'blackhole' && Math.abs(p.y - cy) < vh * 0.45) tut('blackhole');
    }
  }

  // Planet crumbled or was eaten by the void.
  function deadFx(p) {
    var CFG = ORB.CONFIG;
    if (p.crumble >= 1) {
      var color = planetColor(p);
      opt('Particles', 'debris', p.x, p.y, color, 26);
      ORB.Particles.burst(p.x, p.y, color, 18, 160, 0.8, { type: 'smoke' });
      opt('FX', 'shockwave', p.x, p.y, color, p.orbitRadius * 1.4);
      ORB.Camera.shake(5, 0.25);
      ORB.Audio.play('crumble');
    } else {
      ORB.Particles.burst(p.x, p.y, CFG.COLORS.danger, 16, 140, 0.9, { type: 'ember' });
      opt('FX', 'shockwave', p.x, p.y, CFG.COLORS.danger, p.orbitRadius);
    }
  }

  // Orbiting: star overheating, crumbled planet release.
  function updateOrbit(sdt) {
    var CFG = ORB.CONFIG, p = player, pl = p.planet;
    if (!pl) return false;

    if (pl.dead && pl.crumble >= 1) {
      ORB.Player.release(p);
      beginFlight();
      bendValid = false;
      ORB.Camera.shake(6, 0.3);
      ORB.Haptics.buzz([20, 30, 20]);
      return false;
    }

    if (pl.type === 'star') {
      pl.heat = (pl.heat || 0) + CFG.STAR_HEAT_RATE * sdt;
      if (pl.heat >= 1) { die('lostStar'); return true; }
      if (pl.heat > 0.45 && !pl._gWarn) {
        pl._gWarn = true;
        say(p.x, p.y - 30, t('heat'), CFG.COLORS.danger, 22);
        ORB.Audio.play('burn');
        ORB.Haptics.buzz([15, 25, 15]);
      }
      if (pl.heat > 0.3) {
        emberT -= sdt;
        if (emberT <= 0) {
          emberT = 0.16;
          ORB.Particles.burst(p.x, p.y, CFG.COLORS.danger, 2, 70, 0.5, { type: 'ember' });
        }
      }
      if (pl.heat > 0.6) ORB.Camera.shake((pl.heat - 0.5) * 5, 0.12);
    }
    return false;
  }

  // Free flight: gravity hints, black holes, latching, bounds.
  function updateFly(sdt, px0, py0) {
    var CFG = ORB.CONFIG, p = player;

    // Black hole kill (also checks the midpoint so fast ships can't tunnel through).
    if (opt('Planets', 'blackholeKill', p.x, p.y) ||
        opt('Planets', 'blackholeKill', (p.x + px0) / 2, (p.y + py0) / 2)) {
      die('lostBlackhole');
      return true;
    }
    blackholePass(p);

    var ign = p.ignoreT > 0 ? p.ignorePlanet : null;

    if (!gravityChecked && !tutorialOn && p.flyTime > 0.15 && ORB.Physics && ORB.Physics.gravity) {
      var g = ORB.Physics.gravity(p.x, p.y, ORB.Planets.list, ign);
      if (g && Math.sqrt(g.ax * g.ax + g.ay * g.ay) > 90) {
        gravityChecked = true;
        tut('gravity');
      }
    }

    // Elastic side walls: bounce instead of dying.
    var W = CFG.WORLD_W;
    if (p.x < 14 || p.x > W - 14) {
      var left = p.x < 14;
      p.x = left ? 14 : W - 14;
      if (left ? p.vx < 0 : p.vx > 0) {
        p.vx = -p.vx * 0.8;
        p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        bendValid = false;
        ORB.Particles.burst(p.x, p.y, CFG.COLORS.accent, 8, 120, 0.35, { type: 'spark' });
        ORB.Audio.play('latch', 0.2);
        ORB.Camera.shake(2, 0.12);
        ORB.Haptics.buzz(6);
      }
    }

    var hit = ORB.Planets.findLatch(p.x, p.y, ign);
    if (hit) {
      onLatch(hit);
    } else if (p.flyTime > CFG.MAX_FLY_TIME) {
      die('lostTime');
      return true;
    } else if (p.x < -200 || p.x > W + 200) {
      die('lostScreen'); // safety net
      return true;
    }
    return false;
  }

  function updateCamera(dt) {
    var CFG = ORB.CONFIG, p = player;
    var orbit = p.state === 'orbit' && p.planet;
    var ty = (orbit ? p.planet.y : p.y + p.vy * 0.12) - ORB.View.h * CFG.CAMERA_LEAD;
    var tx = CFG.WORLD_W / 2 + (p.x - CFG.WORLD_W / 2) * 0.25;
    var u = clamp((p.speed - CFG.ZOOM_SPEED_LO) / (CFG.ZOOM_SPEED_HI - CFG.ZOOM_SPEED_LO), 0, 1);
    u = u * u * (3 - 2 * u);
    var tz = 1 - (1 - CFG.ZOOM_MIN) * u;
    ORB.Camera.update(dt, tx, ty, tz);
  }

  // Full gameplay step (only in 'play').
  function updatePlay(dt) {
    var CFG = ORB.CONFIG, p = player, i;
    var sdt = dt * (p.slowTime > 0 ? CFG.SLOW_FACTOR : 1);
    p.magnetTime = Math.max(0, p.magnetTime - dt);
    p.slowTime = Math.max(0, p.slowTime - dt);
    var diff = getDiff();

    var px0 = p.x, py0 = p.y;
    ORB.Planets.update(sdt);
    ORB.Player.update(p, sdt);
    p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    planetPass(sdt, true);

    if (p.state === 'orbit') {
      if (updateOrbit(sdt)) return;
      if (opt('Planets', 'blackholeKill', p.x, p.y)) return die('lostBlackhole');
    }
    if (p.state === 'fly') {
      if (updateFly(sdt, px0, py0)) return;
    }

    // The rising void
    var vdist = 1e9;
    if (ORB.Void && typeof ORB.Void.update === 'function') {
      opt('Void', 'update', sdt, p.y, ORB.View.h, diff);
      opt('Planets', 'consume', ORB.Void.y);
      vdist = ORB.Void.y - p.y;
      if (vdist < 0) return die('lostVoid');
      if (p.state === 'orbit' && p.planet && p.planet.dead && !(p.planet.crumble >= 1)) {
        return die('lostVoid');
      }
    }

    // Stars
    var got = ORB.Stars.update(sdt, p);
    if (got > 0) {
      var spts = 0;
      for (i = 0; i < got; i++) spts += ORB.Score.addStar();
      ORB.HUD.setScore(ORB.Score.value);
      ORB.Audio.play('star');
      ORB.Particles.burst(p.x, p.y, CFG.COLORS.star, 8 * got, 140, 0.5);
      say(p.x, p.y - 20, '+' + spts, CFG.COLORS.star, 18);
      achDirty = true;
    }

    // Power-ups
    var kinds = ORB.Powerups.update(sdt, p) || [];
    kinds.forEach(function (k) {
      if (k === 'shield') p.shield = true;
      else if (k === 'magnet') p.magnetTime = CFG.MAGNET_TIME;
      else if (k === 'slow') p.slowTime = CFG.SLOW_TIME;
      ORB.Audio.play('power');
      ORB.HUD.flash(t(k), CFG.COLORS.accent);
    });

    var vw = ORB.View.visibleW(zoomNow()), vh = ORB.View.visibleH(zoomNow());

    // Asteroids
    ORB.Asteroids.maybeSpawn(sdt, ORB.Camera.y, vw, vh, diff);
    var rock = ORB.Asteroids.update(sdt, p);
    if (rock) {
      if (p.shield) {
        p.shield = false;
        ORB.Asteroids.destroy(rock);
        ORB.Particles.burst(rock.x, rock.y, CFG.COLORS.danger, 20, 200, 0.6);
        ORB.Audio.play('shield');
        ORB.Camera.shake(5, 0.2);
      } else {
        return die('lostAsteroid');
      }
    } else {
      var near = opt('Asteroids', 'nearMiss', p);
      if (near && near.length) {
        for (i = 0; i < near.length; i++) {
          bonus('nearMiss', p.x, p.y - 24 - i * 20, t('nearMiss'), CFG.COLORS.star, 18);
          ORB.Audio.play('nearMiss');
        }
      }
    }

    // Comets
    if (ORB.Comets) {
      opt('Comets', 'maybeSpawn', sdt, ORB.Camera.y, vw, vh, diff);
      var comet = opt('Comets', 'update', sdt, p);
      if (comet && p.state === 'fly') {
        var cl = Math.sqrt(comet.vx * comet.vx + comet.vy * comet.vy) || 1;
        p.vx += comet.vx / cl * CFG.COMET_BOOST;
        p.vy += comet.vy / cl * CFG.COMET_BOOST;
        p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        bendValid = false;
        bonus('comet', p.x, p.y - 26, t('cometRide'), CFG.COLORS.accent, 22);
        ORB.Audio.play('comet');
        ORB.Particles.burst(p.x, p.y, CFG.COLORS.accent, 24, 220, 0.6, { type: 'spark' });
        opt('FX', 'shockwave', p.x, p.y, CFG.COLORS.accent, 70);
        ORB.Haptics.buzz(15);
      }
    }

    // Wormholes
    if (ORB.Wormholes) {
      var warp = opt('Wormholes', 'update', sdt, p);
      if (warp && warp.from && warp.to) {
        p.trail.length = 0;
        p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        bendValid = false;
        bonus('wormhole', p.x, p.y - 26, t('warp'), CFG.COLORS.accent2, 22);
        ORB.Audio.play('warp');
        opt('FX', 'shockwave', warp.from.x, warp.from.y, CFG.COLORS.accent2, 90);
        opt('FX', 'shockwave', warp.to.x, warp.to.y, CFG.COLORS.accent, 90);
        opt('FX', 'flash', CFG.COLORS.accent2, 0.3);
        ORB.Particles.burst(p.x, p.y, CFG.COLORS.accent, 24, 200, 0.6);
        ORB.Haptics.buzz([10, 20, 10]);
      }
    }

    // Score tracking, HUD, effects
    ORB.Score.setHeight(p.y);
    ORB.Score.trackSpeed(p.speed);
    if (ORB.Score.height !== lastHeight) {
      lastHeight = ORB.Score.height;
      opt('HUD', 'setHeight', lastHeight);
    }

    var danger = ORB.Void ? clamp(1 - vdist / (ORB.View.h * 0.75), 0, 1) : 0;
    dangerS += (danger - dangerS) * Math.min(1, 5 * dt);
    if (Math.abs(dangerS - lastVoidHud) > 0.01) {
      lastVoidHud = dangerS;
      opt('HUD', 'setVoid', dangerS);
    }
    opt('FX', 'setDanger', dangerS);
    opt('FX', 'setSpeed', clamp(p.speed / CFG.MAX_SPEED, 0, 1));
    opt('Music', 'setIntensity', Math.max(dangerS, ORB.Score.combo / CFG.MAX_COMBO));

    voidWarnCd -= dt;
    if (dangerS > 0.8 && voidWarnCd <= 0) {
      voidWarnCd = 10;
      ORB.HUD.flash(t('voidNear'), CFG.COLORS.danger);
      ORB.Audio.play('void');
    }
    if (vdist < ORB.View.h * 0.5 && ORB.Score.planets >= 3) tut('void');

    updateCamera(dt);
    ORB.Particles.update(dt);
    opt('FX', 'update', dt);
    ensureAhead();
    pruneWorld();
    ORB.HUD.setPowerups({ shield: p.shield, magnet: p.magnetTime, slow: p.slowTime });

    achTimer += dt;
    if (achDirty || achTimer >= 1) {
      achDirty = false;
      achTimer = 0;
      checkAch();
    }
  }


  // Light world animation used in menu, over and dying states.
  function stepWorld(dt) {
    ORB.Planets.update(dt);
    if (player.state === 'orbit') ORB.Player.update(player, dt);
    planetPass(dt, false);
    updateCamera(dt);
    ORB.Particles.update(dt);
    opt('FX', 'update', dt);
    ensureAhead();
    pruneWorld();
  }

  function update(dt, realDt) {
    if (state === 'play') {
      updatePlay(dt);
    } else if (state === 'dying') {
      if (ORB.Void && ORB.Void.update) opt('Void', 'update', dt, player.y, ORB.View.h, getDiff());
      stepWorld(dt);
      deathT += realDt;
      if (deathT >= ORB.CONFIG.DEATH_DELAY) finishDeath();
    } else if (state === 'menu' || state === 'over') {
      stepWorld(dt);
      opt('Music', 'setIntensity', state === 'menu' ? 0.12 : 0.18);
    }
    // 'pause': world frozen
  }

  // ---------- rendering ----------

  function render() {
    var View = ORB.View, cam = ORB.Camera;
    var zoom = zoomNow();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    View.screenTransform(ctx);
    opt('Background', 'draw', ctx, cam.y, time);

    View.worldTransform(ctx, cam.getX(), cam.getY(), zoom);
    var planets = ORB.Planets.list;
    var current = (player && player.state === 'orbit') ? player.planet : null;
    opt('RenderOrbits', 'draw', ctx, planets, time, player);
    opt('RenderPlanets', 'draw', ctx, planets, time, current);
    opt('RenderEntities', 'draw', ctx, ORB.Stars.list, ORB.Asteroids.list, ORB.Powerups.list,
      ORB.Comets ? ORB.Comets.list : [], ORB.Wormholes ? ORB.Wormholes.list : [], time);
    opt('Particles', 'draw', ctx);
    if (player && player.state !== 'dead') opt('RenderPlayer', 'draw', ctx, player, time);
    opt('FX', 'drawWorld', ctx);
    opt('Void', 'draw', ctx, time, cam.getX(), View.visibleW(zoom), View.visibleH(zoom));

    View.screenTransform(ctx);
    opt('FX', 'drawScreen', ctx);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var real = lastT === null ? 0 : Math.max(0, Math.min((now - lastT) / 1000, 0.033));
    lastT = now;
    var dt = real;
    try {
      if (state !== 'pause' && ORB.TimeFX && typeof ORB.TimeFX.update === 'function') {
        dt = ORB.TimeFX.update(real);
      }
      time += state === 'pause' ? real : dt;
      update(dt, real);
    } catch (e) {
      logOnce('update', e);
    }
    try {
      render();
    } catch (e2) {
      logOnce('render', e2);
    }
  }

  function init() {
    if (booted) return;
    booted = true;
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    ORB.View.init(canvas);
    ORB.Input.init(canvas);
    ORB.HUD.init({ onPause: pause });
    ORB.Screens.init({
      onPlay: function () { start(); },
      onResume: function () { resume(); },
      onRestart: function () { start(); },
      onMenu: function () { toMenu(); },
      onToggleSound: function () {
        var muted = ORB.Audio.toggle();
        opt('Music', 'setMuted', muted);
        return muted;
      }
    });
    ORB.Background.init();
    ORB.Input.onTap(onTap);
    ORB.Input.onPause(togglePause);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        pause();
        stopMusic();
      } else {
        lastT = null;
        if (musicWanted && state !== 'pause') startMusic();
      }
    });
    setupWorld();
    state = 'menu';
    ORB.Screens.show('menu', { best: ORB.Storage.getBest() });
    requestAnimationFrame(frame);
  }

  ORB.Game = {
    init: init,
    start: start,
    pause: pause,
    resume: resume,
    togglePause: togglePause,
    toMenu: toMenu,
    getState: function () { return state; },
    debug: function () { return { player: player, state: state }; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
