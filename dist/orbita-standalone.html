<style>
:root { color-scheme: dark; }
/* ORBITA - neon space UI. Layout: #app > canvas + #hud + #screens + #tutorial */

:root {
  --bg1: #05010f;
  --bg2: #140a33;
  --accent: #7df9ff;
  --accent2: #ff5fd2;
  --star: #ffd86b;
  --danger: #ff5a5a;
  --ok: #7dffb0;
  --text: #eef2ff;
  --text-dim: rgba(238, 242, 255, 0.72);
  --glass: linear-gradient(160deg, rgba(40, 24, 90, 0.55), rgba(10, 6, 30, 0.6));
  --glass-border: rgba(125, 249, 255, 0.24);
  --glow-accent: 0 0 18px rgba(125, 249, 255, 0.45);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --hud-h: clamp(56px, 9vh, 84px);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ---------- base ---------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg1);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(14px, 3.6vw, 16px);
  line-height: 1.4;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

.hidden {
  display: none !important;
}

/* ---------- app shell ---------- */

#app {
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, var(--bg2) 0%, var(--bg1) 70%);
  touch-action: none;
  overscroll-behavior: none;
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  outline: none;
}

#hud,
#screens,
#tutorial {
  position: absolute;
  inset: 0;
}

#hud {
  z-index: 5;
  pointer-events: none;
}

#tutorial {
  z-index: 6;
  pointer-events: none;
}

#screens {
  z-index: 10;
  pointer-events: none;
}

#screens.has-active {
  pointer-events: auto;
}

/* ---------- HUD ---------- */

.hud-top {
  position: absolute;
  top: calc(var(--safe-t) + 10px);
  left: calc(var(--safe-l) + 12px);
  right: calc(var(--safe-r) + 12px);
  height: var(--hud-h);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.hud-score {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.3em;
  font-size: clamp(40px, 10vw, 72px);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.hud-score-value {
  color: var(--text);
  text-shadow:
    0 0 18px rgba(125, 249, 255, 0.6),
    0 2px 0 rgba(0, 0, 0, 0.4);
  display: inline-block;
}

.hud-combo {
  font-size: 0.34em;
  font-weight: 800;
  line-height: 1;
  padding: 0.35em 0.7em;
  border: 1px solid var(--accent2);
  border-radius: 999px;
  color: var(--accent2);
  background: rgba(255, 95, 210, 0.12);
  text-shadow: 0 0 10px rgba(255, 95, 210, 0.7);
  box-shadow: 0 0 14px rgba(255, 95, 210, 0.35);
  white-space: nowrap;
  align-self: center;
}

/* Combo ring: a conic sweep drawn around the pill, filled by --combo (0..1, set from JS). */
.hud-combo {
  position: relative;
  isolation: isolate;
}

.hud-combo::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(
    var(--accent2) 0deg calc(var(--combo, 0) * 360deg),
    rgba(255, 95, 210, 0.18) calc(var(--combo, 0) * 360deg) 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: -1;
}

.icon-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 14px;
  border: 1px solid rgba(238, 242, 255, 0.22);
  background: rgba(20, 12, 50, 0.5);
  color: var(--text);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 14px rgba(125, 249, 255, 0.12);
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: transform 0.15s var(--ease-out), background 0.2s, box-shadow 0.2s;
}

.icon-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  display: block;
}

.icon-btn:hover {
  background: rgba(125, 249, 255, 0.14);
  box-shadow: var(--glow-accent);
}

.icon-btn:active {
  transform: translateY(-50%) scale(0.92);
}

.icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.hud-powerups {
  position: absolute;
  top: calc(var(--safe-t) + 10px + var(--hud-h) + 4px);
  left: var(--safe-l);
  right: var(--safe-r);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}

.pu {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: clamp(11px, 2.8vw, 13px);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--text);
  background: rgba(10, 6, 30, 0.6);
  border: 1px solid currentColor;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: chipIn 0.35s var(--ease-out) both;
}

.pu::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

.pu-shield {
  color: var(--accent);
  box-shadow: 0 0 12px rgba(125, 249, 255, 0.35);
}

.pu-magnet {
  color: var(--accent2);
  box-shadow: 0 0 12px rgba(255, 95, 210, 0.35);
}

.pu-slow {
  color: var(--ok);
  box-shadow: 0 0 12px rgba(125, 255, 176, 0.35);
}

/* Score pop: JS adds .bump briefly; restarts when the class is re-added after reflow. */
.bump {
  animation: scorePop 0.3s var(--ease-out);
}

/* Flash text: centered, pops in and fades out (JS removes .show after 900ms). */
.hud-flash {
  position: absolute;
  left: 0;
  right: 0;
  top: 40%;
  padding: 0 16px;
  text-align: center;
  font-size: clamp(28px, 8vw, 54px);
  font-weight: 900;
  letter-spacing: 0.04em;
  line-height: 1.1;
  color: var(--accent);
  text-shadow: 0 0 22px currentColor, 0 2px 0 rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}

.hud-flash.show {
  animation: flashPop 0.9s var(--ease-out) both;
}

/* Height readout: small pill on the left of the score row; digits do not jitter. */
.hud-height {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: rgba(10, 6, 30, 0.6);
  color: var(--accent);
  font-size: clamp(11px, 3.1vw, 13px);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: 0.02em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 10px rgba(125, 249, 255, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}

/* Void edge: rising darkness along the bottom. --void (0..1) is set from JS. */
.hud-void {
  --void: 0;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 18vh;
  background: linear-gradient(to top, rgba(255, 45, 85, calc(var(--void) * 0.55)), transparent);
  pointer-events: none;
}

.hud-void.danger {
  animation: voidPulse 0.9s ease-in-out infinite;
}

/* Toast: top-center card that slides down while .show is set (JS removes it after ~2.6 s). */
.hud-toast {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-t) + var(--hud-h) + 44px);
  width: max-content;
  max-width: min(88vw, 340px);
  padding: 10px 16px;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  background: rgba(10, 6, 30, 0.78);
  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.45),
    0 0 18px rgba(125, 249, 255, 0.2);
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -18px);
  transition: opacity 0.35s ease, transform 0.45s var(--ease-out);
}

.hud-toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.hud-toast-title {
  font-size: clamp(14px, 4vw, 17px);
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1.2;
  color: var(--accent);
  text-shadow: 0 0 12px rgba(125, 249, 255, 0.45);
}

.hud-toast-title:empty,
.hud-toast-text:empty {
  display: none;
}

.hud-toast-text {
  margin-top: 3px;
  font-size: clamp(12px, 3.4vw, 14px);
  font-weight: 600;
  line-height: 1.35;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

/* ---------- screens (menu / pause / over) ---------- */

.screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding:
    calc(var(--safe-t) + 16px)
    calc(var(--safe-r) + 16px)
    calc(var(--safe-b) + 16px)
    calc(var(--safe-l) + 16px);
  background: rgba(5, 1, 15, 0.55);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.screen.active {
  display: flex;
  animation: fadeIn 0.25s ease-out both;
}

.screen.active .screen-card {
  animation: cardIn 0.4s var(--ease-out) both;
}

.screen-card {
  position: relative;
  margin: auto;
  width: 100%;
  max-width: 420px;
  padding: clamp(18px, 4.5vw, 28px);
  text-align: center;
  border-radius: 22px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.08),
    0 20px 60px rgba(0, 0, 0, 0.6),
    0 0 40px rgba(125, 249, 255, 0.12);
}

.screen-card::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(125, 249, 255, 0.5), transparent 40%, rgba(255, 95, 210, 0.45));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.game-title {
  margin: 0;
  font-size: clamp(40px, 13vw, 64px);
  font-weight: 900;
  letter-spacing: 0.14em;
  line-height: 1.05;
  color: var(--accent);
  background: linear-gradient(90deg, var(--accent), #b38bff 55%, var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 14px rgba(125, 249, 255, 0.35));
}

.subtitle {
  margin: 8px 0 0;
  color: var(--text-dim);
  font-size: clamp(14px, 3.8vw, 16px);
}

.screen-title {
  margin: 0;
  font-size: clamp(26px, 7.5vw, 34px);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 0 16px rgba(125, 249, 255, 0.4);
}

.stat {
  margin: 12px 0 0;
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 700;
  color: var(--star);
  text-shadow: 0 0 12px rgba(255, 216, 107, 0.35);
  font-variant-numeric: tabular-nums;
}

.reason {
  margin: 10px 0 0;
  font-size: clamp(15px, 4vw, 17px);
  font-weight: 700;
  color: var(--danger);
  text-shadow: 0 0 12px rgba(255, 90, 90, 0.4);
}

.big-score {
  margin: 14px 0 0;
  font-size: clamp(52px, 16vw, 88px);
  font-weight: 900;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 26px rgba(125, 249, 255, 0.55);
}

.badge {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #05010f;
  background: linear-gradient(90deg, var(--accent2), #ffb3ec);
  box-shadow: 0 0 16px rgba(255, 95, 210, 0.55);
  animation: badgePulse 1.6s ease-in-out infinite;
}

.badge.new-best {
  /* new-best is shown via .hidden toggling; this class adds the highlight */
  margin-left: 6px;
}

/* ---------- buttons ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 48px;
  padding: 0 24px;
  margin: 0;
  border-radius: 14px;
  border: 1px solid rgba(238, 242, 255, 0.25);
  font-size: clamp(15px, 4vw, 17px);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s var(--ease-out), box-shadow 0.25s, background 0.25s, border-color 0.25s;
}

.screen-card .btn {
  margin-top: 12px;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(125, 249, 255, 0.5);
}

.btn:active {
  transform: scale(0.97);
}

.btn:focus-visible,
.skin:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.btn-primary {
  color: #05010f;
  border-color: transparent;
  background: linear-gradient(120deg, var(--accent) 0%, #a9c8ff 50%, var(--accent2) 100%);
  font-weight: 800;
  box-shadow: 0 0 24px rgba(125, 249, 255, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
}

.btn-primary:hover {
  background: linear-gradient(120deg, var(--accent) 0%, #a9c8ff 50%, var(--accent2) 100%);
  box-shadow: 0 0 34px rgba(125, 249, 255, 0.6), 0 6px 18px rgba(0, 0, 0, 0.35);
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(238, 242, 255, 0.22);
}

.sound-btn {
  font-size: clamp(14px, 3.8vw, 16px);
  font-weight: 600;
}

/* ---------- skins ---------- */

.section-title {
  margin: 22px 0 10px;
  font-size: 12px;
  font-weight: 800;

    lerp: function (a, b, t) {
      return a + (b - a) * t;
    },

    // Squared distance between two points (avoids sqrt).
    dist2: function (ax, ay, bx, by) {

    dist: function (ax, ay, bx, by) {
      return Math.sqrt(this.dist2(ax, ay, bx, by));

    rand: function (a, b) {
      return a + Math.random() * (b - a);

    randInt: function (a, b) {

    pick: function (arr) {

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var canvas = null;
  var callbacks = [];

  function notify() {
    for (var i = 0; i < callbacks.length; i++) {
      callbacks[i](ORB.View);
    }
  }

  ORB.View = {
    cssW: 0,
    cssH: 0,
    dpr: 1,
    scale: 1,
    w: 0,
    h: 0,

    // Store the canvas, listen for viewport changes, and do the first resize.
    init: function (c) {
      canvas = c;
      var self = this;
      var onChange = function () { self.resize(); };
      window.addEventListener('resize', onChange);
      window.addEventListener('orientationchange', onChange);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onChange);
      }
      this.resize();
    },

    // Fit the canvas to its parent and recompute the world scale.
    resize: function () {
      if (!canvas) return;
      var parent = canvas.parentElement || canvas;
      this.cssW = parent.clientWidth || window.innerWidth || 1;
      this.cssH = parent.clientHeight || window.innerHeight || 1;
      this.dpr = Math.min(window.devicePixelRatio || 1, ORB.CONFIG.MAX_DPR);

      canvas.width = Math.round(this.cssW * this.dpr);
      canvas.height = Math.round(this.cssH * this.dpr);
      canvas.style.width = this.cssW + 'px';
      canvas.style.height = this.cssH + 'px';

      this.scale = Math.min(this.cssW / ORB.CONFIG.WORLD_W, this.cssH / ORB.CONFIG.MIN_VIEW_H);
      this.w = this.cssW / this.scale;
      this.h = this.cssH / this.scale;

      notify();
    },

    // Register a callback called after every resize.
    onResize: function (cb) {
      callbacks.push(cb);
    },

    // Map world coordinates to device pixels, centred on the camera.
    // zoom (default 1) multiplies the world scale.
    worldTransform: function (ctx, camX, camY, zoom) {
      var z = (zoom === undefined || zoom === null) ? 1 : zoom;
      var s = this.scale * z;
      var d = this.dpr * s;
      ctx.setTransform(
        d, 0, 0, d,
        this.dpr * (this.cssW / 2 - camX * s),
        this.dpr * (this.cssH / 2 - camY * s)
      );
    },

    // World-space width/height visible at the given zoom (default 1).
    visibleW: function (zoom) {
      var z = (zoom === undefined || zoom === null) ? 1 : zoom;
      return this.w / z;
    },

    visibleH: function (zoom) {
      var z = (zoom === undefined || zoom === null) ? 1 : zoom;
      return this.h / z;
    },

    // Map CSS pixels to device pixels (for screen-space drawing).
    screenTransform: function (ctx) {
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var tapCbs = [];
  var pauseCbs = [];
  var unlockBound = false;

  function unlockAudio() {
    try {
      if (ORB.Audio && ORB.Audio.unlock) ORB.Audio.unlock();
    } catch (e) { /* ignore */ }
  }

  function fire(list) {
    for (var i = 0; i < list.length; i++) list[i]();
  }

  ORB.Input = {
    init: function (canvas) {
      if (canvas) {
        canvas.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          fire(tapCbs);
        });
        canvas.addEventListener('touchstart', function (e) {
          e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('touchmove', function (e) {
          e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });
      }

      window.addEventListener('keydown', function (e) {
        unlockAudio();

        var code = e.code;
        var isTap = code === 'Space' || code === 'Enter' ||
                    code === 'ArrowUp' || code === 'KeyW';
        var isPause = code === 'Escape' || code === 'KeyP';

        if (isTap) {
          if (e.repeat) return;
          var active = document.activeElement;
          // Let focused buttons handle Enter/Space natively.
          if (active && active.tagName === 'BUTTON') return;
          if (code === 'Space' || code === 'ArrowUp') e.preventDefault();
          fire(tapCbs);
        } else if (isPause) {
          if (e.repeat) return;
          fire(pauseCbs);
        }
      });

      // Any user gesture unlocks audio.
      if (!unlockBound) {
        unlockBound = true;
        document.addEventListener('pointerdown', unlockAudio, true);
      }
    },

    onTap: function (cb) {
      if (typeof cb === 'function') tapCbs.push(cb);
    },

    onPause: function (cb) {
      if (typeof cb === 'function') pauseCbs.push(cb);
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var ctx = null;      // AudioContext, created lazily
  var master = null;   // master gain (~0.35) -> compressor -> destination
  var noiseBuf = null; // 1 s of white noise, reused for whooshes and crashes
  var muted = null;    // read from storage on first isMuted() call
  var lastAt = {};     // last start time per sound name (anti-stacking)

  // Create the AudioContext on first use. Returns null if WebAudio is missing.
  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      var c = new AC();
      var m = c.createGain();
      m.gain.value = 0.35;
      // Gentle limiter so stacked sounds never clip.
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 10;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      m.connect(comp);
      comp.connect(c.destination);
      var buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      ctx = c;
      master = m;
      noiseBuf = buf;
    } catch (e) {
      ctx = null;
    }
    return ctx;
  }

  function resumeIfSuspended() {
    if (ctx && ctx.state === 'suspended') {
      var p = ctx.resume();
      if (p && p.catch) p.catch(function () {});
    }
  }

  // Oscillator voice with a pitch curve and a quick exponential envelope.
  // pts = [[offsetSeconds, freq], ...]; the first point is the start frequency.
  // wob (optional) = {rate, depth}: a vibrato/wobble LFO that fades out with the note.
  // out (optional) = destination node, default master.
  function voice(type, pts, t, dur, vol, wob, out) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(pts[0][1], t);
    for (var i = 1; i < pts.length; i++) {
      o.frequency.exponentialRampToValueAtTime(pts[i][1], t + pts[i][0]);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(out || master);
    o.start(t);
    o.stop(t + dur + 0.02);
    if (wob) {
      var l = ctx.createOscillator();
      var lg = ctx.createGain();
      l.frequency.value = wob.rate;
      lg.gain.setValueAtTime(wob.depth, t);
      lg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      l.connect(lg);
      lg.connect(o.frequency);
      l.start(t);
      l.stop(t + dur + 0.02);
    }
  }

  function tone(type, f0, f1, t, dur, vol) {
    var pts = (f1 && f1 !== f0) ? [[0, f0], [dur, f1]] : [[0, f0]];
    voice(type, pts, t, dur, vol);
  }

  function noise(t, dur, vol, filterType, f0, f1, q) {
    var s = ctx.createBufferSource();
    var flt = ctx.createBiquadFilter();
    var g = ctx.createGain();
    s.buffer = noiseBuf;
    flt.type = filterType;
    flt.frequency.setValueAtTime(f0, t);
    if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
    if (q) flt.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    flt.connect(g);
    g.connect(master);
    s.start(t);
    s.stop(t + dur + 0.02);

    },

    achievement: function (t) {

      }

      tone('triangle', 1318, null, t + 0.36, 0.8, 0.1);

(function () {

  var ORB = window.ORB = window.ORB || {};

  // plus a sparse A minor pentatonic arpeggio routed through a feedback delay.
  // Everything is scheduled ahead on the AudioContext clock by a lookahead timer.

  var BUS_LEVEL = 0.18;     // music bus gain: keeps the score under the sound effects
  var TICK_MS = 100;        // scheduler interval
  var LOOKAHEAD = 0.2;      // seconds of arpeggio notes scheduled ahead of currentTime
  var CHORD_HOLD = 14;      // seconds per chord (randomised +-15%)
  var PAD_DETUNE = [-6, 0, 6];  // cents, one oscillator per chord tone
  var PAD_VOICE_GAIN = 0.1;

  // Chords as semitone offsets from A2 (110 Hz).
  var CHORDS = [[0, 3, 7], [5, 9, 12], [-2, 2, 5], [-5, -2, 2]];
  var PENT = [0, 3, 5, 7, 10];       // A minor pentatonic degrees
  var ARP_NOTES = [];                // frequencies, A3 .. G5
  var STEP_MOVES = [-2, -1, -1, 1, 1, 2];

  for (var k = 0; k < 10; k++) {
    ARP_NOTES.push(midiFreq(12 + ((k / 5) | 0) * 12 + PENT[k % 5]));

  var graph = false;       // true once the node graph is built
  var bus = null;          // music bus gain -> destination
  var padFilter = null;
  var padLevel = null;
  var padVoices = [];      // oscillators, one per chord tone
  var arpFilter = null;
  var delayOut = null;

  var timer = null;
  var running = false;     // start() called and stop() not yet called
  var musicMuted = false;  // setMuted(true)
  var intensity = 0;       // smoothed 0..1
  var intensityTarget = 0;
  var chordIdx = 0;
  var nextChordTime = 0;
  var nextArpTime = 0;
  var arpIdx = 4;
  var lastBusTarget = -1;
  var lastParamI = -1;

      return !!(ORB.Audio && ORB.Audio.isMuted && ORB.Audio.isMuted());

    padFilter.frequency.value = 420;
    padFilter.Q.value = 0.7;
    padLevel = c.createGain();

    padLevel.connect(bus);

    delay.connect(dLp);
    dLp.connect(fb);
    fb.connect(delay);
    dLp.connect(delayOut);

  function refreshBus() {

  function applyParams(force) {

    var t = ctx.currentTime;
    padFilter.frequency.setTargetAtTime(380 + 600 * intensity, t, 0.8);

  function scheduleStep(t) {

      arpIdx = (Math.random() * ARP_NOTES.length) | 0;
    } else {

      if (arpIdx < 0) arpIdx = 0;
      if (arpIdx >= ARP_NOTES.length) arpIdx = ARP_NOTES.length - 1;
    }
    if (Math.random() < p) {

    }

  function stepLen() {

  function tick() {

        nextArpTime = now + 0.1;
        return;
      }

      var horizon = now + LOOKAHEAD;
      while (nextArpTime < horizon) {
        scheduleStep(nextArpTime);
        nextArpTime += stepLen();
      }

  }

    // Start the score (call from a user gesture, e.g. Play / first tap). Safe to repeat.
    start: function () {

      try {

        nextChordTime = now + CHORD_HOLD;
        nextArpTime = now + 1.5;
        lastParamI = -1;
        if (!timer) timer = setInterval(tick, TICK_MS);
        refreshBus();
        tick();

    },

    stop: function () {

        timer = null;
      }
      try { refreshBus(); } catch (e) { /* ignore */ }
    },

    // Target intensity 0..1 (e.g. max(danger, combo/5)); the change is smoothed.
    setIntensity: function (v) {
      v = +v;
      if (!(v >= 0)) v = 0;
      if (v > 1) v = 1;
      intensityTarget = v;
    },

    // Music-only mute. The sound toggle (ORB.Audio.isMuted) also silences the score.
    setMuted: function (b) {
      musicMuted = !!b;
      try { refreshBus(); } catch (e) { /* ignore */ }
    },

      return running;
    }
  };
})();

  var slowOn = false;       // a slowmo is active
  var slowFactor = 1;       // factor of the active slowmo
  var slowDur = 0;          // total duration of the active slowmo (real seconds)

  function num(v, def) {
    return (typeof v === 'number' && v === v) ? v : def;   // v === v rejects NaN

    return slowFactor + (1 - slowFactor) * u;

    reset: function () {

    reset: function (x, y) {

      this.y = y;

      var kX = Math.min(1, C.CAMERA_LERP * 0.5 * dt);
      var kZ = Math.min(1, 2 * dt);
      this.x += (targetX - this.x) * kX;
      this.y += (targetY - this.y) * kY;
      this.zoom += (targetZoom - this.zoom) * kZ;

      var a = G * m * f / denom;
      gAx += dx / d * a;

  // Substep count: configured minimum, more for long frames (stability).
  function stepsFor(dt) {
    var n = Math.round(cfg('PHYS_SUBSTEPS')) || 4;
    var need = Math.ceil(dt / 0.012);

    // Gravity acceleration at a point. The returned object is reused: read it
    // immediately, don't keep a reference across calls.
    gravity: function (x, y, planets, ignore) {
      accumulate(x, y, planets, ignore || null, cfg('GRAVITY'));
      gravResult.ax = gAx;
      gravResult.ay = gAy;
      gravResult.strongest = gBest;
      gravResult.strength = gBestA;

    },

    // Free flight under gravity: semi-implicit Euler, speed-capped.
    stepFree: function (p, dt, planets, ignore) {
      if (!(dt > 0)) return;
      var n = stepsFor(dt), h = dt / n;
      var G = cfg('GRAVITY'), maxV = cfg('MAX_SPEED'), maxV2 = maxV * maxV;

      ignore = ignore || null;

        vy += gAy * h;

    // Elastic tether orbit, integrated in the planet's moving frame.
    stepTether: function (p, dt, planet) {
      if (!planet || !(dt > 0)) return;
      var n = stepsFor(dt), h = dt / n;
      var K = cfg('TETHER_K') * (planet.tetherK === undefined ? 1 : planet.tetherK);
      var damp = cfg('TETHER_DAMP'), tang = cfg('TETHER_TANGENT');
      var maxV = cfg('MAX_SPEED');
      var R = planet.orbitRadius;
      var vT = (planet.angularSpeed || 0) * R;
      var dir = p.dir < 0 ? -1 : 1;
      var pvx = planet.vx || 0, pvy = planet.vy || 0;

      var rx = p.x - (planet.x - pvx * dt);
      var ry = p.y - (planet.y - pvy * dt);
      var rvx = p.vx - pvx, rvy = p.vy - pvy;
      var d = 0;

      for (var i = 0; i < n; i++) {
        d = Math.sqrt(rx * rx + ry * ry);
        var nx, ny;
        if (d < 1e-3) { nx = 0; ny = 1; d = 1e-3; } else { nx = rx / d; ny = ry / d; }
        var tx = -ny * dir, ty = nx * dir;
        var vr = rvx * nx + rvy * ny;
        var vt = rvx * tx + rvy * ty;
        var ext = d - R;
        if (ext < -R) ext = -R; else if (ext > 2 * R) ext = 2 * R; // keep stiff spring tame
        var dc = d > 0.3 * R ? d : 0.3 * R;
        var ar = -K * ext - damp * vr - vt * vt / dc; // radial (along n)
        var at = tang * (vT - vt);                    // tangential (along t)
        rvx += (ar * nx + at * tx) * h;
        rvy += (ar * ny + at * ty) * h;
        var s2 = rvx * rvx + rvy * rvy;
        if (s2 > maxV * maxV) {
          var k = maxV / Math.sqrt(s2);
          rvx *= k; rvy *= k;
        }
        rx += rvx * h;
        ry += rvy * h;
      }

      d = Math.sqrt(rx * rx + ry * ry);
      p.x = planet.x + rx;
      p.y = planet.y + ry;
      p.vx = rvx + pvx;
      p.vy = rvy + pvy;
      p.angle = Math.atan2(ry, rx);
      p.stretch = R > 0 ? (d - R) / R : 0;
      p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    },

    // Velocity after a tap: current velocity + boost along the tangent.
    launchVelocity: function (p) {
      var vx = p.vx || 0, vy = p.vy || 0;
      var tx = 0, ty = 0, have = false;
      var pl = p.planet;
      if (pl) {
        var rx = p.x - pl.x, ry = p.y - pl.y;
        var d = Math.sqrt(rx * rx + ry * ry);
        if (d > 1e-3) {
          var dir = p.dir < 0 ? -1 : 1;
          tx = -ry / d * dir; ty = rx / d * dir; have = true;
        }
      }
      if (!have) { // no planet: boost along the current heading
        var s = Math.sqrt(vx * vx + vy * vy);
        if (s > 1e-3) { tx = vx / s; ty = vy / s; } else { tx = 0; ty = -1; }
      }
      var boost = cfg('LAUNCH_BOOST');
      vx += tx * boost;
      vy += ty * boost;
      var sp = Math.sqrt(vx * vx + vy * vy);
      var minS = cfg('LAUNCH_MIN_SPEED'), maxS = cfg('MAX_SPEED');
      if (sp < 1e-6) { vx = tx * minS; vy = ty * minS; }
      else if (sp < minS) { vx *= minS / sp; vy *= minS / sp; }
      else if (sp > maxS) { vx *= maxS / sp; vy *= maxS / sp; }
      return { vx: vx, vy: vy };
    },

    // Simulate free flight from a launch. `ignore` can't be latched during the
    // first IGNORE_FROM_TIME seconds (same rule as the game). Gravity from all
    // planets acts, like stepFree(…, null). Returns one shared result object:
    // { points: [{x,y}], hit: Planet|null } valid until the next call.
    predict: function (x, y, vx, vy, planets, ignore, maxTime, step) {
      if (!(maxTime > 0)) maxTime = 1.3;
      if (!(step > 0)) step = 1 / 30;
      var G = cfg('GRAVITY'), maxV = cfg('MAX_SPEED');
      var killF = cfg('BLACKHOLE_KILL_FACTOR'), ignT = cfg('IGNORE_FROM_TIME');
      var sub = Math.max(1, Math.round(step / (1 / 240))); // ~ same h as stepFree at 60 fps
      var h = step / sub;
      var pts = predResult.points;
      var count = 0;
      var hit = null;
      var t = 0;
      var nPl = planets ? planets.length : 0;

      count = push(pts, count, x, y);
      var steps = Math.ceil(maxTime / step - 1e-9);
      outer:
      for (var s = 0; s < steps; s++) {

          accumulate(x, y, planets, null, G);
          vx += gAx * h;
          vy += gAy * h;
          var s2 = vx * vx + vy * vy;
          if (s2 > maxV * maxV) {
            var k = maxV / Math.sqrt(s2);
            vx *= k; vy *= k;
          }
          x += vx * h;
          y += vy * h;
          t += h;

            var pl = planets[i];
            if (pl.dead) continue;
            var dx = x - pl.x, dy = y - pl.y;
            if (pl.type === 'blackhole') {
              var kr = (pl.radius || 10) * killF;
              if (dx * dx + dy * dy < kr * kr) { count = push(pts, count, x, y); break outer; }
              continue;
            }
            if (pl === ignore && t < ignT) continue;
            var lr = pl.latchRadius || ((pl.orbitRadius || 40) + 22);
            if (dx * dx + dy * dy < lr * lr) {
              hit = pl;
              count = push(pts, count, x, y);
              break outer;
            }
          }
        }
        count = push(pts, count, x, y);
      }
      pts.length = count;
      predResult.hit = hit;
      return predResult;
    }
  };

  // Store a point using a pooled object; returns the new count.
  function push(pts, count, x, y) {
    var o = predPool[count];
    if (!o) { o = predPool[count] = { x: 0, y: 0 }; }
    o.x = x; o.y = y;
    pts[count] = o;
    return count + 1;
  }
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var sinceBlackhole = 3;
  var TWO_PI = Math.PI * 2;

  // Type table: radius multiplier, gravity mass, orbit speed multiplier, tether stiffness.
  var TYPES = {
    rocky:   { rMul: 1.0,  mass: 1.0, spd: 1.0,  tetherK: 1.0 },
    ice:     { rMul: 0.9,  mass: 0.8, spd: 1.35, tetherK: 1.0 },
    gas:     { rMul: 1.25, mass: 1.7, spd: 0.8,  tetherK: 1.0 },
    lava:    { rMul: 1.0,  mass: 1.1, spd: 1.05, tetherK: 1.0 },
    jelly:   { rMul: 1.0,  mass: 1.0, spd: 1.0,  tetherK: 0.5 },
    star:    { rMul: 1.15, mass: 1.4, spd: 1.0,  tetherK: 1.0 },
    crumble: { rMul: 0.85, mass: 0.9, spd: 1.0,  tetherK: 1.0 }

  var TYPE_ORDER = ['rocky', 'ice', 'gas', 'lava', 'jelly', 'star', 'crumble'];
  var weightScratch = [0, 0, 0, 0, 0, 0, 0];
  var eaten = []; // reused result of consume()

  // CONFIG value read at call time with a fallback.
  function cfg(key, fallback) {
    var C = ORB.CONFIG;
    var v = C ? C[key] : undefined;
    return typeof v === 'number' && isFinite(v) ? v : fallback;
  }

  function num(v, fallback) {
    return typeof v === 'number' && isFinite(v) ? v : fallback;
  }

  function rand(a, b) {
    return a + Math.random() * (b - a);
  }

  function randSign() {
    return Math.random() < 0.5 ? -1 : 1;
  }

  // latchRadius for a given orbit radius.
  function latchFor(or) {
    return or + Math.max(cfg('LATCH_PAD_MIN', 22), or * cfg('LATCH_PAD_FACTOR', 0.55));
  }

  // Blank planet with every Planet field initialised.
  function newPlanet(type, x, y, radius) {
    nextId++;
    var T = TYPES[type];
    var or = radius + cfg('ORBIT_GAP', 26);
    return {
      id: nextId,
      type: type,
      x: x,
      y: y,
      baseX: x,
      vx: 0,
      vy: 0,
      radius: radius,
      orbitRadius: or,
      latchRadius: latchFor(or),
      gravityRadius: or * cfg('GRAVITY_RADIUS_FACTOR', 2.8),
      mass: T ? T.mass : 1,
      tetherK: T ? T.tetherK : 1,
      hue: 0,
      angularSpeed: 0,
      spin: randSign() * rand(0.15, 0.5),
      rot: rand(0, TWO_PI),
      moveAmp: 0,
      moveSpeed: 0,
      movePhase: 0,
      visited: false,
      ringed: false,
      ringTilt: rand(0.25, 0.45),
      moons: [],
      wobble: 0,
      wobbleV: 0,
      wobbleAngle: 0,
      ripple: 0,
      ripplePhase: 0,
      seed: Math.floor(Math.random() * 1e9),
      heat: 0,
      crumble: -1,
      dead: false,
      deadT: 0,
      age: 0
    };
  }

  function hueFor(type) {
    switch (type) {
      case 'ice': return rand(175, 215);
      case 'lava': return rand(0, 28);
      case 'jelly': return rand(270, 340);
      case 'star': return rand(38, 55);
      case 'crumble': return rand(20, 40);
      default: return rand(0, 360);
    }
  }

  function addMoons(p, count) {
    for (var i = 0; i < count; i++) {
      p.moons.push({
        dist: p.radius + rand(10, 22),
        angle: rand(0, TWO_PI),
        speed: randSign() * rand(0.6, 1.6),
        r: rand(2, 4.5),
        hue: rand(0, 360)
      });
    }
  }

  function moonCount(type) {
    switch (type) {
      case 'rocky': return Math.floor(rand(0, 3));
      case 'gas': return Math.floor(rand(0, 4));
      case 'ice':
      case 'lava': return Math.random() < 0.25 ? 1 : 0;
      default: return 0;
    }
  }

  function ringChance(type) {
    if (type === 'gas') return 0.7;
    if (type === 'ice') return 0.15;
    if (type === 'rocky') return 0.1;
    return 0;
  }

  // Weighted type pick; never two star or two crumble in a row.
  function pickType(prevType, weights) {
    var total = 0;
    var i;
    for (i = 0; i < TYPE_ORDER.length; i++) {
      var k = TYPE_ORDER[i];
      var w = weights ? weights[k] : (k === 'rocky' ? 1 : 0);
      w = num(w, 0);
      if (w < 0) w = 0;
      if ((k === 'star' || k === 'crumble') && k === prevType) w = 0;
      weightScratch[i] = w;
      total += w;
    }
    if (!(total > 0)) return 'rocky';
    var r = Math.random() * total;
    for (i = 0; i < TYPE_ORDER.length; i++) {
      r -= weightScratch[i];
      if (r < 0 && weightScratch[i] > 0) return TYPE_ORDER[i];
    }
    return 'rocky';
  }

  // Try to build a chain planet above prev. Returns null when no legal x exists
  // (unless `forced`, which uses the safest parameters and always returns a planet).
  function tryPlace(prev, type, diff, forced) {
    var W = cfg('WORLD_W', 420);
    var gapMin = num(diff.gapMin, 150);
    var gapMax = Math.max(gapMin, num(diff.gapMax, gapMin + 70));
    var radMin = num(diff.radiusMin, 18);
    var radMax = Math.max(radMin, num(diff.radiusMax, 34));
    var T = TYPES[type];

    var dy = forced ? gapMax : rand(gapMin, gapMax);
    var radius = (forced ? radMin : rand(radMin, radMax)) * T.rMul;
    var p = newPlanet(type, 0, prev.y - dy, radius);
    var or = p.orbitRadius;

    // Horizontal motion amplitude, kept inside the world.
    var minX = or + 12;
    var maxX = Math.max(minX, W - or - 12);
    var amp = 0;
    if (!forced && Math.random() < num(diff.moveChance, 0)) {
      amp = rand(num(diff.moveAmpMin, 25), Math.max(num(diff.moveAmpMin, 25), num(diff.moveAmpMax, 60)));
      amp = Math.min(amp, (maxX - minX) / 2);
      if (amp < 8) amp = 0;
    }
    if (forced && prev.moveAmp > 0) {
      prev.moveAmp = 0;
      prev.x = prev.baseX;
    }
    var lo = minX + amp;
    var hi = maxX - amp;

    // Latch zones must not overlap even at the closest point of both motions.
    var need = prev.latchRadius + p.latchRadius + 20;
    var dxFlat = need > dy ? Math.sqrt(need * need - dy * dy) : 0;
    var dxMin = Math.max(40, dxFlat) + prev.moveAmp + amp;
    var pbx = prev.baseX;

    var lenL = (pbx - dxMin) - lo;
    var lenR = hi - (pbx + dxMin);
    var x;
    if (lenL < 0 && lenR < 0) {
      if (!forced) return null;
      x = pbx < W / 2 ? hi : lo; // absurd parameters: best effort
    } else if (lenL >= 0 && (lenR < 0 || Math.random() < lenL / (lenL + lenR))) {
      x = lo + Math.random() * lenL;
    } else {

    }

    p.baseX = x;
    p.x = x;
    if (amp > 0) {
      p.moveAmp = amp;
      p.moveSpeed = rand(0.6, 1.4);
      p.movePhase = rand(0, TWO_PI);
      p.x = x + Math.sin(p.movePhase) * amp;
    }

    p.angularSpeed = num(diff.angularSpeed, 1.7) * rand(0.9, 1.1) * T.spd;

  function distToExtent(q, x, y) {

    var hi = q.baseX + q.moveAmp;
    var dx = x < lo ? lo - x : (x > hi ? x - hi : 0);
    var dy = y - q.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Build a blackhole in the gap between prev and next, or null if there is no room.
  function tryBlackhole(prev, next) {
    var W = cfg('WORLD_W', 420);
    var loE = Math.min(prev.baseX - prev.moveAmp, next.baseX - next.moveAmp);
    var hiE = Math.max(prev.baseX + prev.moveAmp, next.baseX + next.moveAmp);
    var leftRoom = (loE - 90) - 50;
    var rightRoom = (W - 50) - (hiE + 90);
    if (leftRoom < 0 && rightRoom < 0) return null;
    var useLeft = leftRoom > rightRoom; // side with more room
    var radius = rand(14, 18);
    for (var i = 0; i < 6; i++) {
      var x = useLeft ? 50 + Math.random() * leftRoom : hiE + 90 + Math.random() * rightRoom;
      var y = next.y + (prev.y - next.y) * rand(0.35, 0.65);
      if (distToExtent(prev, x, y) < prev.latchRadius + radius + 12) continue;
      if (distToExtent(next, x, y) < next.latchRadius + radius + 12) continue;
      var b = newPlanet('blackhole', x, y, radius);
      b.orbitRadius = radius;
      b.latchRadius = 0;
      b.gravityRadius = 230;
      b.mass = 1.2; // strong enough to slingshot, weak enough to survive a ~45 px pass
      b.tetherK = 0;
      b.angularSpeed = 0;
      b.spin = randSign() * rand(0.4, 0.9);
      b.hue = rand(260, 300);

    }

  }

  ORB.Planets = {
    list: [],

    // Clears the list and creates the first (static, visited) planet.
    reset: function () {

      sinceBlackhole = 3;
      this.list = [];
      var p = newPlanet('rocky', cfg('WORLD_W', 420) / 2, 0, 30);
      p.hue = rand(0, 360);
      p.angularSpeed = 1.7;
      p.visited = true;
      addMoons(p, 1);
      this.list.push(p);
    },

    // Creates planets above the highest one until it reaches topY.
    // Returns the array of newly created planets (blackholes included, in y order).
    ensure: function (topY, diff) {

        if (!p) p = tryPlace(prev, type, diff, true);

        if (sinceBlackhole >= 3 && Math.random() < num(diff.blackholeChance, 0)) {

            created.push(b);
            sinceBlackhole = 0;

        sinceBlackhole++;

        this.list.push(p);
        created.push(p);
      }
      return created;
    },

    // Advances motion, rotation, moons, wobble springs, ripples and crumbling.
    update: function (dt) {
      if (!(dt > 0)) return;
      var sdt = Math.min(dt, 0.05); // keeps the wobble spring stable

        }

        if (p.moveAmp > 0) {

    },

    impact: function (p, strength, angle) {

      var s = Math.max(0, Math.min(1, num(strength, 0)));

    },

    findLatch: function (x, y, ignore) {
      var list = this.list;
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        if (p === ignore || p.dead || p.type === 'blackhole') continue;

      }
      return null;
    },

    // Blackhole whose kill radius contains (x, y), or null.
    blackholeKill: function (x, y) {
      var f = cfg('BLACKHOLE_KILL_FACTOR', 1.4);
      var list = this.list;
      for (var i = 0; i < list.length; i++) {

        if (p.type !== 'blackhole' || p.dead) continue;

      }
      return null;
    },

    // Removes planets far below bottomY and long-dead ones (in place).
    prune: function (bottomY) {
      var list = this.list;
      var keep = 0;
      for (var i = 0; i < list.length; i++) {

      }
      list.length = keep;
    },

    // Last created non-blackhole planet (top of the chain).
    highest: function () {
      var list = this.list;
      for (var i = list.length - 1; i >= 0; i--) {
        if (list[i].type !== 'blackhole') return list[i];
      }
      return undefined;
    },

    // Marks planets swallowed by the void as dead. Returns a reused array of the newly eaten.
    consume: function (voidY) {
      eaten.length = 0;
      var list = this.list;
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        if (!p.dead && p.y - p.radius > voidY) {
          p.dead = true;
          p.deadT = 0;
          eaten.push(p);
        }
      }
      return eaten;
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var POOL = 56;          // fixed ember pool size (no per-frame allocation)
  var MAX_PTS = 256;      // capacity of the reused surface buffers
  var TENDRILS = 11;      // dark tendrils reaching up from the surface
  var EMBER_RATE = 18;    // embers spawned per second

  // Wave layers drawn back to front (the main body is handled separately).
  var HAZE = [
    { base: -34, amp: 20, fx: 0.8, ph: 2.1, fill: 'rgba(90,0,110,0.26)' },
    { base: -14, amp: 16, fx: 1.2, ph: 4.0, fill: 'rgba(55,0,75,0.5)' }
  ];
  var MAIN = { base: 0, amp: 14, fx: 1, ph: 0 };

  var ember = null;       // pool of ember objects, life <= 0 means free
  var layerY = null;      // reused Float32Arrays for surface heights
  var cursor = 0;         // ember pool search start
  var spawnAcc = 0;       // fractional ember spawn counter
  var lastT = null;       // last draw time, for ember stepping

  function rnd(a, b) {
    return a + Math.random() * (b - a);
  }

  function ensure() {
    if (ember) return;
    ember = [];
    for (var i = 0; i < POOL; i++) {
      ember.push({ x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 0, size: 1, ph: 0, hot: true });
    }
    layerY = [];
    for (var k = 0; k < HAZE.length + 1; k++) layerY.push(new Float32Array(MAX_PTS));
  }

  // Surface height of one wave layer at world x (y down; smaller = higher).
  function wave(x, t, L) {
    return ORB.Void.y + L.base + L.amp * (
      Math.sin(x * 0.011 * L.fx + t * 0.9 + L.ph) +
      0.5 * Math.sin(x * 0.027 * L.fx - t * 1.7 + L.ph * 1.3) +
      0.25 * Math.sin(x * 0.061 * L.fx + t * 2.9 + L.ph * 0.7));
  }

  // Fill the sampled wave down to `bottom` as one path.
  function fillWave(ctx, ys, n, x0, step, bottom, style) {
    ctx.beginPath();
    ctx.moveTo(x0, ys[0]);
    for (var i = 1; i < n; i++) ctx.lineTo(x0 + i * step, ys[i]);
    ctx.lineTo(x0 + (n - 1) * step, bottom);
    ctx.lineTo(x0, bottom);
    ctx.closePath();
    ctx.fillStyle = style;
    ctx.fill();
  }

  // Trace the open wave line only (used for strokes).
  function traceWave(ctx, ys, n, x0, step) {
    ctx.beginPath();
    ctx.moveTo(x0, ys[0]);
    for (var i = 1; i < n; i++) ctx.lineTo(x0 + i * step, ys[i]);
  }

  function computeWave(ys, n, x0, step, t, L) {
    for (var i = 0; i < n; i++) ys[i] = wave(x0 + i * step, t, L);
  }

  // Dark tendrils rising above the surface; all in one path.
  function drawTendrils(ctx, t, camX, viewW) {
    ctx.beginPath();
    for (var i = 0; i < TENDRILS; i++) {
      var xc = camX + ((i + 0.5) / TENDRILS - 0.5) * viewW * 0.9 +
        Math.sin(t * 0.3 + i * 1.9) * viewW * 0.04;
      var sy = wave(xc, t, MAIN);
      var surge = Math.max(0, Math.sin(t * 0.55 + i * 0.9)); // slow lunge: tendrils reach up in turns
      var h = 26 + 56 * (0.5 + 0.5 * Math.sin(t * (0.6 + 0.11 * i) + i * 2.3)) + 70 * surge * surge;
      var w = 5 + (i % 3) * 3;
      var sway = Math.sin(t * 1.1 + i * 2.3) * 14;
      var by = sy + 10; // base hidden under the body
      ctx.moveTo(xc - w, by);
      ctx.quadraticCurveTo(xc - w * 0.5 + sway * 0.3, sy - h * 0.6, xc + sway, sy - h);
      ctx.quadraticCurveTo(xc + w * 0.5 + sway * 0.3, sy - h * 0.6, xc + w, by);
      ctx.closePath();
    }
    ctx.fillStyle = 'rgba(18,0,28,0.92)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(190,40,160,0.45)';
    ctx.stroke();
    // glowing claw tips
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    for (i = 0; i < TENDRILS; i++) {
      var xt = camX + ((i + 0.5) / TENDRILS - 0.5) * viewW * 0.9 +
        Math.sin(t * 0.3 + i * 1.9) * viewW * 0.04;
      var st = wave(xt, t, MAIN);
      var ht = 26 + 56 * (0.5 + 0.5 * Math.sin(t * (0.6 + 0.11 * i) + i * 2.3)) +
        70 * Math.pow(Math.max(0, Math.sin(t * 0.55 + i * 0.9)), 2);
      var tx = xt + Math.sin(t * 1.1 + i * 2.3) * 14, ty = st - ht;
      ctx.moveTo(tx + 5, ty);
      ctx.arc(tx, ty, 5, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(255,50,120,0.28)';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Slit eyes blinking open deep in the darkness.
  function drawEyes(ctx, t, camX, viewW, surfY) {
    for (var i = 0; i < 4; i++) {
      var ph = t * 0.35 + i * 1.7;
      var open = Math.sin(ph) * Math.sin(ph * 0.43 + i);   // irregular blink
      if (open < 0.25) continue;
      var a = Math.min(1, (open - 0.25) * 3);
      var ex = camX + (((i * 0.37 + Math.floor(ph / 6.283) * 0.23) % 1) - 0.5) * viewW * 0.85;
      var ey = surfY + 70 + i * 55 + Math.sin(t * 0.5 + i) * 6;
      for (var s = -1; s <= 1; s += 2) {
        var x = ex + s * (10 + i * 2);
        ctx.fillStyle = 'rgba(255,40,70,' + (0.75 * a).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(x, ey, 7 + i, 2.2 * a + 0.4, s * -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,200,200,' + (0.9 * a).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(x, ey, 3, 0.9 * a + 0.2, s * -0.35, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function spawnEmber(x, t) {
    for (var k = 0; k < POOL; k++) {
      var idx = (cursor + k) % POOL;
      var e = ember[idx];
      if (e.life > 0) continue;
      cursor = (idx + 1) % POOL;
      e.x = x;
      e.y = wave(x, t, MAIN) + rnd(10, 60); // starts inside the darkness
      e.vx = rnd(-12, 12);
      e.vy = -rnd(28, 80);
      e.age = 0;
      e.life = rnd(1.6, 3.6);
      e.size = rnd(1.1, 2.6);
      e.ph = rnd(0, 6.283);
      e.hot = Math.random() < 0.6;
      return;
    }
  }

  // Move embers and spawn new ones inside the visible x range.
  function stepEmbers(dt, t, camX, viewW) {
    for (var i = 0; i < POOL; i++) {
      var e = ember[i];
      if (e.life <= 0) continue;
      e.age += dt;
      if (e.age >= e.life) { e.life = 0; continue; }
      e.x += (e.vx + Math.sin(e.age * 2.6 + e.ph) * 14) * dt;
      e.y += e.vy * dt;
    }
    spawnAcc += dt * EMBER_RATE;
    var guard = 0;
    while (spawnAcc >= 1 && guard++ < 4) {
      spawnAcc -= 1;
      spawnEmber(rnd(camX - viewW / 2, camX + viewW / 2), t);
    }
    if (spawnAcc > 4) spawnAcc = 0;
  }

  // Embers: a halo pass then a core pass, one path per colour group.
  function drawEmbers(ctx, camX, viewW) {
    var xa = camX - viewW / 2, xb = camX + viewW / 2;
    ctx.globalCompositeOperation = 'lighter';
    for (var pass = 0; pass < 2; pass++) {
      for (var g = 0; g < 2; g++) {
        var hot = g === 0;
        ctx.beginPath();
        for (var i = 0; i < POOL; i++) {
          var e = ember[i];
          if (e.life <= 0 || e.hot !== hot || e.x < xa || e.x > xb) continue;
          var f = 1 - e.age / e.life; // shrinks as it fades
          var r = e.size * (0.35 + 0.65 * f) * (pass === 0 ? 2.6 : 1);
          ctx.moveTo(e.x + r, e.y);
          ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        }
        ctx.fillStyle = (hot ? 'rgba(255,90,40,' : 'rgba(180,70,255,') +
          (pass === 0 ? '0.14)' : '0.9)');
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  ORB.Void = {
    y: 0, // world y of the void's surface; it only ever rises (y decreases)

    // Place the surface and clear the embers.
    reset: function (startY) {
      ensure();
      ORB.Void.y = startY;
      for (var i = 0; i < POOL; i++) ember[i].life = 0;
      cursor = 0;
      spawnAcc = 0;
      lastT = null;
    },

    // Rise towards the player; rubber-band 3x faster when far below them.
    update: function (dt, playerY, viewH, diff) {
      if (!(dt > 0)) return;
      var speed = diff && diff.voidSpeed > 0 ? diff.voidSpeed : 16;
      if (ORB.Void.y - playerY > viewH * 0.85) speed *= 3;
      ORB.Void.y -= speed * dt;
    },

    // Distance from the surface to a world y (positive = y is above the void).
    distance: function (y) {
      return ORB.Void.y - y;
    },

    // Draw in world coords. Only the visible x range is traced.
    draw: function (ctx, time, camX, viewW, viewH) {
      if (!(viewW > 0) || !(viewH > 0)) return;
      ensure();
      var t = +time || 0;
      var dt = lastT === null ? 0 : Math.min(0.05, Math.max(0, t - lastT));
      lastT = t;

      var surfY = ORB.Void.y;
      var x0 = camX - viewW / 2 - 40;
      var x1 = camX + viewW / 2 + 40;
      var step = Math.max(6, (x1 - x0) / 96); // about 100 points per layer
      var n = Math.min(MAX_PTS, Math.ceil((x1 - x0) / step) + 1);
      var bottom = surfY + viewH + 40;

      stepEmbers(dt, t, camX, viewW);

      ctx.save();
      // heat-haze glow reaching up from the surface, breathing slowly
      var up = ctx.createLinearGradient(0, surfY - 210, 0, surfY);
      up.addColorStop(0, 'rgba(190,20,110,0)');
      up.addColorStop(1, 'rgba(190,20,110,' + (0.22 + 0.08 * Math.sin(t * 1.6)).toFixed(3) + ')');
      ctx.fillStyle = up;
      ctx.fillRect(x0, surfY - 210, x1 - x0, 230);
      drawTendrils(ctx, t, camX, viewW);

      // Haze layers behind the body.
      for (var L = 0; L < HAZE.length; L++) {
        computeWave(layerY[L], n, x0, step, t, HAZE[L]);
        fillWave(ctx, layerY[L], n, x0, step, bottom, HAZE[L].fill);
      }

      // Main body: deep violet fading to black.
      var ysMain = layerY[HAZE.length];
      computeWave(ysMain, n, x0, step, t, MAIN);
      var bodyGrad = ctx.createLinearGradient(0, surfY - 30, 0, bottom);
      bodyGrad.addColorStop(0, '#3d0050');
      bodyGrad.addColorStop(0.2, '#16002a');
      bodyGrad.addColorStop(1, '#020005');
      fillWave(ctx, ysMain, n, x0, step, bottom, bodyGrad);

      // Glowing red-to-violet edge: wide faint halo, then a crisp line.
      var edge = ctx.createLinearGradient(x0, 0, x1, 0);
      edge.addColorStop(0, '#ff2d55');
      edge.addColorStop(0.5, '#b8189f');
      edge.addColorStop(1, '#6a1bff');
      traceWave(ctx, ysMain, n, x0, step);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = edge;
      ctx.globalAlpha = 0.18 + 0.08 * Math.sin(t * 3);
      ctx.lineWidth = 16;
      ctx.stroke();
      ctx.globalAlpha = 0.5 + 0.2 * Math.sin(t * 2.1);
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = 2;
      ctx.stroke();

      drawEyes(ctx, t, camX, viewW, surfY);
      drawEmbers(ctx, camX, viewW);
      ctx.restore();
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var STAR_R = 9;
  var MAGNET_SPEED = 420;
  var ARC_BULGE = 40;     // max sideways bulge of the arc between a and b (px)
  var BOB_AMP = 3;        // vertical bob amplitude (px)
  var BOB_SPEED = 3;      // bob phase speed (rad/s)
  var BLACKHOLE_KILL_FACTOR = 1.4;

  // latch zone of a planet: latchRadius, fallback orbitRadius + 30
  function latchZone(p) {
    if (typeof p.latchRadius === 'number') return p.latchRadius;
    return (p.orbitRadius || 0) + 30;
  }

  // true if a circle at (x, y) with radius r touches any planet's latch zone
  // (blackholes have no latch, so their kill zone is avoided instead)
  function insideLatch(x, y, r) {
    var list = (ORB.Planets && ORB.Planets.list) || [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var zone = latchZone(p);
      if (p.type === 'blackhole') {
        var kill = (p.radius || 0) * BLACKHOLE_KILL_FACTOR;
        if (kill > zone) zone = kill;
      }
      // distance to the planet's whole horizontal motion range (moving planets)
      var amp = p.moveAmp || 0, bx = amp > 0 && typeof p.baseX === 'number' ? p.baseX : p.x;
      var dx = Math.max(0, Math.abs(x - bx) - amp);
      if (Math.sqrt(dx * dx + (y - p.y) * (y - p.y)) < zone + r) return true;
    }
    return false;
  }

  ORB.Stars = {
    list: [],

    reset: function () {
      ORB.Stars.list = [];
    },

    // place 1-3 stars along a curved (quadratic) arc between planets a and b
    spawnBetween: function (a, b, diff) {
      var M = ORB.M;
      if (!a || !b) return;
      if (a.type === 'blackhole' || b.type === 'blackhole') return;
      if (!M.chance(diff.starChance)) return;

      var count = M.randInt(1, 3);
      // one bulge per arc: stars share the same curve
      var bulge = M.rand(-ARC_BULGE, ARC_BULGE);
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len;   // unit normal of the segment
      var ny = dx / len;

      for (var i = 0; i < count; i++) {
        // a few tries to find a spot outside every latch zone
        for (var tries = 0; tries < 8; tries++) {
          var t = M.rand(0.3, 0.7);
          // quadratic bezier with control offset 2*bulge: peak offset = bulge at t = 0.5
          var off = 4 * t * (1 - t) * bulge;
          var x = M.lerp(a.x, b.x, t) + nx * off;
          var y = M.lerp(a.y, b.y, t) + ny * off;
          if (!insideLatch(x, y, STAR_R)) {
            ORB.Stars.list.push({
              x: x, y: y,
              baseX: x, baseY: y,
              r: STAR_R,
              phase: M.rand(0, Math.PI * 2),
              collected: false
            });
            break;
          }
        }
      }
    },

    // animate (bob), magnet pull (moves the base), collect; returns number collected this frame
    update: function (dt, player) {
      var M = ORB.M;
      var C = ORB.CONFIG;
      var list = ORB.Stars.list;
      var magnet = player.magnetTime > 0;
      var collected = 0;

      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        s.phase += dt * BOB_SPEED;

        if (magnet) {
          var d = M.dist(s.x, s.y, player.x, player.y);
          if (d < C.MAGNET_RADIUS && d > 0) {
            var step = Math.min(d, MAGNET_SPEED * dt);
            s.baseX += (player.x - s.x) / d * step;
            s.baseY += (player.y - s.y) / d * step;
          }
        }

        // displayed position = base + bob
        s.x = s.baseX;
        s.y = s.baseY + Math.sin(s.phase) * BOB_AMP;

        if (M.circleHit(player.x, player.y, C.PLAYER_RADIUS, s.x, s.y, s.r)) {
          s.collected = true;
        }
      }

      // remove collected stars in place
      for (var j = list.length - 1; j >= 0; j--) {
        if (list[j].collected) {
          list.splice(j, 1);
          collected++;
        }
      }
      return collected;
    },

    // remove stars below the visible/bottom limit
    prune: function (bottomY) {
      var list = ORB.Stars.list;
      for (var i = list.length - 1; i >= 0; i--) {
        if (list[i].y > bottomY) list.splice(i, 1);
      }
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var MAX_ALIVE = 6;
  var GRAVITY_SCALE = 0.35;    // asteroids feel 35% of planet gravity
  var NEAR_MISS_PAD = 22;      // near-miss band beyond r
  var lastViewW = 0; // visible world width from the latest maybeSpawn
  var nearArr = [];  // reused return array for nearMiss

  var A = {
    list: [],

    reset: function () {
      A.list = [];
      nearArr.length = 0;
      lastViewW = 0;
    },

    // Spawn one asteroid just outside the left or right edge of the view.
    maybeSpawn: function (dt, camY, viewW, viewH, diff) {
      var C = ORB.CONFIG, M = ORB.M;
      lastViewW = viewW;
      if (A.list.length >= MAX_ALIVE) return;
      if (!M.chance(diff.asteroidRate * dt)) return;

      var fromLeft = M.chance(0.5);
      var side = fromLeft ? -1 : 1;
      var verts = [];
      var n = M.randInt(9, 12);
      for (var i = 0; i < n; i++) verts.push(M.rand(0.7, 1.2));

      A.list.push({
        x: C.WORLD_W / 2 + side * (viewW / 2 + 40),
        y: M.rand(camY - viewH * 0.45, camY + viewH * 0.15),
        vx: -side * M.rand(50, 120), // moving inward
        vy: M.rand(-20, 20),
        r: M.rand(10, 20),
        rot: M.rand(0, Math.PI * 2),
        rotSpeed: M.rand(-1.5, 1.5),
        verts: verts,
        missed: false // set once when it passes the player closely
      });
    },

    // Move, bend by planet gravity, rotate; destroy asteroids that hit a
    // planet body; remove far-outside asteroids. Returns the asteroid
    // hitting the player, or null.
    update: function (dt, player) {
      var C = ORB.CONFIG, M = ORB.M;
      var hit = null;
      var centerX = C.WORLD_W / 2;
      var keep = [];
      var planets = (ORB.Planets && ORB.Planets.list) || null;
      var hasGravity = !!(ORB.Physics && ORB.Physics.gravity);

      for (var i = 0; i < A.list.length; i++) {
        var a = A.list[i];

        if (hasGravity && planets) {
          var g = ORB.Physics.gravity(a.x, a.y, planets, null);
          a.vx += g.ax * GRAVITY_SCALE * dt;
          a.vy += g.ay * GRAVITY_SCALE * dt;
        }

        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.rot += a.rotSpeed * dt;

        // Hitting a planet body (or a black hole, which is a planet) destroys it.
        var destroyed = false;
        if (planets) {
          for (var p = 0; p < planets.length; p++) {
            var pl = planets[p];
            if (pl.dead) continue;
            if (M.circleHit(a.x, a.y, a.r, pl.x, pl.y, pl.radius)) {
              destroyed = true;
              break;
            }
          }
        }
        if (destroyed) {
          if (ORB.Particles && ORB.Particles.debris) {
            ORB.Particles.debris(a.x, a.y, '#a89a8a', 8);
          } else if (ORB.Particles && ORB.Particles.burst) {
            ORB.Particles.burst(a.x, a.y, '#a89a8a', 8, 120, 0.6);
          }
          continue;
        }

        if (!hit && M.circleHit(player.x, player.y, C.PLAYER_RADIUS,
                                a.x, a.y, a.r * 0.85)) {
          hit = a;
        }
        if (Math.abs(a.x - centerX) <= lastViewW) keep.push(a);
      }
      A.list = keep;
      return hit;
    },

    // Asteroids that passed within r + 22 of the player this frame without
    // hitting it. Each asteroid is returned only once (flag `missed`).
    // The returned array is reused: consume it before the next call.
    nearMiss: function (player) {
      var C = ORB.CONFIG, M = ORB.M;
      nearArr.length = 0;
      if (!player) return nearArr;

      for (var i = 0; i < A.list.length; i++) {
        var a = A.list[i];
        if (a.missed) continue;
        if (M.dist(player.x, player.y, a.x, a.y) >= a.r + NEAR_MISS_PAD) continue;
        if (M.circleHit(player.x, player.y, C.PLAYER_RADIUS,
                        a.x, a.y, a.r * 0.85)) continue; // a hit, not a miss
        a.missed = true;
        nearArr.push(a);
      }
      return nearArr;
    },

    destroy: function (a) {
      var idx = A.list.indexOf(a);
      if (idx !== -1) A.list.splice(idx, 1);
    },

    prune: function (bottomY) {
      A.list = A.list.filter(function (a) {
        return a.y - a.r <= bottomY;
      });
    }
  };

  ORB.Asteroids = A;
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var KINDS = ['shield', 'magnet', 'slow'];
  var RADIUS = 12;
  var MAGNET_SPEED = 420;
  var BOB_AMP = 3;      // gentle vertical bob, like stars
  var BOB_SPEED = 3;    // phase rad/s
  var LATCH_FALLBACK_PAD = 30;

  // True if (x, y) is outside every planet's latch zone, with margins for
  // the bob, the power-up radius and any planet drift (moveAmp).
  function fits(x, y) {
    var list = ORB.Planets.list;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var px = p.baseX !== undefined ? p.baseX : p.x;
      var latch = p.latchRadius || (p.orbitRadius + LATCH_FALLBACK_PAD);
      var reach = latch + RADIUS + BOB_AMP + (p.moveAmp || 0) + 2;
      if (ORB.M.dist(x, y, px, p.y) < reach) return false;
    }
    return true;
  }

  ORB.Powerups = {
    list: [],

    reset: function () {
      ORB.Powerups.list = [];
    },

    // With diff.powerChance, place one power-up near the midpoint of a and b.
    // Never placed between a blackhole and anything else.
    maybeSpawnBetween: function (a, b, diff) {
      if (!a || !b) return;
      if (a.type === 'blackhole' || b.type === 'blackhole') return;
      if (!ORB.M.chance(diff.powerChance)) return;
      var mx = (a.x + b.x) / 2;
      var my = (a.y + b.y) / 2;
      for (var tries = 0; tries < 10; tries++) {
        var x = mx + ORB.M.rand(-40, 40);
        var y = my + ORB.M.rand(-40, 40);
        if (fits(x, y)) {
          ORB.Powerups.list.push({
            x: x, y: y, r: RADIUS,
            baseX: x, baseY: y,          // bob is applied around the base position
            kind: ORB.M.pick(KINDS),
            phase: ORB.M.rand(0, Math.PI * 2),
            collected: false
          });
          return;
        }
      }
    },

    // Animate, magnet-pull (moves the base position), collect.
    // Returns array of collected kinds this frame.
    update: function (dt, player) {
      var C = ORB.CONFIG;
      var magnet = !!(player && player.magnetTime > 0);
      var kinds = [];
      var kept = [];
      var list = ORB.Powerups.list;

      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        p.phase += dt * BOB_SPEED;

        if (magnet) {
          var d = ORB.M.dist(p.baseX, p.baseY, player.x, player.y);
          if (d < C.MAGNET_RADIUS && d > 0) {
            var step = Math.min(d, MAGNET_SPEED * dt);
            p.baseX += (player.x - p.baseX) / d * step;
            p.baseY += (player.y - p.baseY) / d * step;
          }
        }

        p.x = p.baseX;
        p.y = p.baseY + Math.sin(p.phase) * BOB_AMP;

        if (player && ORB.M.circleHit(player.x, player.y, C.PLAYER_RADIUS, p.x, p.y, p.r)) {
          p.collected = true;
          kinds.push(p.kind);
        } else {
          kept.push(p);
        }
      }

      ORB.Powerups.list = kept;
      return kinds;
    },

    // Remove power-ups below the bottom edge of the view.
    prune: function (bottomY) {
      ORB.Powerups.list = ORB.Powerups.list.filter(function (p) {
        return p.baseY <= bottomY;
      });
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var MAX_ALIVE = 2;
  var TAIL_LEN = 18;
  var COMET_R = 7;

  // Append the comet's current position to its tail, reusing the oldest
  // point object once the tail is full (no per-frame allocation).
  function pushTail(c) {
    var t = c.tail.length >= TAIL_LEN ? c.tail.shift() : { x: 0, y: 0 };
    t.x = c.x;
    t.y = c.y;
    c.tail.push(t);
  }

  var Comets = {
    list: [],

    reset: function () {
      Comets.list = [];
    },

    // Spawn a comet entering from the top-left or top-right corner, moving
    // diagonally down and across the screen.
    maybeSpawn: function (dt, camY, viewW, viewH, diff) {
      var C = ORB.CONFIG, M = ORB.M;
      if (Comets.list.length >= MAX_ALIVE) return;
      if (!M.chance(diff.cometRate * dt)) return;

      var side = M.chance(0.5) ? -1 : 1; // -1 = left corner, 1 = right corner
      var speed = M.rand(260, 380);
      var angle = M.rand(0.5, 0.9); // radians below horizontal

      Comets.list.push({
        x: C.WORLD_W / 2 + side * (viewW / 2 + 30),
        y: camY - viewH / 2 - 30,
        vx: -side * speed * Math.cos(angle), // moving inward
        vy: speed * Math.sin(angle),
        r: COMET_R,
        tail: [],   // last TAIL_LEN positions, newest last
        used: false
      });
    },

    // Move comets and record their tails. Returns the first not-yet-ridden
    // comet the flying player touches (marked used), otherwise null.
    update: function (dt, player) {
      var M = ORB.M, C = ORB.CONFIG;
      var list = Comets.list;
      var i, c;

      for (i = 0; i < list.length; i++) {
        c = list[i];
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        pushTail(c);
      }

      if (!player || player.state !== 'fly') return null;

      for (i = 0; i < list.length; i++) {
        c = list[i];
        if (!c.used && M.circleHit(player.x, player.y, C.PLAYER_RADIUS,
                                   c.x, c.y, c.r + 10)) {
          c.used = true;
          return c;
        }
      }
      return null;
    },

    // Remove comets far below the view or that have left through the side
    // they were moving toward. In-place filter (no new array per call).
    prune: function (bottomY, viewW) {
      var C = ORB.CONFIG;
      var centerX = C.WORLD_W / 2;
      var half = viewW / 2 + 120;
      var list = Comets.list;
      var w = 0;

      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var below = c.y - c.r > bottomY;
        var offSide = (c.vx > 0 && c.x - centerX > half) ||
                      (c.vx < 0 && centerX - c.x > half);
        if (!below && !offSide) list[w++] = c;
      }
      list.length = w;
    }
  };

  ORB.Comets = Comets;
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  var RADIUS = 18;          // entry / exit trigger radius
  var COOLDOWN = 1;         // seconds before a pair can be used again
  var UP_BOOST = 80;        // extra upward speed after teleport (px/s)
  var EDGE_PAD = 30;        // keep ends at least this far from the world edges
  var END_GAP = 80;         // minimum distance between two wormhole ends
  var nextId = 0;

  function worldW() {
    return (ORB.CONFIG && ORB.CONFIG.WORLD_W) || 420;
  }

  // Radius around a planet that a wormhole must not enter.
  function avoidRadius(p) {
    var lr = p.latchRadius || ((p.orbitRadius || (p.radius || 20) + 26) + 30);
    return Math.max(lr, (p.radius || 0) * 1.5);
  }

  // True if (x, y) is inside the world, outside every latch zone and away from other ends.
  function fits(x, y) {
    var W = worldW();
    if (x < EDGE_PAD || x > W - EDGE_PAD) return false;
    var planets = (ORB.Planets && ORB.Planets.list) || [];
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      // distance to the planet's whole horizontal motion range (moving planets)
      var amp = p.moveAmp || 0, bx = amp > 0 && typeof p.baseX === 'number' ? p.baseX : p.x;
      var dx = Math.max(0, Math.abs(x - bx) - amp);
      if (Math.sqrt(dx * dx + (y - p.y) * (y - p.y)) < avoidRadius(p) + RADIUS + 10) return false;
    }
    var ends = ORB.Wormholes.list;
    for (var j = 0; j < ends.length; j++) {
      if (ORB.M.dist(x, y, ends[j].x, ends[j].y) < END_GAP) return false;
    }
    return true;
  }

  function makeEnd(x, y, isExit) {
    return {
      x: x, y: y, r: RADIUS, isExit: isExit, pair: null,
      phase: ORB.M.rand(0, Math.PI * 2), cooldown: 0, id: nextId++
    };
  }

  ORB.Wormholes = {
    list: [],

    reset: function () {
      ORB.Wormholes.list = [];
      nextId = 0;
    },

    // With diff.wormholeChance, place an entry in the gap between a and b (off to one side)
    // and its linked exit in the next gap above the upper planet.
    maybeSpawnBetween: function (a, b, diff) {
      if (!a || !b || !diff || !ORB.M.chance(diff.wormholeChance)) return;
      var upper = a.y <= b.y ? a : b;
      var lower = upper === a ? b : a;
      var W = worldW();
      var midX = (a.x + b.x) / 2;

      for (var tries = 0; tries < 12; tries++) {
        var side = Math.random() < 0.5 ? -1 : 1;
        var ex = ORB.M.clamp(midX + side * ORB.M.rand(70, 120), EDGE_PAD, W - EDGE_PAD);
        var ey = ORB.M.lerp(upper.y, lower.y, ORB.M.rand(0.35, 0.65));
        var xx = ORB.M.clamp(W - ex, EDGE_PAD, W - EDGE_PAD);
        var xy = upper.y - ORB.M.rand(160, 220);
        if (fits(ex, ey) && fits(xx, xy)) {
          var entry = makeEnd(ex, ey, false);
          var exit = makeEnd(xx, xy, true);
          entry.pair = exit;
          exit.pair = entry;
          ORB.Wormholes.list.push(entry, exit);
          return;
        }
      }
    },

    // Animate, count down cooldowns and teleport a flying player through an entry.
    // Returns { from, to } on teleport, otherwise null.
    update: function (dt, player) {
      var list = ORB.Wormholes.list;
      for (var i = 0; i < list.length; i++) {
        var w = list[i];
        w.phase += dt * 2;
        if (w.cooldown > 0) w.cooldown = Math.max(0, w.cooldown - dt);
      }
      if (!player || player.state !== 'fly') return null;

      for (var j = 0; j < list.length; j++) {
        var from = list[j];
        if (from.isExit || from.cooldown > 0 || !from.pair) continue;
        if (ORB.M.dist2(player.x, player.y, from.x, from.y) >= from.r * from.r) continue;

        var to = from.pair;
        player.x = to.x;
        player.y = to.y;
        player.vy -= UP_BOOST;                  // negative y is up
        player.speed = ORB.M.dist(0, 0, player.vx, player.vy);
        player.trail = [];                      // avoid a long streak across the map
        from.cooldown = COOLDOWN;
        to.cooldown = COOLDOWN;
        return { from: from, to: to };
      }
      return null;
    },

    // Remove pairs whose ends are both below the bottom edge of the view.
    prune: function (bottomY) {
      ORB.Wormholes.list = ORB.Wormholes.list.filter(function (w) {
        var highest = Math.min(w.y, w.pair ? w.pair.y : w.y);
        return highest <= bottomY;
      });
    }
  };
})();

<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // Satellite: held on a planet by an elastic tether, or flying under gravity.
  // All motion is delegated to ORB.Physics (stepTether / stepFree / launchVelocity).
  ORB.Player = {
    // New player settled on `planet`: bottom of the orbit, tangential speed, dir 1.
    create: function (planet) {
      var ang = Math.PI * 0.5;
      var d = planet.orbitRadius;
      var speed = planet.angularSpeed * d;
      // Tangent for dir 1: (-n.y, n.x) with n = (cos, sin).
      var tx = -Math.sin(ang);
      var ty = Math.cos(ang);
      var pvx = planet.vx || 0;
      var pvy = planet.vy || 0;
      return {
        x: planet.x + Math.cos(ang) * d,
        y: planet.y + Math.sin(ang) * d,
        vx: pvx + tx * speed,
        vy: pvy + ty * speed,
        state: 'orbit',
        planet: planet,
        fromPlanet: null,
        ignorePlanet: null,
        ignoreT: 0,
        angle: ang,
        dir: 1,
        latchT: 0,
        stretch: 0,
        flyTime: 0,
        boostT: 0,
        trail: [],
        shield: false,
        magnetTime: 0,
        slowTime: 0,
        speed: speed
      };
    },

    update: function (p, dt) {
      var C = ORB.CONFIG;
      if (p.state === 'orbit' && p.planet) {
        ORB.Physics.stepTether(p, dt, p.planet);
        p.latchT += dt;
      } else if (p.state === 'fly') {
        ORB.Physics.stepFree(p, dt, ORB.Planets.list, null);
        p.flyTime += dt;
        if (p.ignoreT > 0) p.ignoreT -= dt;
      }
      if (p.boostT > 0) p.boostT = Math.max(0, p.boostT - dt);

      // Trail: recycle the oldest point once full (no per-frame allocation).
      var tr = p.trail;
      var pt;
      if (tr.length >= C.TRAIL_LEN) {
        pt = tr.shift();
        while (tr.length >= C.TRAIL_LEN) tr.shift();
        pt.x = p.x;
        pt.y = p.y;
      } else {
        pt = { x: p.x, y: p.y };
      }
      tr.push(pt);
    },

    // Break orbit: keep momentum and add the launch boost along the tangent.
    launch: function (p) {
      if (p.state !== 'orbit' || !p.planet) return;
      var v = ORB.Physics.launchVelocity(p);
      p.vx = v.vx;
      p.vy = v.vy;
      p.fromPlanet = p.planet;
      p.ignorePlanet = p.planet;
      p.ignoreT = ORB.CONFIG.IGNORE_FROM_TIME;
      p.planet = null;
      p.state = 'fly';
      p.flyTime = 0;
      p.boostT = 0.35;
      p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    },

    // Latch onto `planet` from the current position/velocity (velocity is kept;
    // the tether springs it in). Returns impact strength 0..1.
    latch: function (p, planet) {
      var rx = p.x - planet.x;
      var ry = p.y - planet.y;
      var d = Math.sqrt(rx * rx + ry * ry) || 1;
      var nx = rx / d;
      var ny = ry / d;
      var rvx = p.vx - (planet.vx || 0);
      var rvy = p.vy - (planet.vy || 0);
      var cross = rx * rvy - ry * rvx;
      p.dir = cross >= 0 ? 1 : -1;
      p.angle = Math.atan2(ry, rx);
      p.state = 'orbit';
      p.planet = planet;
      p.latchT = 0;
      p.stretch = planet.orbitRadius > 0 ? (d - planet.orbitRadius) / planet.orbitRadius : 0;
      var rvLen = Math.sqrt(rvx * rvx + rvy * rvy);
      var radial = Math.abs(rvx * nx + rvy * ny);
      return clamp((radial + 0.3 * rvLen) / 700, 0, 1);
    },

    // Leave the current planet without a boost (e.g. it crumbled): keep velocity.
    release: function (p) {
      if (p.state !== 'orbit' || !p.planet) return;
      p.fromPlanet = p.planet;
      p.ignorePlanet = p.planet;
      p.ignoreT = ORB.CONFIG.IGNORE_FROM_TIME;
      p.planet = null;
      p.state = 'fly';
      p.flyTime = 0;
      p.boostT = 0;
      p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    },

    canLatch: function (p, planet) {
      return planet !== p.ignorePlanet || p.ignoreT <= 0;
    },

    // Unit tangent of the motion: orbit tangent around the planet, or velocity direction in flight.
    tangent: function (p) {
      if (p.state === 'fly') {
        var s = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (s > 1e-6) return { x: p.vx / s, y: p.vy / s };
      }
      return {
        x: -Math.sin(p.angle) * p.dir,
        y: Math.cos(p.angle) * p.dir
      };
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var ORB = window.ORB = window.ORB || {};

  // Read a CONFIG number with a fallback, so a missing key never yields NaN.
  function cfg(key, fallback) {
    var C = ORB.CONFIG || {};
    return typeof C[key] === 'number' ? C[key] : fallback;
  }

  // Points for each bonus kind (before combo multiplier) and the counter it increments.
  var BONUS = {
    slingshot: { key: 'SLINGSHOT_POINTS', fallback: 25, counter: 'slingshots' },
    comet:     { key: 'COMET_POINTS',     fallback: 15, counter: 'comets' },
    wormhole:  { key: 'WORMHOLE_POINTS',  fallback: 20, counter: 'wormholes' },
    nearMiss:  { key: null,               fallback: 10, counter: null }
  };

  ORB.Score = {
    value: 0,
    combo: 1,
    planets: 0,
    stars: 0,
    height: 0,
    slingshots: 0,
    comets: 0,
    wormholes: 0,
    perfectStreak: 0, // best perfect-capture streak this run
    streak: 0,        // current perfect-capture streak
    blackholePasses: 0,
    maxSpeed: 0,

    reset: function () {
      this.value = 0;
      this.combo = 1;
      this.planets = 0;
      this.stars = 0;
      this.height = 0;
      this.slingshots = 0;
      this.comets = 0;
      this.wormholes = 0;
      this.perfectStreak = 0;
      this.streak = 0;
      this.blackholePasses = 0;
      this.maxSpeed = 0;
    },

    // Called on capture. Quick flights (under PERFECT_TIME) build the combo, slow ones reset it.
    addPlanet: function (flyTime) {
      var perfect = flyTime < cfg('PERFECT_TIME', 0.75);
      if (perfect) {
        this.combo = Math.min(this.combo + 1, cfg('MAX_COMBO', 5));
        this.streak++;
        if (this.streak > this.perfectStreak) this.perfectStreak = this.streak;
      } else {
        this.combo = 1;
        this.streak = 0;
      }
      this.planets++;
      var points = cfg('PLANET_POINTS', 10) * this.combo;
      this.value += points;
      return { points: points, combo: this.combo, perfect: perfect };
    },

    // Called when a star is collected. Returns the points awarded.
    addStar: function () {
      var points = cfg('STAR_POINTS', 5) * this.combo;
      this.stars++;
      this.value += points;
      return points;
    },

    // Called for slingshots, comet rides, wormhole uses and near misses.
    // Returns the points awarded (base points x combo).
    addBonus: function (kind) {
      var b = BONUS[kind];
      if (!b) return 0;
      var base = b.key ? cfg(b.key, b.fallback) : b.fallback;
      var points = base * this.combo;
      if (b.counter) this[b.counter]++;
      this.value += points;
      return points;
    },

    // Height in "meters": one meter per 10 world px of progress above the start.
    setHeight: function (worldY) {
      this.height = Math.max(this.height, Math.round(-worldY / 10));
    },

    trackSpeed: function (s) {
      if (s > this.maxSpeed) this.maxSpeed = s;
    },

    // Snapshot of the current run, in the Stats shape from SPEC.md.
    stats: function () {
      return {
        score: this.value,
        planets: this.planets,
        stars: this.stars,
        height: this.height,
        slingshots: this.slingshots,
        comets: this.comets,
        wormholes: this.wormholes,
        perfectStreak: this.perfectStreak,
        blackholePasses: this.blackholePasses,
        maxSpeed: this.maxSpeed
      };
    }
  };
})();
